<style>
:root{--bg:#141c2a;--room:#1c2435;--desk:#232d40;--bd:#36415a;--tx:#e7eef8;--dim:#9dabc0;
--grn:#3fb950;--red:#f85149;--yel:#e3b341;--blu:#58a6ff;--pur:#c084fc;--org:#f5a524}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1300px 700px at 50% -12%,#25314a,var(--bg));
color:var(--tx);font:15px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;min-height:100vh}
a{color:var(--blu)}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 60px}

header{text-align:center;margin-bottom:18px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px}

.board{background:var(--room);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:18px 0}
.board .ko{font-size:15px;line-height:1.7}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-right:8px}
.b-green{background:#0f2a17;color:var(--grn);border:1px solid #1f5c2e}
.b-red{background:#2b1414;color:var(--red);border:1px solid #5c2626}
.b-yellow{background:#2a2410;color:var(--yel);border:1px solid #5c4a1a}
.b-gray{background:#1b2332;color:var(--dim);border:1px solid var(--bd)}

/* ══ 아이소메트릭 사무실 ══
   무대는 고정 좌표(980×590)로 그리고 화면 폭에 맞춰 통째로 scale 한다.
   % 로 배치하면 화면비가 바뀔 때 아이소메트릭 각도가 깨진다.
   외부 이미지·폰트는 쓰지 않는다 (file:// 과 GitHub Pages 양쪽에서 같아야 하므로). */
.floor{position:relative;margin-top:20px;border-radius:22px;overflow:hidden;isolation:isolate;
border:1px solid #35425f;
background:radial-gradient(120% 95% at 50% -8%,#2b3a58,#131b2b 72%),
linear-gradient(180deg,#1a2334,#10182a);
box-shadow:0 30px 70px -34px #000,inset 0 1px 0 #ffffff0d}
.stage{position:absolute;left:50%;top:0;width:980px;height:590px;
transform-origin:top center;margin-left:-490px}
.stage svg{display:block}


/* 에이전트 */
.actor{position:absolute;transform:translate(-50%,-100%) scale(var(--s,1));transform-origin:bottom center;
cursor:pointer;z-index:var(--z,200);
transition:left 1.45s cubic-bezier(.5,.02,.28,1),top 1.45s cubic-bezier(.5,.02,.28,1),
           transform .4s cubic-bezier(.34,1.4,.5,1),opacity .45s,filter .45s}
.actor:hover{transform:translate(-50%,-100%) scale(calc(var(--s,1) * 1.06))}
.actor .mini{display:block;margin:0 auto;filter:drop-shadow(0 10px 12px #0009);
animation:breathe 4s ease-in-out infinite}
.actor.talking{z-index:400}
#actors.focus .actor:not(.talking){opacity:.62;filter:saturate(.82)}
#actors.focus .actor:not(.talking) .tag{opacity:.45}
.actor.talking .mini{filter:drop-shadow(0 0 16px #7cc0ff66) drop-shadow(0 10px 12px #0009)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}

/* 걷기 — 팔다리를 번갈아 흔든다 */
.mini .lgA,.mini .lgB,.mini .arA,.mini .arB{transform-box:fill-box;transform-origin:50% 6%}
.actor.walk .mini{animation:bobwalk .46s ease-in-out infinite}
.actor.walk .lgA{animation:swA .46s ease-in-out infinite}
.actor.walk .lgB{animation:swB .46s ease-in-out infinite}
.actor.walk .arA{animation:swB .46s ease-in-out infinite}
.actor.walk .arB{animation:swA .46s ease-in-out infinite}
@keyframes bobwalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes swA{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
@keyframes swB{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
.mini .gl{fill:#ffffff1f;stroke:#8fa3c2;stroke-width:1.1}
.mini .gl path{stroke:#8fa3c2;fill:none}

.shadow{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
width:46px;height:12px;border-radius:50%;background:#000;opacity:.5;filter:blur(5px);z-index:-1}

/* 이름표 — 흐름에서 빼 발밑에 매단다 (안 그러면 캐릭터가 그만큼 떠오른다) */
.tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;
text-align:center;white-space:nowrap;pointer-events:none}
.tag b{display:inline-block;font-size:10.5px;font-weight:700;color:#e8eef8;
background:#0a101ec2;border:1px solid #ffffff14;border-radius:99px;padding:1.5px 8px;
backdrop-filter:blur(4px);text-shadow:0 1px 3px #000}
.tag i{display:block;font-style:normal;font-size:8.5px;color:#8fa3c0;margin-top:2px;
text-shadow:0 1px 5px #000;opacity:0;transition:.2s}
.actor:hover .tag i,.actor.talking .tag i{opacity:1}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grn);
margin-right:4px;vertical-align:middle;animation:pulse 1.7s infinite}
.dot.off{background:#5b6678;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* 말풍선 — 머리 '옆'으로. 위로 자라면 뒷줄 얼굴을 덮는다(실측) */
.say{position:absolute;top:-4px;width:max-content;max-width:250px;
background:linear-gradient(180deg,#fdfefe,#eaf0f8);color:#131c2b;
border-radius:15px;padding:10px 14px;font-size:12px;line-height:1.55;text-align:left;
box-shadow:0 20px 40px -12px #000e,0 0 0 1px #ffffff26;
opacity:0;pointer-events:none;transition:.34s cubic-bezier(.34,1.3,.5,1)}
.say::after{content:"";position:absolute;top:22px;border:8px solid transparent}
.say.r{left:calc(100% + 14px);transform-origin:left center;transform:translateX(-10px) scale(.94)}
.say.l{right:calc(100% + 14px);transform-origin:right center;transform:translateX(10px) scale(.94)}
.say.r::after{left:-8px;border-right-color:#f2f6fb;border-left:0}
.say.l::after{right:-8px;border-left-color:#f2f6fb;border-right:0}
.say.on{opacity:1;transform:translateX(0) scale(1)}
.say b{color:#0b57d0}
.say .who{display:block;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#5a6a86;margin-bottom:3px}

/* 컨트롤 */
.talkbar{position:absolute;left:14px;bottom:14px;z-index:500;
display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim);
background:#0a0f1ad9;backdrop-filter:blur(10px);border:1px solid #26314a;border-radius:99px;padding:5px 12px 5px 6px}
.tbtn{background:#1b2540;border:1px solid #33436a;color:var(--tx);border-radius:99px;
padding:5px 14px;cursor:pointer;font-size:11.5px;transition:.16s}
.tbtn:hover{border-color:var(--blu);background:#233152}

/* KPI 카드 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px;margin-top:14px}
.stat{position:relative;overflow:hidden;cursor:pointer;border-radius:15px;padding:13px 15px;
background:linear-gradient(180deg,#141d2e,#0f1725);border:1px solid #222d45;transition:.18s}
.stat:hover{transform:translateY(-3px);border-color:#3d5580;box-shadow:0 16px 28px -16px #000}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac,#58a6ff);opacity:.9}
.stat .sh{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.stat .sh b{font-size:12.5px}
.stat .job{font-size:9.5px;color:#8ea0ba;background:#1a2338;border:1px solid #2a3654;
border-radius:99px;padding:1px 8px;margin-left:auto}
.stat .num{font-size:23px;font-weight:800;color:#fff;line-height:1.1}
.stat .lab{font-size:9.5px;color:var(--dim);margin-top:1px}
.stat .ln{font-size:10.5px;line-height:1.55;color:#93a3ba;margin-top:7px}
.hint{text-align:center;color:var(--dim);font-size:11.5px;margin-top:12px}

.mhead .avatar .mini{animation:none;margin:0;filter:none}

@media (max-width:640px){
  .tag i{display:none}
  .say{max-width:190px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .actor{transition:none}
  .actor .mini,.actor.walk .mini,.actor.walk .lgA,.actor.walk .lgB,
  .actor.walk .arA,.actor.walk .arB,.dot{animation:none}
  .say{transition:opacity .2s}
}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{background:#238636;color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-weight:700;font-size:15px}
.btn:hover{background:#2ea043}
.btn2{background:var(--desk);color:var(--tx);border:1px solid var(--bd)}
.btn2:hover{border-color:var(--blu)}

/* ── 모달 ── */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;padding:18px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:820px;margin:24px auto;background:var(--room);border:1px solid var(--bd);border-radius:16px;padding:20px}
.mhead{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:14px}
.mhead .avatar{width:46px;flex:0 0 46px;animation:none}
.mhead h3{margin:0;font-size:19px}
.x{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--dim);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
.x:hover{color:var(--tx);border-color:var(--blu)}
.sec{background:#101724;border:1px solid var(--bd);border-radius:10px;padding:13px;margin-bottom:11px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.sec.duty{background:#0e1622;border-color:#2b3547}
.sec.duty h4{color:var(--org)}
.sec.brief{background:linear-gradient(180deg,#141d2e,#101724);border-color:#33405a}
.sec.brief h4{color:var(--blu);font-size:13px}
.sec.brief .pi{margin-bottom:12px}
.sec.brief .pi:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1c2433;font-size:13.5px}
.row:last-child{border:0}
.row b{color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#1b2332;border:1px solid var(--bd);border-radius:99px;padding:3px 11px;font-size:12px}
.note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
/* 긴 서술 정리 */
.pi{margin:0 0 10px;font-size:13.5px;line-height:1.75;color:var(--tx)}
.plist{margin:0;padding-left:20px;font-size:13.5px;line-height:1.8}
.plist li{margin-bottom:9px}
.plist li b{color:#fff}
.ref{font-size:10.5px;color:var(--blu);text-decoration:none;vertical-align:super}
.ref:hover{text-decoration:underline}
.quote{display:block;margin:6px 0;padding:7px 11px;border-left:3px solid var(--bd);
background:#0c121d;color:var(--dim);font-size:12px;line-height:1.6;font-style:italic}
/* ── 테마 카드 ── */
.themeCard{background:#0d141f;border:1px solid var(--bd);border-radius:11px;padding:13px;margin-top:11px}
.themeCard.lead{border-color:#4b3a72;background:linear-gradient(180deg,#141029,#0d141f)}
.themeTop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.themeTop b{font-size:15px;color:#fff}
.tag{font-size:10.5px;padding:2px 9px;border-radius:99px;background:#1b2332;border:1px solid var(--bd);color:var(--dim)}
.tag.lead{background:#2c1f4a;border-color:#5b46895e;color:var(--pur);font-weight:700}
.pi.lead{color:#e8eef7;font-size:14px}
.coGrid{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0}
.coGrp{background:#111a27;border:1px solid #232e40;border-radius:9px;padding:8px 10px;min-width:150px}
.coInd{font-size:10.5px;color:var(--blu);margin-bottom:5px;font-weight:600}
.co{display:flex;gap:7px;align-items:baseline;font-size:12px;padding:1.5px 0}
.co b{color:#fff;min-width:52px}
.co span{color:var(--dim);font-size:11.5px}
.whyWrap{margin-top:10px;padding-top:9px;border-top:1px solid #1e2837}
.whyLbl{font-size:10.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.3px}
.en{color:var(--dim);font-size:11px;font-weight:400}
.dim{color:var(--dim)}
/* 섹터·업종 표 */
.ctitle{font-size:12.5px;color:var(--blu);font-weight:700;margin-bottom:6px}
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{text-align:left;font-size:10.5px;color:var(--dim);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--bd)}
.ctab th:nth-child(2),.ctab th:nth-child(3){text-align:right}
.ctab td{padding:5px 6px;vertical-align:top}
.ctab td.num{text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-weight:700}
.ctab tr.tkRow td{padding:0 6px 7px;border-bottom:1px solid #1a2231}
.tkc{display:inline-block;background:#1b2332;border:1px solid #2b3547;border-radius:5px;
  padding:1px 6px;margin:2px 3px 0 0;font-size:10.5px;color:#b9c4d4}
.srcs{margin-top:11px;padding-top:9px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--dim)}
.srcs a{color:var(--dim);text-decoration:none}
.srcs a:hover{color:var(--blu)}
.more{background:none;border:0;color:var(--blu);cursor:pointer;font-size:12px;padding:2px 0}
.more:hover{text-decoration:underline}
/* ⚠️ 줄 수를 인라인 style 로 넣으면 인라인이 .clip.open 을 이겨서 '더보기'가 먹히지 않는다.
   줄 수는 CSS 변수로만 넘기고, 펼침은 클래스가 담당한다. */
.clip{display:-webkit-box;-webkit-line-clamp:var(--lines,3);-webkit-box-orient:vertical;overflow:hidden}
.clip.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.nosrc{color:var(--yel);font-size:12.5px}
.empty{color:var(--dim);text-align:center;padding:16px;font-size:13px}
.mhead .role{font-size:12px;color:var(--dim);margin-top:2px}
.disc{text-align:center;color:var(--dim);font-size:11.5px;margin-top:30px;line-height:1.8}
@media(max-width:560px){h1{font-size:21px}.stat{font-size:19px}.mini{width:52px}}
</style>

  숫자는 코드가 계산하고, 서술은 AI 가 담당하며, 모든 출처 URL 은 실제 접속 확인을 거칩니다.

<script>
const D={chief:window.CHIEF_DATA,t1:window.TEAM1_DATA,t2:window.TEAM2_DATA,t3:window.TEAM3_DATA,
         t4:window.TEAM4_DATA,t5:window.TEAM5_DATA,cc:window.CHARTCHECK_DATA};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>v==null||Number.isNaN(Number(v))?'—':Number(v).toFixed(d);
const tp=v=>v==null?'—':(100-Number(v)).toFixed(1);

/* 팀별 담당자 — 이름·머리모양·옷색은 취향껏 바꾸셔도 됩니다.
   look = {skin, hair, style, shirt, glasses, tie} 로 미니미 SVG 가 생성됩니다.
   style: short | long | bun | spiky | bob | part */
const AGENTS=[
  {id:'t1',emoji:'🔭',name:'한별',role:'1팀 · 시장환경',tab:'t1',job:'시장 신호등',
   duty:'지금 주식을 사도 되는 때인지 아닌지를 판단합니다. 나스닥100(QQQ)의 10·20·50일 평균선 배열을 보고 초록/노랑/빨강으로 신호를 매기고, 사람들이 빚내서 주식을 얼마나 샀는지(마진부채)를 1년 전과 비교해 과열을 경고합니다. 매일 아침 시장 뉴스도 쉬운 말로 풀어 드립니다.',
   look:{skin:'#f3d0b4',hair:'#3b2a24',style:'long', shirt:'#5b8def',glasses:true}},
  {id:'t2',emoji:'🎯',name:'도윤',role:'2팀 · 종목선정',tab:'t2',job:'종목 발굴',
   duty:'1,400여 개 미국 주식을 매일 훑어 오늘 가장 강한 종목만 추려냅니다. 기준은 세 가지 — ①시장보다 얼마나 앞서갔는지(RS)가 상위 2% ②하루 변동폭(ADR)이 4% 이상 ③주가가 150일 평균선 위. 그런 다음 뽑힌 종목들이 서로 무슨 공통점으로 묶이는지(테마·섹터·업종)를 정리하고, 왜 올랐는지를 실제 기사와 증권사 자료로 조사합니다.',
   look:{skin:'#eec59f',hair:'#1f1a17',style:'short',shirt:'#3fb27f'}},
  {id:'t3',emoji:'📋',name:'수아',role:'3팀 · 추적관리',tab:'t3',job:'보유 관리',
   duty:'한 번 뽑힌 종목을 계속 따라다니며 상태를 기록합니다. ①50일선 아래로 3일 연속 내려가거나 ②고점 대비 40% 넘게 빠지거나 ③150일선을 깨면 목록에서 뺍니다. 뺀 뒤에도 사유와 함께 남겨두고, 다시 기준을 충족하면 자동으로 되돌립니다. 전고점을 거래량까지 실어 뚫은 종목도 찾아 알려 드립니다.',

/* ── 색 보조 ── */
function shade(c,f){
  const m=/^#(..)(..)(..)$/.exec(c); if(!m)return c;
  const v=i=>{const x=Math.round(parseInt(m[i],16)*f);return Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0');};
  return '#'+v(1)+v(2)+v(3);
}
function tint(c,f){  // 흰색 쪽으로 f 만큼
  const m=/^#(..)(..)(..)$/.exec(c); if(!m)return c;
  const v=i=>{const x=parseInt(m[i],16);return Math.round(x+(255-x)*f).toString(16).padStart(2,'0');};
  return '#'+v(1)+v(2)+v(3);
}

/* ── 각 자리에 표시할 핵심 수치 ── */
function _dd(id){
  if(id==='t1'){
    const q=(D.t1&&D.t1.qqq)||{};
    return {stat:q.verdict?({green:'🟢',yellow:'🟡',red:'🔴'}[q.verdict]||'⚪'):'—',
      statl:'QQQ 쿨라매기 판정',
      line:D.t1?`MA10 ${n(q.ma10)} / MA20 ${n(q.ma20)}<br>주도주 ${(D.t1.leaders&&D.t1.leaders.stocks||[]).length}종목 감시 중`:'대기 중',
      busy:!!D.t1};
  }
  if(id==='t2'){
    const t=D.t2,rc=(t&&t.research_coverage)||{},th=(t&&t.themes)||{};
    return {stat:t?(t.picks||[]).length:'—',statl:'오늘 선정 종목',
      line:t?`${esc(String(th.headline||'테마 정리 전'))}<br>리서치 ${rc.done??0}/${rc.total??(t.picks||[]).length}`:'대기 중',
      busy:!!t};
  }
  if(id==='t3'){
    const s=(D.t3&&D.t3.summary)||{};
    return {stat:s.active??'—',statl:'추적 활성 종목',
      line:D.t3?`배제 ${s.excluded} · 오늘 탈락 ${(D.t3.dropped_today||[]).length}<br>전고점 돌파 ${(D.t3.breakouts||[]).length}종목`:'대기 중',
      busy:!!D.t3};
  }
  if(id==='t4'){
    const t=D.t4;
    const hl=t&&t.llm&&t.llm.highlights?t.llm.highlights.length:0;
    return {stat:t?t.universeHits:'—',statl:'거래량 급증 포착',
      line:t?`분석 ${t.analyzed}종목${hl?` · ★촉매 ${hl}건`:''}<br>${Object.entries(t.byPhase||{}).filter(([k])=>k!=='none').map(([k,v])=>k+' '+v).join(' · ')||'셋업 없음'}`:'대기 중',
      busy:!!t};
  }
  if(id==='t5'){
    const t=D.t5;
    const m6=(t&&t.strictTop2&&t.strictTop2.m6)||[];
    const top=m6[0];
    return {stat:t?m6.length:'—',statl:'상위 2% 업종 (6개월)',
      line:t?(top?`1위 ${esc(top.industry)}<br>WRS ${n(top.wrs&&top.wrs.m6,3)} · 상위 ${n(top.rankPct&&top.rankPct.m6,2)}%`:'해당 업종 없음'):'대기 중',
      busy:!!t};
  }
  const cc=(D.cc&&D.cc.items)||[];
  return {stat:cc.length,statl:'👁️ 오늘 차트를 봐야 할 종목',
    line:cc.length?cc.map(x=>esc(x.ticker)).join(' · '):'오늘은 수렴 조건 만족 종목 없음',
    busy:!!D.chief};
}

    ? `정리하죠. 오늘은 <b>사지 않는 날</b>입니다. 관심종목만 정리해 둡시다.`
    : m.verdict==='green' ? `좋습니다. 오늘은 <b>준비된 셋업을 실행</b>하죠.`
    : `오늘은 <b>확실한 것만</b> 갑니다. 포지션은 줄이고요.`});
  if(cc.length)L.push({who:'chief',t:`사장님, <b>${cc.map(x=>esc(x.ticker)).join(', ')}</b> 이 ${cc.length}종목만 직접 차트 봐주세요. 수렴이 진행 중입니다.`});
  L.push({who:'chief',t:`저를 클릭하시면 <b>전체 보고서</b>를 올려드리겠습니다.`});
  return L;
}

/* ══ 사무실 무대 ══
   좌표는 전부 % (가로,세로). 화면 크기가 변해도 배치가 유지된다.
   HOME  = 평소 자리(책상)
   STAGE = 발언하러 나오는 자리 — 자기 책상에서 회의 테이블 쪽으로 비스듬히 걸어 나온다.
   깊이감: 아래쪽(y 큼)일수록 크게 그리고 앞에 겹치게 한다. */
/* ══ 아이소메트릭 무대 ══
   내부 좌표는 고정(STAGE_W×STAGE_H)이고, 화면 폭에 맞춰 통째로 scale 한다.
   그래야 원근이 어긋나지 않는다 (% 배치는 화면비가 바뀌면 아이소 각도가 깨진다).
   격자(gx,gy) → 화면(x,y) 변환은 2:1 아이소메트릭. */
const STAGE_W=915,STAGE_H=612;
const TW=76,TH=38;                 // 타일 폭·높이 (2:1)
const ORG={x:362,y:152};           // 격자 원점 — 방이 무대에 꽉 차도록 잡았다
const iso=(gx,gy)=>[ORG.x+(gx-gy)*TW/2, ORG.y+(gx+gy)*TH/2];

/* 자리 (격자 좌표) */
const DESK={t1:[1.2,0.4],t2:[3.6,0.4],t3:[6.0,0.4],t4:[8.4,0.4],t5:[10.8,0.4]};
const HOME ={t1:[1.95,1.7],t2:[4.35,1.7],t3:[6.75,1.7],t4:[9.15,1.7],t5:[11.55,1.7],chief:[1.5,6.3]};
const STAGE={t1:[4.6,4.2],t2:[5.8,6.6],t3:[7.0,2.5],t4:[8.4,6.6],t5:[9.6,4.2],chief:[3.2,6.6]};
const TABLE=[7.0,4.6];
/* 회의가 끝난 뒤 서성일 곳 — 자리 근처만 맴돌면 어색하다.
   커피 코너·창가·프린터·화이트보드처럼 '갈 이유가 있는' 지점으로 보낸다. */
const SPOTS=[
  {g:[13.0,7.9],ko:'커피 코너'},{g:[0.9,3.2],ko:'창가'},
  {g:[13.2,2.2],ko:'프린터'},  {g:[3.4,7.4],ko:'화이트보드'},
  {g:[3.0,3.4],ko:'복도'},     {g:[10.6,7.6],ko:'라운지'},
];
const reduce=()=>window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function place(id,g,walking){
  const el=$('ac-'+id); if(!el)return;
  const [gx,gy]=g,[x,y]=iso(gx,gy);
  const moving=walking&&!reduce()&&(el.style.left!==x+'px'||el.style.top!==y+'px');
  el.style.left=x+'px'; el.style.top=y+'px';
  // 뒤쪽(격자 합이 작은 쪽)일수록 작게 + 뒤에 깔린다
  el.style.setProperty('--s',(0.84+(gx+gy)*0.028).toFixed(3));
  el.style.setProperty('--z',String(200+Math.round((gx+gy)*10)));
  if(moving){
    el.classList.add('walk');
    clearTimeout(el._wt);
    el._wt=setTimeout(()=>el.classList.remove('walk'),1450);
  }
}

/* 아이소메트릭 상자 하나 (윗면 + 왼쪽면 + 오른쪽면) */
function isoBox(gx,gy,w,d,hgt,top,left,right){
  const P=(a,b,dy)=>{const[x,y]=iso(a,b);return `${x},${y-dy}`;};
  return `<polygon points="${P(gx,gy,hgt)} ${P(gx+w,gy,hgt)} ${P(gx+w,gy+d,hgt)} ${P(gx,gy+d,hgt)}" fill="${top}"/>
  <polygon points="${P(gx,gy+d,hgt)} ${P(gx+w,gy+d,hgt)} ${P(gx+w,gy+d,0)} ${P(gx,gy+d,0)}" fill="${left}"/>
  <polygon points="${P(gx+w,gy,hgt)} ${P(gx+w,gy+d,hgt)} ${P(gx+w,gy+d,0)} ${P(gx+w,gy,0)}" fill="${right}"/>`;
}

/* 방 — 바닥·벽·창문·책상·회의테이블·러그·화분을 통째로 그린다 */
function roomSVG(){
  const GX=14,GY=9,WH=140;                    // 격자 크기 · 벽 높이(px)
  const p=(a,b,dy)=>{const[x,y]=iso(a,b);return `${x},${(y-(dy||0))}`;};
  const wallWin=(gx,gy,along,n)=>{            // 벽에 붙는 창 n개
    let s='';
    for(let i=0;i<n;i++){
      const a=gx+(along?i*1.55+.5:0),b=gy+(along?0:i*1.55+.5);
      const a2=along?a+1.1:a,b2=along?b:b+1.1;
      s+=`<polygon points="${p(a,b,WH-22)} ${p(a2,b2,WH-22)} ${p(a2,b2,32)} ${p(a,b,32)}"
        fill="url(#winG)" stroke="#54688f" stroke-width="1.2"/>
      <polygon points="${p(a,b,WH-58)} ${p(a2,b2,WH-58)} ${p(a2,b2,WH-74)} ${p(a,b,WH-74)}"
        fill="url(#cloud)" opacity=".5"/>`;
    }
    return s;
  };
  // 책상 = 상판 + 모니터 + 소품(머그·서류·스탠드). 소품이 있어야 '쓰는 책상'으로 보인다.
  const DH=26;                                     // 책상 높이
  const desks=Object.entries(DESK).map(([id,[gx,gy]])=>{
    const mug=(()=>{const[x,y]=iso(gx+1.0,gy+.52);return `
      <ellipse cx="${x}" cy="${y-DH-7}" rx="4.2" ry="2.1" fill="#e8eef7"/>
      <path d="M${x-4.2} ${y-DH-7}v4.4q0 2.6 4.2 2.6t4.2-2.6v-4.4z" fill="#d3dcea"/>
      <path d="M${x+4.4} ${y-DH-6.2}q3.2.3 3.2 2.4t-3.2 2.2" fill="none" stroke="#d3dcea" stroke-width="1.2"/>`;})();
    const paper=(()=>{const[x,y]=iso(gx+.28,gy+.56);return `
      <g transform="translate(${x} ${y-DH-2})">
        <polygon points="0,-3 13,3.5 0,10 -13,3.5" fill="#eef3fa"/>
        <polygon points="0,-6 13,.5 0,7 -13,.5" fill="#f8fbff"/>
        <polygon points="0,-6 13,.5 0,7 -13,.5" fill="none" stroke="#c3cfe0" stroke-width=".7"/>
      </g>`;})();
    const lamp=(()=>{const[x,y]=iso(gx+.92,gy+.14);return `
      <path d="M${x} ${y-DH-2}v-13" stroke="#7f8ca6" stroke-width="1.6"/>
      <path d="M${x-5} ${y-DH-15}h10l-2.5 5h-5z" fill="#e8c489"/>
      <ellipse cx="${x}" cy="${y-DH-2}" rx="4" ry="2" fill="#7f8ca6"/>
      <ellipse cx="${x}" cy="${y-DH-7}" rx="11" ry="6" fill="#ffd79a" opacity=".14"/>`;})();
    return isoBox(gx,gy,1.15,.72,DH,'#54628a','#333f5d','#42506f')
      + `<g>${isoBox(gx+.32,gy+.18,.5,.06,30,'#1d2b40','#16202f','#1a2537')}</g>`
      + paper + mug + lamp;
  }).join('');

  return `<svg viewBox="0 0 ${STAGE_W} ${STAGE_H}" width="${STAGE_W}" height="${STAGE_H}">
  <defs>
    <linearGradient id="flG" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#3a4a68"/><stop offset="1" stop-color="#28334a"/></linearGradient>
    <linearGradient id="wlL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43547a"/><stop offset="1" stop-color="#2e3b58"/></linearGradient>
    <linearGradient id="wlR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e6188"/><stop offset="1" stop-color="#354564"/></linearGradient>
    <linearGradient id="winG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc0f5"/><stop offset=".45" stop-color="#a9d8f7"/>
      <stop offset=".74" stop-color="#dcefff"/><stop offset=".82" stop-color="#8fb3cc"/>
      <stop offset="1" stop-color="#5c7d99"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#ffdca8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffc06a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#cfe8ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#8fc4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="tbl"><stop offset="0" stop-color="#4a5a80"/><stop offset="1" stop-color="#2f3b57"/></radialGradient>
  </defs>

  <!-- 왼쪽 벽 -->
  <polygon points="${p(0,0,WH)} ${p(0,GY,WH)} ${p(0,GY)} ${p(0,0)}" fill="url(#wlL)"/>
  ${wallWin(0,0,false,6)}
  <!-- 오른쪽 벽 -->
  <polygon points="${p(0,0,WH)} ${p(GX,0,WH)} ${p(GX,0)} ${p(0,0)}" fill="url(#wlR)"/>
  ${wallWin(0,0,true,8)}
  <!-- 바닥 -->
  <polygon points="${p(0,0)} ${p(GX,0)} ${p(GX,GY)} ${p(0,GY)}" fill="url(#flG)"/>
  <g stroke="#ffffff14" stroke-width="1">
    ${Array.from({length:Math.floor(GX)+1},(_,i)=>`<line x1="${iso(i,0)[0]}" y1="${iso(i,0)[1]}" x2="${iso(i,GY)[0]}" y2="${iso(i,GY)[1]}"/>`).join('')}
    ${Array.from({length:Math.floor(GY)+1},(_,i)=>`<line x1="${iso(0,i)[0]}" y1="${iso(0,i)[1]}" x2="${iso(GX,i)[0]}" y2="${iso(GX,i)[1]}"/>`).join('')}
  </g>
  <!-- 조명 웅덩이 -->
  <ellipse cx="${iso(2,2)[0]}" cy="${iso(2,2)[1]}" rx="170" ry="86" fill="url(#cool)"/>
  <ellipse cx="${iso(6.5,2)[0]}" cy="${iso(6.5,2)[1]}" rx="170" ry="86" fill="url(#cool)"/>
  <ellipse cx="${iso(TABLE[0],TABLE[1])[0]}" cy="${iso(TABLE[0],TABLE[1])[1]}" rx="200" ry="100" fill="url(#lamp)"/>
  <!-- 러그 -->
  <polygon points="${p(4.6,2.6)} ${p(9.6,2.6)} ${p(9.6,7.0)} ${p(4.6,7.0)}" fill="#27334b" opacity=".9"/>
  <polygon points="${p(4.8,2.8)} ${p(9.4,2.8)} ${p(9.4,6.8)} ${p(4.8,6.8)}" fill="none" stroke="#42527a" stroke-width="1.5"/>
  <!-- 회의 테이블 -->
  <ellipse cx="${iso(TABLE[0],TABLE[1])[0]}" cy="${iso(TABLE[0],TABLE[1])[1]-20}" rx="126" ry="63" fill="url(#tbl)" stroke="#3d4a6a" stroke-width="1.5"/>
  <ellipse cx="${iso(TABLE[0],TABLE[1])[0]}" cy="${iso(TABLE[0],TABLE[1])[1]-16}" rx="126" ry="63" fill="#0b101c" opacity=".55"/>
  <ellipse cx="${iso(TABLE[0],TABLE[1])[0]}" cy="${iso(TABLE[0],TABLE[1])[1]-20}" rx="126" ry="63" fill="url(#tbl)"/>
  <ellipse cx="${iso(TABLE[0],TABLE[1])[0]}" cy="${iso(TABLE[0],TABLE[1])[1]-24}" rx="96" ry="46" fill="#ffffff06"/>
  <!-- 책상 -->
  ${desks}
  <!-- 실장 책상 -->
  ${isoBox(0.7,5.5,1.6,.85,28,'#56648c','#343f5e','#43506f')}

  <!-- 가구 — 서성이는 목적지(SPOTS)에 실제로 물건을 둔다.
       빈 바닥을 채우면서 "저기로 왜 가는지"가 화면에서 읽히게 한다. -->
  <!-- 커피 코너 -->
  ${isoBox(12.4,7.2,1.5,.9,34,'#4a5a80','#2e3a56','#3b4966')}
  ${isoBox(12.6,7.4,.55,.5,58,'#6d7ea6','#414f70','#54648a')}
  ${(()=>{const[x,y]=iso(13.1,7.75);return `<ellipse cx="${x}" cy="${y-36}" rx="5" ry="2.4" fill="#e8eef7"/>`;})()}
  <!-- 프린터 -->
  ${isoBox(12.7,1.5,1.1,.8,30,'#4f5f85','#313d5b','#3f4d6c')}
  ${isoBox(12.85,1.7,.7,.45,42,'#8d9cbe','#5a688c','#6f7ea3')}
  <!-- 라운지 소파 -->
  ${isoBox(9.6,7.3,1.9,1.0,20,'#4d5f88','#2f3b58','#3d4b6c')}
  ${isoBox(9.6,7.3,1.9,.28,44,'#5a6d99','#374463','#46567b')}
  <!-- 화이트보드 이젤 -->
  ${(()=>{const[x,y]=iso(2.7,7.8);return `
    <path d="M${x-22} ${y} l14-8 M${x+22} ${y} l-14-8" stroke="#5c6a8c" stroke-width="2.4"/>
    <rect x="${x-30}" y="${y-62}" width="60" height="42" rx="3" fill="#eef3fa" stroke="#8fa0bd"/>
    <path d="M${x-22} ${y-50}h30M${x-22} ${y-42}h44M${x-22} ${y-34}h22" stroke="#9fb0cb" stroke-width="2.4" stroke-linecap="round"/>`;})()}
  <!-- 화분 -->
  ${[[0.35,8.3],[13.5,8.3]].map(([gx,gy])=>{const[x,y]=iso(gx,gy);return `
    <ellipse cx="${x}" cy="${y}" rx="15" ry="7" fill="#0a0f1a" opacity=".6"/>
    <path d="M${x-9} ${y-2}h18l-3 16h-12z" fill="#3a2f26"/>
    <circle cx="${x-6}" cy="${y-14}" r="9" fill="#2f6b4a"/><circle cx="${x+6}" cy="${y-13}" r="8" fill="#28603f"/>
    <circle cx="${x}" cy="${y-22}" r="9.5" fill="#347a53"/>`;}).join('')}
  </svg>`;
}

function fitStage(){
  const wrap=$('floor'); if(!wrap)return;
  // 폭과 높이 둘 다 본다 — 폭만 맞추면 세로가 화면을 넘어간다
  const maxH=Math.min(700,Math.max(400,innerHeight*0.66));
  const k=Math.min(1.5,wrap.clientWidth/STAGE_W,maxH/STAGE_H);
  const st=$('stage');
  st.style.transform=`scale(${k})`;
  wrap.style.height=Math.round(STAGE_H*k)+'px';
}

function office(){
  $('room').innerHTML=roomSVG();

  $('actors').innerHTML=AGENTS.map(a=>{
    const d=_dd(a.id);
    return `<div class="actor" id="ac-${a.id}" data-id="${a.id}" title="${esc(a.name)} — 클릭하면 상세">
      <div class="say" id="say-${a.id}"></div>
      <div class="shadow"></div>
      ${mini(a,a.wide?100:92)}
      <div class="tag"><b><span class="dot ${d.busy?'':'off'}"></span>${esc(a.name)}</b><i>${esc(a.job||'')}</i></div>
    </div>`;
  }).join('');
  AGENTS.forEach(a=>place(a.id,HOME[a.id],false));
  document.querySelectorAll('.actor').forEach(e=>e.onclick=()=>openAgent(e.dataset.id));

  fitStage();
  addEventListener('resize',fitStage);

  // KPI 는 바닥에서 빼내 아래 카드로. 사무실이 표처럼 보이지 않게.
  const AC={t1:'#58a6ff',t2:'#3fb27f',t3:'#c084fc',t4:'#f5a524',t5:'#2fb3ba',chief:'#e3b341'};
  $('stats').innerHTML=AGENTS.map(a=>{
    const d=_dd(a.id);
    return `<div class="stat" data-id="${a.id}" style="--ac:${AC[a.id]}">
      <div class="sh"><b>${esc(a.name)}</b><span class="job">${esc(a.job||'')}</span></div>
      <div class="num">${d.stat}</div><div class="lab">${esc(d.statl)}</div>
      <div class="ln">${d.line||''}</div></div>`;
  }).join('');
  document.querySelectorAll('.stat').forEach(e=>e.onclick=()=>openAgent(e.dataset.id));

  runDialog();
}

/* ══ 회의 재생 ══
   발언자는 책상에서 걸어 나와 말하고, 끝나면 제자리로 돌아간다.
   회의가 끝나면 가끔 한 명씩 자리 주변을 서성이게 해 사무실이 멈춰 보이지 않게 한다. */
let _timer=null,_wander=null;
function clearSays(){document.querySelectorAll('.say').forEach(b=>b.classList.remove('on'));}

function runDialog(){
  const L=dialog();
  clearTimeout(_timer); clearInterval(_wander);
  clearSays();
  AGENTS.forEach(a=>place(a.id,HOME[a.id],false));
  let i=0,prev=null;

  const step=()=>{
    clearSays();
    if(prev){document.getElementById('ac-'+prev)?.classList.remove('talking');place(prev,HOME[prev],true);}
    if(i>=L.length){
      $('actors').classList.remove('focus');
      $('turn').textContent='회의 종료 — 담당자를 클릭해 보세요';
      startWander();
      return;
    }
    const cur=L[i],a=AGENTS.find(x=>x.id===cur.who);
    const el=$('ac-'+cur.who),say=$('say-'+cur.who);
    if(el&&say){
      el.classList.add('talking');
      $('actors').classList.add('focus');
      place(cur.who,STAGE[cur.who]||HOME[cur.who],true);
      // 다 걸어 나온 뒤에 말풍선을 띄운다 (걸으면서 말하면 꼬리가 따로 논다)
      // 무대 왼쪽에 서면 오른쪽으로, 오른쪽에 서면 왼쪽으로 — 항상 무대 안쪽을 향한다
      const g=STAGE[cur.who]||HOME[cur.who];
      say.className='say '+(iso(g[0],g[1])[0]<STAGE_W/2?'r':'l');
      const delay=reduce()?0:520;
      setTimeout(()=>{
        say.innerHTML=`<span class="who">${esc(a?a.name:'')}</span>${cur.t}`;
        say.classList.add('on');
      },delay);
    }
    $('turn').textContent=`${i+1} / ${L.length}`;
    prev=cur.who; i++;
    const ms=Math.min(7000,Math.max(3000,String(cur.t).replace(/<[^>]+>/g,'').length*95));
    _timer=setTimeout(step,ms);
  };
  step();
}

/* 회의가 끝난 뒤의 잔잔한 움직임.
   ⚠️ 자리 근처만 맴돌면 "왔다갔다"로만 보이고 사무실 같지 않다.
      커피 코너·창가·프린터처럼 갈 이유가 있는 곳으로 보내고, 가끔은 동료 자리로 찾아가
      잠깐 이야기하게 한다. 같은 사람이 연달아 움직이지 않게 하고 목적지도 겹치지 않게 한다. */
let _busy=new Set(),_lastMover=null;
function wanderOnce(){
  if($('modal').classList.contains('on'))return;          // 상세를 보는 중이면 가만히
  const free=AGENTS.filter(a=>!_busy.has(a.id)&&a.id!==_lastMover);
  if(!free.length)return;
  const a=free[Math.floor(Math.random()*free.length)];
  _lastMover=a.id; _busy.add(a.id);

  // 60% 는 장소로, 40% 는 동료 자리로 (찾아가서 잠깐 이야기)
  const visitPeer=Math.random()<0.4;
  let to,peer=null;
  if(visitPeer){
    const others=AGENTS.filter(x=>x.id!==a.id&&!_busy.has(x.id));
    peer=others[Math.floor(Math.random()*others.length)];
    if(peer){const[px,py]=HOME[peer.id];to=[px-0.95,py+0.35];}   // 옆에 가서 선다
  }
  if(!to){const sp=SPOTS[Math.floor(Math.random()*SPOTS.length)];to=sp.g;}

  place(a.id,to,true);
  const stay=2600+Math.random()*2600;
  if(peer){
    // 도착하면 짧게 한마디 — 회의 대사가 아니라 잡담이라 데이터를 만들지 않는다
    setTimeout(()=>{
      const say=$('say-'+a.id); if(!say)return;
      say.className='say '+(iso(to[0],to[1])[0]<STAGE_W/2?'r':'l');
      say.innerHTML='<span class="who">'+esc(a.name)+'</span>💬';
      say.classList.add('on');
      setTimeout(()=>say.classList.remove('on'),Math.max(900,stay-1800));
    },1500);
  }
  setTimeout(()=>{
    place(a.id,HOME[a.id],true);
    setTimeout(()=>_busy.delete(a.id),1500);
  },stay);
}
function startWander(){
  clearInterval(_wander);
  _busy.clear(); _lastMover=null;
  if(reduce())return;
  _wander=setInterval(wanderOnce,3200);

/* ── 긴 서술 정리 ──
   LLM 이 돌려주는 why/summary 는 URL 이 문장 한가운데 박혀 있고 (1)(2)(3) 이 한 줄에 붙어 있어
   그대로 뿌리면 글 덩어리가 된다. 여기서 세 가지만 한다.
     ① 인라인 URL 을 빼내 각주 링크로 내린다 (본문에는 [1] 위첨자만 남는다)
     ② (1)(2)(3) / ①②③ 로 나뉜 항목을 <ol> 로 쪼갠다
     ③ 40자 넘는 따옴표 인용은 인용 블록으로 뺀다
   ⚠️ 내용을 자르지 않는다. 재배치만 한다. */
function prose(text){
  if(text==null||text==='')return '<div class="note">내용 없음</div>';
  if(Array.isArray(text))return text.map(x=>prose(x)).join('');
  if(typeof text==='object')return prose(text.statement||text.text||text.why||JSON.stringify(text));

  let s=String(text).trim();
  if(!s)return '<div class="note">내용 없음</div>';

  // ① URL 추출 — 문장 끝의 구두점은 URL 에 포함시키지 않는다
  const refs=[];
  const MK=String.fromCharCode(1);   // 각주 자리표시 센티널 (본문 숫자와 절대 안 겹친다)
  s=s.replace(/https?:\/\/[^\s<>"')\]]+/g,(u)=>{
    const url=u.replace(/[.,;:]+$/,'');
    let i=refs.indexOf(url);
    if(i<0){refs.push(url);i=refs.length-1;}
    return MK+(i+1)+MK;
  });

  // ② 항목 분리 — (1) 또는 ① 로 시작하는 조각이 2개 이상일 때만
  const marks=s.match(/(?:\(\d\)|[①②③④⑤⑥⑦⑧⑨])/g)||[];
  let items=null;
  if(marks.length>=2){
    items=s.split(/(?=\(\d\)|[①②③④⑤⑥⑦⑧⑨])/).map(x=>x.trim()).filter(Boolean);
    if(items.length<2)items=null;
  }

  // 이스케이프 후 각주 마커·인용을 HTML 로 되돌린다
  const render=(str)=>{
    let h=esc(str);
    h=h.replace(new RegExp(MK+'(\\d+)'+MK,'g'),(m,i)=>
      `<a class="ref" href="${esc(refs[i-1])}" target="_blank" rel="noopener">[${i}]</a>`);
    // ③ 긴 인용문 분리
    h=h.replace(/&quot;([^&]{40,}?)&quot;/g,'<span class="quote">$1</span>');
    return h;
  };

  let out;
  if(items){
    out='<ol class="plist">'+items.map(x=>
      `<li>${render(x.replace(/^(?:\(\d\)|[①②③④⑤⑥⑦⑧⑨])\s*/,''))}</li>`).join('')+'</ol>';
  }else{
    // 문장 3개 이상이면 문단으로 나눠 읽기 쉽게
    const paras=s.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
    out=paras.map(p=>`<p class="pi">${render(p)}</p>`).join('');
  }

  if(refs.length)
    out+='<div class="note">출처 '+refs.map((u,i)=>
      `<a class="ref" href="${esc(u)}" target="_blank" rel="noopener">[${i+1}]</a> ${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,46))}${u.length>60?'…':''}`
    ).join(' · ')+'</div>';
  return out;
}

/* ⚠️ 글자 수로 자르면 문장 중간이 끊긴다. 줄 단위로 접고 '더보기'로 펼친다.
   본문은 항상 전부 들어있으므로 잘려서 사라지는 내용이 없다. */
let _clipId=0;
function toggleClip(id,btn){
  const e=document.getElementById(id); if(!e)return;
  const open=e.classList.toggle('open');
  btn.textContent=open?'접기 ▲':'더보기 ▼';
}
function clip(html,lines=3){
  const id='c'+(++_clipId);
  return `<div class="clip" id="${id}" style="--lines:${lines}">${html}</div>
    <button class="more" onclick="toggleClip('${id}',this)">더보기 ▼</button>`;
}

/* ── 실장 보고 중 "돈이 몰리는 곳의 강세 종목" 단락 ──
   5팀 업종 판정과 2·3팀 종목을 교차한 결과(chief.flowCross)를 문장으로 푼다.
   ⚠️ 교차 결과가 비면 "통과한 종목이 없습니다"라고 그대로 쓴다. 억지로 채우지 않는다. */
function chiefFlowLines(c){
  const fc=c&&c.flowCross; if(!fc)return [];
  const H=[];
  const lab={early:'지금 가장 초입',dip:'눌린 자리',lead:'선도주',
    early_weak:'초입이나 실적 근거가 약함',lead_weak:'많이 왔고 기대는 멈춤',hot:'단기 과열',out:'이탈'};

  // 팀 간 일치 — 이게 이 보고의 신뢰도 근거다
  const ag=fc.agreement||{};
  if(ag.droppedTotal&&ag.inOutflowIndustries){
    H.push(`<b>[팀 판정이 맞아떨어집니다]</b> 수아가 오늘 뺀 ${ag.droppedTotal}종목 중 <b>${ag.inOutflowIndustries}개</b>가 `+
      `미르가 "돈이 빠지는 중"이라고 짚은 업종 소속입니다 (${ag.tickers.map(t=>esc(t)).join(', ')}). `+
      `서로 다른 방법으로 본 두 판정이 같은 곳을 가리키고 있습니다.`);
  }
  if(fc.breakoutsInInflow&&fc.breakoutsInInflow.length){
    H.push(`거래량까지 실린 진짜 돌파 종목 중 <b>${fc.breakoutsInInflow.map(t=>esc(t)).join(', ')}</b> 는 돈이 들어오는 업종에 속해 있습니다.`);
  }

  const withPicks=(fc.inflow||[]).filter(i=>i.picks&&i.picks.length);
  if(!withPicks.length){
    H.push(`<b>[돈이 몰리는 곳의 종목]</b> 오늘 돈이 들어오는 업종 중에 도윤 기준을 통과한 종목이 있는 곳은 없습니다. 무리해서 고르지 않겠습니다.`);
    return H;
  }
  const g=withPicks[0];
  const buy=g.picks.filter(p=>['early','dip'].includes(p.stage)&&p.tracking==='active');
  const rows=g.picks.map(p=>
    `<tr><td><b>${esc(p.ticker)}</b>${p.name?` <span class="dim">${esc(p.name)}</span>`:''}</td>`+
    `<td class="num">${n(p.d50,0)}%</td><td class="num">${n(p.d200,0)}%</td>`+
    `<td>${esc(p.stageKo)}${p.breakout?' 🚀':''}</td></tr>`).join('');

  H.push(`<b>[돈이 몰리는 곳의 강세 종목]</b> 도윤이 뽑은 종목이 있는 업종 중 돈이 가장 빨리 들어온 곳은 <b>${esc(window.indKo?window.indKo(g.industry):g.industry)}</b> 입니다. `+
    `이 업종에서 도윤이 뽑은 종목은 ${g.picks.map(p=>esc(p.ticker)).join('·')} ${g.picks.length}개이고, `+
    (buy.length
      ? `그중 지금 볼 만한 자리는 <b>${buy.map(p=>esc(p.ticker)).join(', ')}</b> 입니다.`
      : `<b>그런데 지금 바로 사기 좋은 자리는 하나도 없습니다.</b> 솔직히 말씀드립니다 — 전부 단기로 뻗어 있거나 이미 이탈했습니다.`)+
    `<table class="ctab" style="margin-top:9px"><thead><tr><th>종목</th><th>두 달 평균 대비</th><th>1년 평균 대비</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table>`+
    `<div class="note">두 달 평균(50일선) 대비가 30%를 넘으면 단기 과열, 음수면 이탈입니다. `+
    `1년 평균(200일선) 대비가 낮을수록 상승 사이클 초입이라 위로 갈 여지가 남아 있습니다.</div>`);

  const dip=g.picks.filter(p=>p.stage==='dip'&&p.tracking==='dropped');
  if(dip.length)H.push(`⚠️ ${dip.map(p=>esc(p.ticker)).join(', ')} 는 실적 기대가 살아 있지만 두 달 평균선을 3일 이상 연속 이탈해 수아가 추적에서 뺐습니다. <b>규칙을 어기고 지금 사라는 뜻이 아닙니다</b> — 다시 올라오면 자동으로 재편입됩니다.`);
  return H;
}

/* ── 미르(5팀) 보고 — "돈이 어디로 가고 있나" ──
   서술 규칙: 영문 약어를 그대로 쓰지 않는다. 지표는 뜻 먼저, 이름은 괄호로.
   숫자는 코드가 계산한 값 그대로. 매 문단 끝에 "그래서 뭘 하라는 건지"를 붙인다.
   ⚠️ 변화율(%)은 나누는 값이 0 근처면 폭발한다 → 순위 변동을 앞세우고 %는 뒤에 붙인다. */
function mirBrief(){
  const t=D.t5; if(!t)return '';
  const F=(t.flow&&t.flow.industries)||null;
  const P=[];
  if(!F){
    P.push(`업종 ${t.totalIndustries}개의 강도를 계산했습니다. 다만 오늘은 과거 스냅샷이 모자라 <b>돈의 흐름(어디로 들어오고 어디서 빠지는지)은 판정하지 못했습니다.</b> <code>node scripts/backfill-history.js</code> 를 한 번 돌리면 다음 실행부터 나옵니다.`);
    return P.join(' ');
  }
  // 업종명은 한글 먼저, 영문은 괄호로 (승인된 서술 규칙)
  const nm=(x)=>esc(window.indKo?window.indKo(x.industry):x.industry);
  const cnt=(x)=>`${x.count}종목 중 ${Math.round((x.winRate||0)*x.count)}개 상승`;
  const rank=(x)=>x.frank25!=null
    ? `업종 순위가 25거래일 만에 <b>${x.FRANK+x.frank25}위에서 ${x.FRANK}위로 ${x.frank25>=0?x.frank25+'계단 올랐':(-x.frank25)+'계단 내렸'}습니다</b>`
    : `업종 순위는 <b>${x.FRANK}위</b>입니다`;
  const gap=(x)=>x.d200!=null
    ? `1년 평균 가격에서 ${n(x.d200,1)}% 떠 있고` + (x.d200Delta!=null
        ? `, 25거래일 전보다 ${n(Math.abs(x.d200Delta),1)}%p ${x.d200Delta>0?'더 벌어지는':'좁혀지는'} 중입니다`
        : `, 과거와 비교할 수 없어 방향은 판정 못 했습니다`)
    : '';

  // ① 돈이 들어오는 곳
  const inflow=F.filter(x=>['leading','inflow','narrow'].includes(x.flow))
    .sort((a,b)=>(b.frank25??-999)-(a.frank25??-999)).slice(0,2);
  if(inflow.length){
    const lead=inflow[0];
    P.push(`<b>돈이 들어오는 곳은 ${nm(lead)}입니다.</b> ${rank(lead)}. ${cnt(lead)}이라 `+
      (lead.winRate>=0.7?`몇 개가 끌어올린 게 아니라 업종 전체가 같이 움직였습니다`:`업종 전체가 아니라 일부만 오른 겁니다`)+
      `. ${gap(lead)}. 지금은 <b>${esc(lead.stageKo)}</b> 국면이에요.`+
      (inflow[1]?` ${nm(inflow[1])}도 ${rank(inflow[1])}.`:''));
  } else P.push(`<b>오늘은 뚜렷하게 돈이 들어오는 업종이 없습니다.</b> 억지로 고르지 않겠습니다.`);

  // ② 돈이 빠지는 곳 — 3팀 탈락과 대조
  // ⚠️ 이격 수축이 가장 큰 업종만 고르면 3팀 탈락 종목이 없는 곳이 걸려
  //    "수아 판정과 일치한다"는 가장 강한 근거를 못 쓴다.
  //    → 탈락 종목이 겹치는 업종을 먼저, 그 다음 수축이 큰 순.
  const dropped=(D.t3&&D.t3.dropped_today)||[];
  const picks=(D.t2&&D.t2.picks)||[];
  const dropCount=(x)=>dropped.filter(d=>{
    const p=picks.find(y=>y.ticker===d.ticker);
    return p&&p.sector===x.sector&&p.industry===x.industry;}).length;
  const out=F.filter(x=>x.flow==='outflow')
    .sort((a,b)=>(dropCount(b)-dropCount(a))||((a.d200Delta??0)-(b.d200Delta??0))).slice(0,1);
  if(out.length){
    const o=out[0];
    const same=dropped.filter(d=>{const p=picks.find(x=>x.ticker===d.ticker);return p&&p.sector===o.sector&&p.industry===o.industry;});
    P.push(`<b>돈이 빠지는 곳은 ${nm(o)}입니다.</b> 순위는 아직 ${o.FRANK}위지만 속을 보면 다릅니다 — ${gap(o)}.`+
      (o.d50!=null&&o.d50<0?` 최근 두 달 평균 아래로 ${n(Math.abs(o.d50),1)}% 내려왔습니다.`:'')+
      (same.length?` <b>수아가 오늘 뺀 ${dropped.length}종목 중 ${same.length}개가 정확히 이 업종</b>(${same.map(d=>esc(d.ticker)).join(', ')})입니다 — 제 판정과 수아 판정이 따로 논 게 아니라 같은 걸 본 겁니다.`
        :` 다만 수아가 오늘 뺀 종목 중에는 이 업종이 없습니다.`));
  }

  // ③ 아직 안 온 곳
  const pend=F.filter(x=>x.flow==='pending'&&x.coverage>=50).sort((a,b)=>(b.cy??-999)-(a.cy??-999)).slice(0,1);
  if(pend.length){
    const p2=pend[0];
    const mine=picks.filter(x=>x.sector===p2.sector&&x.industry===p2.industry);
    P.push(`<b>아직 안 온 곳은 ${nm(p2)}입니다.</b> 순위 ${p2.FRANK}위인데 주가 강도는 식었습니다. 그런데 애널리스트들이 `+
      `<b>올해 실적 전망을 ${n(p2.cy,1)}% 올렸고 ${p2.coverage}명 중 ${n(p2.upRatio,0)}%가 동의</b>합니다. `+
      `기대는 쌓이는데 가격이 아직 안 따라온 상태라 다음 차례 후보예요. `+
      (mine.length?`도윤이 여기서 ${mine.map(x=>esc(x.ticker)).join('·')}를 뽑았습니다.`
        :`다만 도윤 기준(가장 강한 상위 2%)은 아직 통과 못 해 오늘 뽑힌 종목은 없습니다.`));
  }

  // 사이트와 다른 이유 (사용자가 대조할 것이므로 반드시 밝힌다)
  if(t.flow.siteMismatch)
    P.push(`<span class="note">※ RS 사이트 화면과 숫자가 다릅니다. 사이트는 오늘 값과 과거 값에 서로 다른 공식을 적용해 비교하고, 기준일에 주말치(금요일 복제본)가 섞여 있습니다. 바로잡으면 <b>${t.flow.siteMismatch}개 업종은 오르내림 부호까지 반대</b>로 나옵니다. 대조하실 수 있게 두 값을 5팀 화면에 나란히 뒀습니다.</span>`);
  return P.join(' ');
}

/* ── 담당자 브리핑 ──
   숫자만 던지지 않고 "그래서 뭘 해야 하나"를 먼저 말한다.
   LLM 없이 데이터만으로 생성하므로 오프라인에서도 읽힌다. */
function briefing(id){
  const P=[];
  if(id==='t1'){
    const q=(D.t1&&D.t1.qqq)||{},f=(D.t1&&D.t1.finra)||{},L=(D.t1&&D.t1.leaders)||{};
    if(!D.t1)return '';
    if(q.verdict==='red'){
      P.push(`지금은 <b>새로 사면 안 되는 구간</b>입니다. 10일선(${n(q.ma10)})이 20일선(${n(q.ma20)}) 아래로 내려간 지 ${q.daysSinceDeathCross??'?'}일째예요. 쿨라매기 규칙에서 이건 신규 진입을 멈추고 들고 있는 것도 정리를 검토하라는 신호입니다.`);
      if(q.priceAboveAll)P.push(`다만 주가(${n(q.price)})는 세 이동평균선 위에 있습니다. 최근 반등이 강했다는 뜻인데, <b>평균선 배열이 아직 안 돌아왔으니</b> 추세 전환으로 보긴 이릅니다. 10일선이 20일선을 다시 위로 뚫는 걸 눈으로 확인한 뒤 들어가세요.`);
    } else if(q.verdict==='green'){
      P.push(`진입 가능한 구간입니다. 10일선이 20일선 위에 있고 둘 다 우상향이에요${q.sweetSpot?` — 특히 골든크로스 D+${q.daysSinceGoldenCross}로 통계적 최적 구간입니다`:''}.`);
    } else if(q.verdict==='yellow'){
      P.push(`애매한 구간입니다. 강하게 베팅할 자리는 아니고 <b>포지션을 줄이거나 확실한 셋업만</b> 고르세요.`);
    }
    if(f.level==='danger')P.push(`그리고 <b>빚내서 산 돈이 너무 많습니다.</b> 마진부채가 1년 전보다 ${n(f.yoyPct,1)}% 늘었어요(경고선 +40%). 이런 상태에서 하락이 시작되면 강제청산이 연쇄로 터져 낙폭이 평소보다 훨씬 커집니다. 손절선을 평소보다 타이트하게 잡으세요.`);
    else if(f.level==='warn')P.push(`마진부채가 ${n(f.yoyPct,1)}%로 주의 구간(+30% 초과)입니다. 레버리지 사용은 줄이는 게 좋습니다.`);
    const oh=L.market_overheat||{};
    if(oh.over150===0)P.push(`한편 200일선 대비 +150%를 넘긴 과열 종목은 <b>0개</b>입니다. 아직 시장을 끌고 갈 확실한 주도주가 안 나왔다는 뜻이라, 서둘러 진입할 이유가 없습니다.`);
    else if(oh.over150>=2)P.push(`주도주 ${oh.over150}종목이 200일선 +150%를 넘겼습니다. 과열 신호이니 보유분 <b>분할 차익실현</b>을 검토하세요(전량 매도는 금물).`);
    return P.join(' ');
  }
  if(id==='t2'){
    const t=D.t2; if(!t)return '';
    const s=t.stats||{};
    P.push(`오늘 ${s.universe}종목을 훑어서 <b>${s.afterMa150}종목</b>을 골랐습니다. RS 상위 2%에 든 ${s.unionTop}종목 중 변동성(ADR) 4% 이상이 ${s.afterAdr}종목이었고, 거기서 150일선 위에 있는 것만 남겼어요.`);
    const cl=(t.themes.clusters||[]).filter(c=>c.concentration!=='low').slice(0,2);
    if(cl.length)P.push(`쏠림이 뚜렷합니다 — <b>${cl.map(c=>`${c.name} ${c.count}종목(${c.sharePct}%)`).join(', ')}</b>. 같은 테마 종목이 무더기로 나온다는 건 지금 시장의 돈이 그쪽으로 흐른다는 신호입니다.`);
    else P.push(`특정 테마 쏠림은 뚜렷하지 않습니다. 주도 테마가 없는 장이라는 뜻이라 종목 선별이 더 중요합니다.`);
    if(t.research_coverage&&t.research_coverage.pending)P.push(`상승 이유는 ${t.research_coverage.done}종목만 조사했습니다. 나머지 ${t.research_coverage.pending}종목은 비용 상한 때문에 대기 중이고 며칠이면 채워집니다 — <b>빠진 걸 숨기지 않고 그대로 표시</b>합니다.`);
    return P.join(' ');
  }
  if(id==='t3'){
    const t=D.t3; if(!t)return '';
    const s=t.summary||{},dr=t.dropped_today||[],bk=t.breakouts||[];
    P.push(`현재 <b>${s.active}종목</b>을 매일 지켜보고 있습니다(누적 ${s.total}종목 중).`);
    if(dr.length){
      const worst=[...dr].map(d=>({t:d.ticker,n:parseInt((String(d.reason).match(/아래\s*(\d+)일/)||[])[1]||0,10)})).sort((a,b)=>b.n-a.n)[0];
      P.push(`오늘 <b>${dr.length}종목을 뺐습니다.</b> 전부 50일선 아래로 3일 넘게 내려간 종목이에요${worst&&worst.n?` — 특히 ${worst.t}는 ${worst.n}일 연속이라 단기 추세가 완전히 꺾였습니다`:''}. 나중에 2팀이 다시 뽑으면 자동으로 돌아옵니다.`);
    } else P.push(`오늘 배제된 종목은 없습니다.`);
    if(bk.length){
      const ok=bk.filter(b=>b.volumeConfirmed).length;
      P.push(`전고점을 뚫은 종목이 <b>${bk.length}개</b>인데, 그중 거래량까지 실린 건 <b>${ok}개</b>뿐입니다.`);
      if(bk.length-ok>0)P.push(`나머지 ${bk.length-ok}개는 거래량 없이 올라간 거라 <b>가짜 돌파일 수 있습니다.</b> 쿨라매기는 거래량 없는 돌파를 신뢰하지 않아요.`);
      const names=bk.filter(b=>b.volumeConfirmed).slice(0,4).map(b=>b.ticker);
      if(names.length)P.push(`거래량까지 확인된 <b>${names.join(', ')}</b> 를 먼저 보세요.`);
    } else P.push(`오늘 전고점을 뚫은 종목은 없습니다.`);
    return P.join(' ');
  }
  if(id==='t4'){
    const t=D.t4; if(!t)return '';
    P.push(`거래량이 갑자기 터진 종목 <b>${t.universeHits}개</b>를 찾아 상위 ${t.analyzed}개를 뜯어봤습니다.`);
    const ph=t.byPhase||{};
    const setups=Object.entries(ph).filter(([k])=>k!=='none').map(([k,v])=>`${k} ${v}`);
    if(ph.bounce_trigger)P.push(`이 중 <b>${ph.bounce_trigger}종목이 매수 트리거</b> 상태입니다 — 6개월 횡보 → 거래량 동반 돌파 → 저항선 되돌림 → 반등, 우리가 노리는 바로 그 자리예요.`);
    if(ph.retest)P.push(`${ph.retest}종목은 돌파 후 저항선까지 되돌아온 리테스트 구간입니다. 여기서 거래량이 마르면서 버티면 다음 반등이 진입 자리입니다.`);
    if(ph.extended)P.push(`${ph.extended}종목은 이미 너무 올라 <b>추격 금지</b>입니다. 되돌림을 기다리세요.`);
    if(!setups.length)P.push(`다만 6개월 횡보 패턴에 해당하는 셋업은 오늘 없습니다. 거래량이 터졌다고 다 살 자리는 아니에요.`);
    const hl=(t.llm&&t.llm.highlights)||[];
    if(hl.length)P.push(`촉매 분석에서 <b>${hl.map(x=>x.ticker).join(', ')}</b> 가 어닝 서프라이즈·산업 돌파에 해당합니다 — 쿨라매기가 가장 선호하는 호재입니다.`);
    else P.push(`뉴스를 못 찾은 종목은 억지로 이유를 만들지 않고 '암묵적(뉴스 없는 이상거래량)'으로 분류합니다.`);
    return P.join(' ');
  }
  if(id==='t5')return mirBrief();
  /* 실장 — 사장께 올리는 보고 */
  const c=D.chief; if(!c)return '';
  const k=c.counts||{},m=c.market||{},cc=(D.cc&&D.cc.items)||[];
  const q=(D.t1&&D.t1.qqq)||{},f=(D.t1&&D.t1.finra)||{},oh=(D.t1&&D.t1.leaders&&D.t1.leaders.market_overheat)||{};
  const t3=D.t3||{},t4=D.t4||{},t2=D.t2||{};
  const H=[];

  // ① 결론
  H.push(`<b>[결론]</b> `+(
    m.verdict==='red'
      ? `오늘은 <b>신규 매수를 하지 않는 날</b>입니다. 관심종목만 정리하고 기다리시는 걸 권합니다.`
      : m.verdict==='green'
      ? `오늘은 <b>준비된 셋업을 실행해도 되는 날</b>입니다.`
      : `오늘은 <b>확실한 것만 골라야 하는 날</b>입니다. 평소보다 포지션을 줄이세요.`));

  // ② 왜 그런지 — 근거 2개
  const why=[];
  if(q.verdict==='red')why.push(`QQQ의 10일 평균선(${n(q.ma10)})이 20일 평균선(${n(q.ma20)}) 아래로 내려간 지 <b>${q.daysSinceDeathCross??'?'}일째</b>입니다. 짧은 흐름이 긴 흐름보다 약하다는 뜻이라, 쿨라매기 규칙상 새로 사는 자리가 아닙니다`);
  else if(q.verdict==='green')why.push(`QQQ의 10일선이 20일선 위에 있고 둘 다 올라가고 있습니다${q.daysSinceGoldenCross!=null?` (골든크로스 D+${q.daysSinceGoldenCross})`:''}`);
  if(f.level==='danger')why.push(`빚내서 주식 산 돈(마진부채)이 1년 전보다 <b>${n(f.yoyPct,1)}%</b> 늘었습니다. 경고선이 +40%인데 이를 넘겼어요. 이런 상태에서 하락이 오면 강제청산이 연쇄로 터져 평소보다 훨씬 깊게 빠집니다`);
  else if(f.level==='warn')why.push(`마진부채가 ${n(f.yoyPct,1)}%로 주의 구간입니다`);
  if(oh.over150===0)why.push(`200일선 대비 +150%를 넘긴 종목이 <b>0개</b>입니다. 시장을 끌고 갈 주도주가 아직 없다는 뜻이라 서두를 이유가 없습니다`);
  if(why.length)H.push(`<b>[근거]</b> ${why.join('. 그리고 ')}.`);

  // ③ 오늘 한 일
  const did=[];
  if(t2.stats)did.push(`${t2.stats.universe}종목을 훑어 <b>${t2.stats.afterMa150}종목</b>을 선정`);
  if(t3.summary)did.push(`추적 ${t3.summary.active}종목 관리 (오늘 ${(t3.dropped_today||[]).length}종목 탈락)`);
  if(t4.universeHits)did.push(`거래량 급증 ${t4.universeHits}종목 점검`);
  if(did.length)H.push(`<b>[오늘 한 일]</b> ${did.join(' · ')}.`);

  // ③-b 돈이 몰리는 곳의 강세 종목 (5팀 업종 흐름 × 2·3팀 종목 교차)
  H.push(...chiefFlowLines(c));

  // ④ 눈여겨볼 것
  const bk=(t3.breakouts||[]).filter(b=>b.volumeConfirmed);
  const note=[];
  if(bk.length)note.push(`전고점을 <b>거래량까지 실어서</b> 뚫은 종목이 ${bk.length}개 있습니다 — ${bk.slice(0,5).map(b=>b.ticker).join(', ')}. 거래량 없는 돌파 ${(t3.breakouts||[]).length-bk.length}개는 가짜일 수 있어 제외했습니다`);
  const trig=(t4.items||[]).filter(i=>i.congestion&&i.congestion.phase==='bounce_trigger');
  if(trig.length)note.push(`4팀에서 <b>${trig.map(i=>i.ticker).join(', ')}</b> 가 매수 트리거 상태입니다 (6개월 횡보 → 돌파 → 되돌림 → 반등)`);
  const hl=(t4.llm&&t4.llm.highlights)||[];
  if(hl.length)note.push(`촉매가 확인된 종목: <b>${hl.map(x=>x.ticker).join(', ')}</b> (어닝 서프라이즈·산업 돌파)`);
  const th=t2.themes&&t2.themes.llm&&t2.themes.llm.leadingTheme;
  if(th&&th.strength!=='none')note.push(`오늘의 주도 테마는 <b>${esc(th.name)}</b> 입니다`);
  if(note.length)H.push(`<b>[눈여겨볼 것]</b> ${note.join('. ')}.`);

  // ⑤ 사장님이 하실 일
  if(cc.length){
    H.push(`<b>[사장님이 하실 일]</b> 오늘 <b>직접 차트를 봐야 할 종목이 ${cc.length}개</b>입니다 — ${cc.map(x=>x.ticker).join(', ')}. `+
      `시스템이 "변동성이 줄고 거래량이 마르면서 저항선에 붙었다"고 판단한 종목들입니다. `+
      `차트에서 <b>①횡보 폭이 점점 좁아지는지 ②거래량 막대가 줄고 있는지 ③저항선을 거래량 터뜨리며 뚫는지</b> 이 세 가지를 확인해 주세요. `+
      `돌파를 확인하시면 저에게 알려주시면 기록해 두겠습니다.`);
  } else {
    H.push(`<b>[사장님이 하실 일]</b> 오늘은 수렴 조건을 만족하는 종목이 없어 따로 확인하실 차트가 없습니다. 쉬셔도 됩니다.`);
  }

  // ⑥-0 재사용 고지 — 오늘 새로 조사한 것처럼 보이면 안 된다
  const ru=(c.llm&&c.llm.reuseAll)||null;
  if(ru){
    const src=[...new Set(Object.values(ru))].join(', ');
    const who={team1:'뉴스',team2:'종목 리서치',team4:'촉매 분류',team5:'업종 분석',chief:'종합'};
    H.push(`<b>[먼저 밝힙니다]</b> 오늘은 시장이 열리지 않아 주가 데이터가 <b>${esc(src)}</b> 과 완전히 같습니다. `+
      `그래서 ${Object.keys(ru).map(k=>who[k]||k).join('·')} 은 그날 조사분을 <b>그대로 재사용</b>했습니다 — `+
      `같은 숫자를 다시 조사해도 같은 결과가 나오기 때문입니다. 새로 조사한 것처럼 보이지 않도록 먼저 알려드립니다.`);
  }

  // ⑥ 신뢰도
  const v=(c.llm&&c.llm.verified)||null;
  H.push(`<b>[이 보고의 신뢰도]</b> 숫자는 전부 코드가 계산했고 제가 임의로 바꾸지 않았습니다. 뉴스·상승 이유 같은 서술만 AI가 조사했으며, `+
    (v?`오늘 인용한 출처 <b>${v.checked}개 URL을 실제로 접속</b>해 확인했습니다. 살아있는 링크 ${v.ok}개, 유료 페이월 등으로 확인 못 한 것 ${v.unverified}개, 죽은 링크 ${v.dead}개는 삭제했고 근거가 사라진 주장 ${v.stripped}건은 '근거 없음'으로 내렸습니다.`
      :`모든 출처 URL은 실제 접속으로 생존을 확인하며 죽은 링크가 붙은 주장은 '근거 없음'으로 내립니다.`)+
    ` <b>근거를 못 찾으면 지어내지 않고 없다고 말합니다.</b>`);

  if(t2.research_coverage&&t2.research_coverage.pending)
    H.push(`<b>[한계]</b> 선정 ${t2.research_coverage.total}종목 중 ${t2.research_coverage.done}종목만 상승 이유를 조사했습니다. 나머지 ${t2.research_coverage.pending}종목은 비용 상한 때문에 대기 중이며 며칠이면 채워집니다. 빠진 걸 숨기지 않고 그대로 보고드립니다.`);

  return H.map(x=>`<p class="pi">${x}</p>`).join('');
}

/* [라벨, 값] 배열 → 표 행. 값에 이미 만들어 둔 HTML 이 들어오므로 여기서 esc 하지 않는다
   (호출부가 esc() 를 씌워서 넘긴다). */
/* ── 근거 렌더 (2·4·5팀 공용) ──
   ⚠️ 예전엔 발행처 이름만 찍고 date·quote·title 을 통째로 버렸다.
      원문 인용문(quote)은 수집·검증까지 해놓고 화면에 한 번도 표시하지 않았다.
      "근거를 봤다"는 말을 사용자가 확인할 방법이 없으면 그 말은 의미가 없다. */
const CONF_KO={high:'충분',medium:'보통',low:'약함'};
const DRIVER_KO={earnings:'실적',policy:'정책',macro:'거시',technology:'기술',
  commodity:'원자재',rotation:'순환매',unknown:'불명'};
const DURA_KO={structural:'구조적',cyclical:'경기순환',short_term:'단기',unknown:'불명'};

function srcLinks(sources,max){
  return (sources||[]).slice(0,max||4).map(s=>{
    const d=s.date?` ${esc(String(s.date).slice(0,10))}`:'';
    return `<a class="ref" href="${esc(s.url)}" target="_blank" title="${esc(s.title||'')}">[${esc(s.publisher||'출처')}${d}]</a>`;
  }).join(' ');
}
// 인용문은 출처에 실제로 담겨 있을 때만. 없으면 아무것도 그리지 않는다(빈 칸 금지).
function quoteOf(c){
  const q=(c.sources||[]).map(s=>s&&s.quote).find(x=>x&&String(x).trim().length>8);
  return q?`<div class="quote">${esc(String(q).trim())}</div>`:'';
}
function claimList(claims,opt){
  const o=opt||{};
  const list=(claims||[]).filter(c=>c.evidence_level==='sourced'&&(c.sources||[]).length);
  if(!list.length)return '';
  return '<ul class="plist">'+list.slice(0,o.max||99).map(c=>
    `<li>${esc(c.statement)} ${srcLinks(c.sources)}${o.quote===false?'':quoteOf(c)}</li>`).join('')+'</ul>';
}

function rows(list){
  if(!list||!list.length)return '<div class="note">표시할 항목 없음</div>';
  return list.map(([k,v])=>`<div class="row"><span>${k==null?'':k}</span><b>${v==null?'—':v}</b></div>`).join('');
}

/* ── 2팀 테마 정리 ──
   ① 어떤 회사들이 같은 이유로 오르는가(테마)  ② 어느 판에 몰려 있는가(섹터·업종)
   순서로 나눈다. 회사 이름·업종·종목 수는 전부 picks 에서 가져오며 지어내지 않는다. */
/* 업종·섹터 한글명은 dashboard/data/industry-ko.js 에 있다 (대시보드와 공용).
   없는 업종은 영문 그대로 — 억지 번역을 하지 않는다. */
const SECTOR_KO=window.SECTOR_KO||{};
const INDUSTRY_KO=window.INDUSTRY_KO||{};
const koName=(m,en)=>m[en]?`${m[en]} <span class="en">(${esc(en)})</span>`:esc(en);

/* 티커 → {회사명, 섹터, 업종}. 이름이 없으면 티커만 쓴다 (없는 이름을 만들지 않는다) */
function pickIndex(t){
  const m=new Map();
  for(const p of t.picks||[]) m.set(p.ticker,{
    ko:p.nameKo||(p.detail&&p.detail.nameKo)||null,
    en:p.nameEn||(p.detail&&p.detail.nameEn)||null,

  return m;
}
/* 테마에 묶인 종목을 회사 카드로. 업종별로 묶어 한눈에 보이게 한다. */
function themeStocks(tickers,idx){
  const known=(tickers||[]).filter(x=>idx.has(x));
  if(!known.length)return '<div class="note">해당 종목이 오늘 선정 목록에 없습니다</div>';
  const byInd=new Map();
  for(const tk of known){const i=idx.get(tk);
    if(!byInd.has(i.industry))byInd.set(i.industry,[]);
    byInd.get(i.industry).push({tk,...i});}
  const grp=[...byInd.entries()].sort((a,b)=>b[1].length-a[1].length);
  return `<div class="coGrid">`+grp.map(([ind,list])=>
    `<div class="coGrp"><div class="coInd">${koName(INDUSTRY_KO,ind)} · ${list.length}곳</div>`+
    list.map(x=>`<div class="co"><b>${esc(x.tk)}</b><span>${x.ko?esc(x.ko):(x.en?esc(x.en):'회사명 미확보')}</span></div>`).join('')+
    `</div>`).join('')+`</div>`;
}
function themeCard(th,idx,total,lead){
  if(!th||!th.name)return '';
  const n=(th.tickers||[]).filter(x=>idx.has(x)).length;
  const badge={strong:'강함',mid:'보통',weak:'약함',none:'없음'}[th.strength]||th.strength||'';
  // ⚠️ 아래 한 줄은 LLM 서술이 아니라 picks 에서 센 숫자다 (지어낸 문장이 아니다)
  const facts=`이 테마로 묶인 종목은 <b>${n}개</b>${total?` — 오늘 고른 ${total}종목의 ${(n/total*100).toFixed(0)}%`:''}입니다.`;
  return `<div class="themeCard${lead?' lead':''}">
    <div class="themeTop">${lead?'<span class="tag lead">주도 테마</span>':'<span class="tag">보조 테마</span>'}
      <b>${esc(th.name)}</b>${badge?`<span class="chip">${esc(badge)}</span>`:''}</div>
    ${th.plainKo?`<p class="pi lead">${esc(th.plainKo)}</p>`:''}
    <p class="pi">${facts}</p>
    ${themeStocks(th.tickers,idx)}
    <div class="whyWrap"><div class="whyLbl">왜 이 테마인가 — 근거</div>${clip(prose(th.why),4)}</div>
  </div>`;
}
function clusterTable(list,map,total,emptyKo){
  if(!list.length)return `<div class="note">${emptyKo}</div>`;
  return `<table class="ctab"><thead><tr><th>이름</th><th>종목수</th><th>비중</th><th>쏠림</th></tr></thead><tbody>`+
    list.map(c=>{
      const lv={high:'<span style="color:var(--org)">강함</span>',mid:'보통',low:'<span class="dim">약함</span>'}[c.concentration]||'';
      return `<tr><td>${koName(map,c.name)}</td><td class="num">${c.count}</td>
        <td class="num">${c.sharePct}%</td><td>${lv}</td></tr>
        <tr class="tkRow"><td colspan="4">${(c.tickers||[]).map(x=>`<span class="tkc">${esc(x)}</span>`).join('')}</td></tr>`;
    }).join('')+`</tbody></table>`;
}
function themeSection(t){
  const idx=pickIndex(t),total=(t.picks||[]).length;
  const L=(t.themes&&t.themes.llm)||null;
  const cl=(t.themes&&t.themes.clusters)||[];
  const sec=cl.filter(c=>c.level==='Sector'),ind=cl.filter(c=>c.level==='Industry');

  let h=`<div class="sec"><h4>① 공통 테마 — 어떤 회사들이 같은 이유로 오르고 있나</h4>`;
  if(!L){
    h+=`<div class="note">AI 테마 분석 대기 중입니다. 아래 ②의 섹터·업종 쏠림은 코드가 센 숫자라 이미 확정입니다.</div>`;
  }else if(!L.leadingTheme||L.leadingTheme.strength==='none'){
    h+=`<div class="nosrc">오늘은 <b>공통 테마가 없습니다.</b> 억지로 묶지 않습니다.</div>`;
  }else{
    h+=`<p class="pi">"테마"는 <b>서로 다른 회사들이 같은 이유로 오르고 있는 묶음</b>을 말합니다.
        같은 이유로 오르면 같은 이유로 함께 빠질 수도 있으니, 몇 개가 한 테마에 몰려 있는지가 중요합니다.</p>`;
    h+=themeCard(L.leadingTheme,idx,total,true);
    for(const s of (L.subThemes||[])) h+=themeCard(s,idx,total,false);
    if(L.crossCuttingDriver)
      h+=`<div class="themeCard"><div class="themeTop"><span class="tag">테마를 가로지르는 공통 동인</span></div>
          ${clip(prose(L.crossCuttingDriver),4)}</div>`;
    if(L.caution)h+=`<div class="note" style="margin-top:10px">⚠️ ${esc(L.caution)}</div>`;
  }
  h+=`</div>`;

  h+=`<div class="sec"><h4>② 공통 섹터 · 업종 — 어느 판에 몰려 있나</h4>
    <p class="pi"><b>섹터</b>는 큰 분류(기술·헬스케어처럼 11개), <b>업종(industry)</b>은 그 안을 더 잘게 나눈 분류입니다.
      예를 들어 <b>기술 섹터</b> 안에 <b>반도체</b>, <b>인프라 소프트웨어</b> 같은 업종이 들어 있습니다.
      그래서 섹터만 보면 "기술주가 세다"까지만 알 수 있고, 업종까지 봐야 <b>기술주 중에서도 정확히 어디가 세다</b>를 알 수 있습니다.</p>
    <div class="ctitle">섹터 (큰 분류)</div>
    ${clusterTable(sec,SECTOR_KO,total,'2종목 이상 몰린 섹터가 없습니다')}
    <div class="ctitle" style="margin-top:16px">업종 (세부 분류)</div>
    ${clusterTable(ind,INDUSTRY_KO,total,'2종목 이상 몰린 업종이 없습니다')}
    <div class="note">전체 ${total}종목 기준. 한 종목은 섹터 1개와 업종 1개에 동시에 들어가므로 비중 합계는 100%가 넘습니다.</div>
  </div>`;
  return h;
}

          b+=cl||`<div class="nosrc">검증을 통과한 근거가 없습니다</div>`;
          if((x.keyStocks||[]).length)b+=`<div class="note"><b>대표 종목:</b> ${x.keyStocks.map(s=>esc(s)).join(' · ')}</div>`;
          // risk 는 "이 강세가 언제 꺾이나" — 가장 실행에 가까운 항목인데 지금까지 미표시였다
          if(x.risk)b+=`<div class="note" style="color:var(--yel)"><b>꺾이는 조건</b></div>`
            +clip(`<div class="pi">${esc(x.risk)}</div>`,4);
          return b+'</div>';
        }).join('')+`</div>`;
    return h;
  }
  /* 실장 */
  const c=D.chief; if(!c)return '<div class="empty">데이터 없음</div>';
  let h='';
  if(c.llm&&c.llm.status==='done'){
    h+=`<div class="sec"><h4>오늘 한마디</h4><div class="ko">${esc(c.llm.headline||'')}</div>
      <div class="note" style="margin-top:8px">${esc(c.llm.marketVerdictKo||'')}</div></div>`;
    if((c.llm.todayFocus||[]).length)h+=`<div class="sec"><h4>오늘의 포커스</h4>`+
      c.llm.todayFocus.map(f=>`<div style="margin-bottom:9px"><b>${esc(f.ticker)}</b>
        <div class="note">${esc(f.reason)}<br>→ ${esc(f.action)}</div></div>`).join('')+`</div>`;
    if(c.llm.chartCheckNote)h+=`<div class="sec"><h4>차트에서 확인할 것</h4><div class="note">${esc(c.llm.chartCheckNote)}</div></div>`;
  }
  const cc=(D.cc&&D.cc.items)||[];
  if(cc.length)h+=`<div class="sec"><h4>👁️ 오늘 차트를 봐야 할 종목</h4>`+
    cc.map(x=>`<div style="margin-bottom:9px"><b>${esc(x.ticker)}</b> <span class="chip">score ${x.score}</span>
      <a href="https://finviz.com/quote.ashx?t=${esc(x.ticker)}" target="_blank" style="font-size:12px">차트 ↗</a>
      <div class="note">${(x.reasons||[]).map(esc).join(' · ')}</div></div>`).join('')+`</div>`;
  const k=c.counts||{};
  h+=`<div class="sec"><h4>오늘의 숫자</h4>${rows([['유니버스',k.universe],['2팀 선정',k.picks],
    ['추적 활성',k.tracking?k.tracking.active:'—'],['전고점 돌파',k.breakouts],['거래량 급증',k.epCandidates]])}</div>`;
  if(c.llm&&c.llm.verified)h+=`<div class="sec"><h4>출처 검증</h4>
    ${rows([['검사한 URL',c.llm.verified.checked],['생존',c.llm.verified.ok],
      ['미검증(봇차단)',c.llm.verified.unverified],['죽은 링크 제거',c.llm.verified.dead],['근거없음 강등',c.llm.verified.stripped]])}
    <div class="note">모든 출처는 실제 HTTP 요청으로 생존을 확인합니다. 403/429 는 WSJ 같은 정상 매체의 봇 차단이라 제거하지 않고 '미검증'으로 남깁니다.</div></div>`;
  return h;
}

function openAgent(id){
  const a=AGENTS.find(x=>x.id===id);
  const br=briefing(id);
  const llmSum=(D.chief&&D.chief.llm&&D.chief.llm.teamSummaries&&D.chief.llm.teamSummaries[id])||'';
  $('mbox').innerHTML=`<div class="mhead"><div class="avatar">${mini(a,46)}</div>
    <div><h3>${a.name}</h3><div class="role">${a.role}</div></div>
    <button class="x" onclick="closeM()">닫기 ✕</button></div>`
    +(a.duty?`<div class="sec duty"><h4>🪧 ${esc(a.job||'')} — 이 사람이 하는 일</h4>
       <p class="pi">${a.duty}</p></div>`:'')
    +(br?`<div class="sec brief"><h4>💬 ${a.name}의 브리핑</h4><div class="pi">${br}</div>
       ${llmSum?`<div class="pi" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">${esc(llmSum)}</div>`:''}</div>`:'')
    +bodyFor(id)
    +`<div style="text-align:center;margin-top:14px">
       <a class="btn btn2" href="dashboard/breakout-room.html#${a.tab}">이 팀 전체 자료 보기 →</a></div>`;
  $('modal').classList.add('on');
}
function closeM(){$('modal').classList.remove('on');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM();};
document.onkeydown=e=>{if(e.key==='Escape')closeM();};

board();office();
$('replay').onclick=runDialog;
</script>

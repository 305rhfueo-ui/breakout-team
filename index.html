<style>
:root{--bg:#141c2a;--room:#1c2435;--desk:#232d40;--bd:#36415a;--tx:#e7eef8;--dim:#9dabc0;
--grn:#3fb950;--red:#f85149;--yel:#e3b341;--blu:#58a6ff;--pur:#c084fc;--org:#f5a524}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1300px 700px at 50% -12%,#25314a,var(--bg));
color:var(--tx);font:15px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;min-height:100vh}
a{color:var(--blu)}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 60px}

header{text-align:center;margin-bottom:18px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px}

.board{background:var(--room);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:18px 0}
.board .ko{font-size:15px;line-height:1.7}
/* 서준 모의투자 요약 띠 — 누르면 일지(paper.html)로 간다 */
.paper{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--room);border:1px solid var(--bd);border-left:3px solid #e0566f;
  border-radius:14px;padding:11px 16px;margin:-6px 0 18px;color:var(--tx);text-decoration:none;font-size:14px}
.paper:hover{border-color:#e0566f}
.paper .pt{font-weight:700}.paper .pk{color:var(--dim);font-size:12.5px;margin-right:5px}.paper .pv{font-weight:700;font-size:16px}
.paper .go{margin-left:auto;color:#8ab4ff;font-size:13px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-right:8px}
.b-green{background:#0f2a17;color:var(--grn);border:1px solid #1f5c2e}
.b-red{background:#2b1414;color:var(--red);border:1px solid #5c2626}
.b-yellow{background:#2a2410;color:var(--yel);border:1px solid #5c4a1a}
.b-gray{background:#1b2332;color:var(--dim);border:1px solid var(--bd)}

/* ══ 팀 카드 (2026-10-06 — 걷는 사무실 대신) ══
   아바타: DiceBear "Notionists"(Zoish, CC0) 를 한 번 생성해 assets/avatars/ 에 정적 SVG 로 둔다 — 외부 요청 없음. */
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.card{position:relative;cursor:pointer;background:#121a27;border:1px solid #26314a;border-radius:14px;padding:16px;
  display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:#3d5580;box-shadow:0 14px 30px -18px #000}
.card:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.card .top{display:flex;align-items:center;gap:12px}
.card .av{width:56px;height:56px;border-radius:50%;flex:0 0 56px;background:#1b2332}
.card .who b{font-size:15px;display:block}
.card .who span{font-size:12px;color:var(--dim)}
.card .st{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
.card .num{font-size:26px;font-weight:800;color:#fff;line-height:1.1}
.card .lab{font-size:12px;color:var(--dim)}
.card .ln{font-size:12.5px;line-height:1.6;color:#b4c0d2;overflow-wrap:anywhere}
.card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;border-color:#4b5a7a;
  background:linear-gradient(180deg,#172238,#121a27)}
.card.wide .av{width:72px;height:72px;flex-basis:72px}
.card.wide .body{flex:1;min-width:0}
.card.wide .hl{font-size:16px;font-weight:700;color:#fff;line-height:1.5}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:5px;vertical-align:middle}
.dot.off{background:#5b6678}
.hint{text-align:center;color:var(--dim);font-size:12px;margin-top:12px}
.mhead .avatar img{width:52px;height:52px;border-radius:50%;display:block}
@media (max-width:900px){.team{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.team{grid-template-columns:1fr}.card.wide{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{background:#238636;color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-weight:700;font-size:15px}
.btn:hover{background:#2ea043}
.btn2{background:var(--desk);color:var(--tx);border:1px solid var(--bd)}
.btn2:hover{border-color:var(--blu)}

/* ── 모달 ── */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;padding:18px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:820px;margin:24px auto;background:var(--room);border:1px solid var(--bd);border-radius:16px;padding:20px}
.mhead{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:14px}
.mhead .avatar{width:46px;flex:0 0 46px;animation:none}
.mhead h3{margin:0;font-size:19px}
.x{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--dim);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
.x:hover{color:var(--tx);border-color:var(--blu)}
.sec{background:#101724;border:1px solid var(--bd);border-radius:10px;padding:13px;margin-bottom:11px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.sec.duty{background:#0e1622;border-color:#2b3547}
.sec.duty h4{color:var(--org)}
.sec.brief{background:linear-gradient(180deg,#141d2e,#101724);border-color:#33405a}
.sec.brief h4{color:var(--blu);font-size:13px}
.sec.brief .pi{margin-bottom:12px}
.sec.brief .pi:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1c2433;font-size:13.5px}
.row:last-child{border:0}
.row b{color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#1b2332;border:1px solid var(--bd);border-radius:99px;padding:3px 11px;font-size:12px}
.note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
/* 긴 서술 정리 */
.pi{margin:0 0 10px;font-size:13.5px;line-height:1.75;color:var(--tx)}
.plist{margin:0;padding-left:20px;font-size:13.5px;line-height:1.8}
.plist li{margin-bottom:9px}
.plist li b{color:#fff}
.ref{font-size:10.5px;color:var(--blu);text-decoration:none;vertical-align:super}
.ref:hover{text-decoration:underline}
.quote{display:block;margin:6px 0;padding:7px 11px;border-left:3px solid var(--bd);
background:#0c121d;color:var(--dim);font-size:12px;line-height:1.6;font-style:italic}
/* ── 테마 카드 ── */
.themeCard{background:#0d141f;border:1px solid var(--bd);border-radius:11px;padding:13px;margin-top:11px}
.themeCard.lead{border-color:#4b3a72;background:linear-gradient(180deg,#141029,#0d141f)}
.themeTop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.themeTop b{font-size:15px;color:#fff}
.tag{font-size:10.5px;padding:2px 9px;border-radius:99px;background:#1b2332;border:1px solid var(--bd);color:var(--dim)}
.tag.lead{background:#2c1f4a;border-color:#5b46895e;color:var(--pur);font-weight:700}
.pi.lead{color:#e8eef7;font-size:14px}
.coGrid{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0}
.coGrp{background:#111a27;border:1px solid #232e40;border-radius:9px;padding:8px 10px;min-width:150px}
.coInd{font-size:10.5px;color:var(--blu);margin-bottom:5px;font-weight:600}
.co{display:flex;gap:7px;align-items:baseline;font-size:12px;padding:1.5px 0}
.co b{color:#fff;min-width:52px}
.co span{color:var(--dim);font-size:11.5px}
.whyWrap{margin-top:10px;padding-top:9px;border-top:1px solid #1e2837}
.whyLbl{font-size:10.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.3px}
.en{color:var(--dim);font-size:11px;font-weight:400}
.dim{color:var(--dim)}
/* 섹터·업종 표 */
.ctitle{font-size:12.5px;color:var(--blu);font-weight:700;margin-bottom:6px}
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{text-align:left;font-size:10.5px;color:var(--dim);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--bd)}
.ctab th:nth-child(2),.ctab th:nth-child(3){text-align:right}
.ctab td{padding:5px 6px;vertical-align:top}
.ctab td.num{text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-weight:700}
.ctab tr.tkRow td{padding:0 6px 7px;border-bottom:1px solid #1a2231}
.tkc{display:inline-block;background:#1b2332;border:1px solid #2b3547;border-radius:5px;
  padding:1px 6px;margin:2px 3px 0 0;font-size:10.5px;color:#b9c4d4}
.srcs{margin-top:11px;padding-top:9px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--dim)}
.srcs a{color:var(--dim);text-decoration:none}
.srcs a:hover{color:var(--blu)}
.more{background:none;border:0;color:var(--blu);cursor:pointer;font-size:12px;padding:2px 0}
.more:hover{text-decoration:underline}
/* ⚠️ 줄 수를 인라인 style 로 넣으면 인라인이 .clip.open 을 이겨서 '더보기'가 먹히지 않는다.
   줄 수는 CSS 변수로만 넘기고, 펼침은 클래스가 담당한다. */
.clip{display:-webkit-box;-webkit-line-clamp:var(--lines,3);-webkit-box-orient:vertical;overflow:hidden}
.clip.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.nosrc{color:var(--yel);font-size:12.5px}
/* 6팀 심층 분석 — 카드 안에 접힌 채로 둔다 (2026-10-03) */
details.deep{margin-top:8px;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;background:#121a27}
details.deep summary{cursor:pointer;font-size:13px;color:var(--blu);list-style:none}
details.deep summary::before{content:'▸ ';color:var(--dim)}
details.deep[open] summary::before{content:'▾ '}
details.deep h5{margin:12px 0 5px;font-size:12.5px;color:var(--dim);letter-spacing:.02em}
details.deep .ck,.ck{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;line-height:1.55}
.ck .ok{color:var(--grn)} .ck .no{color:var(--red)} .ck .na{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:16px;font-size:13px}
/* 도윤 5개 목록 (2026-10-06) */
.lnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lnav button{background:#1b2332;border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer}
.lnav button.on{background:#2b4a7a;border-color:var(--blu);font-weight:700}
.lnav button small{color:var(--dim);margin-left:4px}
.ltab{overflow-x:auto;margin:6px 0 12px;border:1px solid #1e2837;border-radius:9px}
.ltab table{border-collapse:collapse;font-size:12px;width:100%;min-width:1080px;table-layout:fixed;white-space:nowrap}
.ltab col.c0{width:220px}
.ltab td:first-child{overflow:hidden;text-overflow:ellipsis}
.mbox.wide{max-width:1240px}
.ltab th{position:sticky;top:0;background:#0f1622;color:var(--dim);font-weight:600;font-size:11px;padding:6px 7px;text-align:right;cursor:help}
.ltab th:first-child,.ltab td:first-child{text-align:left}
.ltab td{padding:5px 7px;text-align:right;border-top:1px solid #1a2231;font-variant-numeric:tabular-nums}
.ltab tr:hover td{background:#152036}
.lind{font-size:13px;color:var(--blu);font-weight:700;margin:12px 0 2px}
.tk{color:#fff;font-weight:700;cursor:pointer;border-bottom:1px dashed #5b6f94}
.tk:hover{color:var(--blu)}
.up{color:var(--red)}.dn{color:#4f9dff}.warn{color:var(--org)}.bad{color:var(--red)}.good{color:var(--grn)}
/* 티커 팝업 — 담당자 창 위에 한 겹 더 */
#modal2{z-index:60}
.chartbox{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:6px;margin-bottom:11px}
.chartbox svg{display:block;width:100%;height:auto}
.mhead .role{font-size:12px;color:var(--dim);margin-top:2px}
.disc{text-align:center;color:var(--dim);font-size:11.5px;margin-top:30px;line-height:1.8}
@media(max-width:560px){h1{font-size:21px}}
</style>

<script>
const D={chief:window.CHIEF_DATA,t1:window.TEAM1_DATA,t2:window.TEAM2_DATA,t3:window.TEAM3_DATA,
         t4:window.TEAM4_DATA,t6:window.TEAM6_DATA,cc:window.CHARTCHECK_DATA};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>v==null||Number.isNaN(Number(v))?'—':Number(v).toFixed(d);
const tp=v=>v==null?'—':(100-Number(v)).toFixed(1);

/* 팀별 담당자. 아바타는 assets/avatars/{id}.svg (DiceBear Notionists, CC0 — seed 를 바꿔 재생성 가능) */
const AGENTS=[
  {id:'chief',name:'실장',role:'종합 · 오늘의 지시',tab:'chief',wide:true,job:'총괄 보고',
   duty:'네 팀의 결과를 하나로 모아 사장님께 보고합니다. 단순히 나열하지 않고 <b>팀끼리 말이 맞는지 어긋나는지</b>를 짚고, <b>도윤의 5개 목록에서 오늘 강한 종목이 어디에 몰렸는지</b>를 정리합니다. 무엇보다 <b>오늘 직접 차트를 봐야 할 종목</b>을 골라 드립니다.'},
  {id:'t1',name:'한별',role:'1팀 · 시장환경',tab:'t1',job:'시장 신호등',
   duty:'지금 주식을 사도 되는 때인지 아닌지를 판단합니다. 나스닥100(QQQ)의 10·20·50일 평균선 배열을 보고 초록/노랑/빨강으로 신호를 매기고, 사람들이 빚내서 주식을 얼마나 샀는지(마진부채)를 1년 전과 비교해 과열을 경고합니다. 매일 아침 시장 뉴스도 쉬운 말로 풀어 드립니다.'},
  {id:'t2',name:'도윤',role:'2팀 · 종목선정',tab:'t2',job:'종목 발굴',
   duty:'RS 사이트와 같은 기준으로 강한 종목을 <b>5개 목록</b>으로 나눠 봅니다 — ①<b>거래대금 상위</b>(전영업일 대비 5% 이상 오른 종목 중 거래대금 큰 20개) ②<b>RS 1개월</b> ③<b>3개월</b> ④<b>6개월</b> 상위 2% ⑤<b>세 기간 모두</b> 상위 2%. 목록마다 같은 업종에 몰렸는지 표로 보여 주고, 업종이 달라도 뉴스로 묶이는 공통 테마를 찾습니다. 표의 티커를 누르면 그 종목의 차트와 분석이 열립니다.'},
  {id:'t3',name:'수아',role:'3팀 · 추적관리',tab:'t3',job:'보유 관리',
   duty:'한 번 뽑힌 종목을 계속 따라다니며 상태를 기록합니다. ①50일선 아래로 3일 연속 내려가거나 ②고점 대비 40% 넘게 빠지거나 ③150일선을 깨면 목록에서 뺍니다. 뺀 뒤에도 사유와 함께 남겨두고, 다시 기준을 충족하면 자동으로 되돌립니다. 전고점을 거래량까지 실어 뚫은 종목도 찾아 알려 드립니다.'},
  {id:'t4',name:'재민',role:'4팀 · EP·촉매',tab:'t4',job:'급등 포착',

/* ── 긴 서술 정리 ──
   LLM 이 돌려주는 why/summary 는 URL 이 문장 한가운데 박혀 있고 (1)(2)(3) 이 한 줄에 붙어 있어
   그대로 뿌리면 글 덩어리가 된다. 여기서 세 가지만 한다.
     ① 인라인 URL 을 빼내 각주 링크로 내린다 (본문에는 [1] 위첨자만 남는다)
     ② (1)(2)(3) / ①②③ 로 나뉜 항목을 <ol> 로 쪼갠다
     ③ 40자 넘는 따옴표 인용은 인용 블록으로 뺀다
   ⚠️ 내용을 자르지 않는다. 재배치만 한다. */
function prose(text){
  if(text==null||text==='')return '<div class="note">내용 없음</div>';
  if(Array.isArray(text))return text.map(x=>prose(x)).join('');
  if(typeof text==='object')return prose(text.statement||text.text||text.why||JSON.stringify(text));

  let s=String(text).trim();
  if(!s)return '<div class="note">내용 없음</div>';

  // ① URL 추출 — 문장 끝의 구두점은 URL 에 포함시키지 않는다
  const refs=[];
  const MK=String.fromCharCode(1);   // 각주 자리표시 센티널 (본문 숫자와 절대 안 겹친다)
  s=s.replace(/https?:\/\/[^\s<>"')\]]+/g,(u)=>{
    const url=u.replace(/[.,;:]+$/,'');
    let i=refs.indexOf(url);
    if(i<0){refs.push(url);i=refs.length-1;}
    return MK+(i+1)+MK;
  });

  // ② 항목 분리 — (1) 또는 ① 로 시작하는 조각이 2개 이상일 때만
  const marks=s.match(/(?:\(\d\)|[①②③④⑤⑥⑦⑧⑨])/g)||[];
  let items=null;
  if(marks.length>=2){
    items=s.split(/(?=\(\d\)|[①②③④⑤⑥⑦⑧⑨])/).map(x=>x.trim()).filter(Boolean);
    if(items.length<2)items=null;
  }

  // 이스케이프 후 각주 마커·인용을 HTML 로 되돌린다
  const render=(str)=>{
    let h=esc(str);
    h=h.replace(new RegExp(MK+'(\\d+)'+MK,'g'),(m,i)=>
      `<a class="ref" href="${esc(refs[i-1])}" target="_blank" rel="noopener">[${i}]</a>`);
    // ③ 긴 인용문 분리
    h=h.replace(/&quot;([^&]{40,}?)&quot;/g,'<span class="quote">$1</span>');
    return h;
  };

  let out;
  if(items){
    out='<ol class="plist">'+items.map(x=>
      `<li>${render(x.replace(/^(?:\(\d\)|[①②③④⑤⑥⑦⑧⑨])\s*/,''))}</li>`).join('')+'</ol>';
  }else{
    // 문장 3개 이상이면 문단으로 나눠 읽기 쉽게
    const paras=s.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
    out=paras.map(p=>`<p class="pi">${render(p)}</p>`).join('');
  }

  if(refs.length)
    out+='<div class="note">출처 '+refs.map((u,i)=>
      `<a class="ref" href="${esc(u)}" target="_blank" rel="noopener">[${i+1}]</a> ${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,46))}${u.length>60?'…':''}`
    ).join(' · ')+'</div>';
  return out;
}

/* ⚠️ 글자 수로 자르면 문장 중간이 끊긴다. 줄 단위로 접고 '더보기'로 펼친다.
   본문은 항상 전부 들어있으므로 잘려서 사라지는 내용이 없다. */
let _clipId=0;
function toggleClip(id,btn){
  const e=document.getElementById(id); if(!e)return;
  const open=e.classList.toggle('open');
  btn.textContent=open?'접기 ▲':'더보기 ▼';
}
function clip(html,lines=3){
  const id='c'+(++_clipId);
  return `<div class="clip" id="${id}" style="--lines:${lines}">${html}</div>
    <button class="more" onclick="toggleClip('${id}',this)">더보기 ▼</button>`;
}

/* ── 담당자 브리핑 ──
   숫자만 던지지 않고 "그래서 뭘 해야 하나"를 먼저 말한다.
   LLM 없이 데이터만으로 생성하므로 오프라인에서도 읽힌다. */
function briefing(id){
  const P=[];
  if(id==='t1'){
    const q=(D.t1&&D.t1.qqq)||{},f=(D.t1&&D.t1.finra)||{},L=(D.t1&&D.t1.leaders)||{};
    if(!D.t1)return '';
    if(q.verdict==='red'){
      P.push(`지금은 <b>새로 사면 안 되는 구간</b>입니다. 10일선(${n(q.ma10)})이 20일선(${n(q.ma20)}) 아래로 내려간 지 ${q.daysSinceDeathCross??'?'}일째예요. 쿨라매기 규칙에서 이건 신규 진입을 멈추고 들고 있는 것도 정리를 검토하라는 신호입니다.`);
      if(q.priceAboveAll)P.push(`다만 주가(${n(q.price)})는 세 이동평균선 위에 있습니다. 최근 반등이 강했다는 뜻인데, <b>평균선 배열이 아직 안 돌아왔으니</b> 추세 전환으로 보긴 이릅니다. 10일선이 20일선을 다시 위로 뚫는 걸 눈으로 확인한 뒤 들어가세요.`);
    } else if(q.verdict==='green'){
      P.push(`진입 가능한 구간입니다. 10일선이 20일선 위에 있고 둘 다 오르는 중이에요${q.sweetSpot?` — 넘은 지 ${q.daysSinceGoldenCross}일째로 가장 좋은 구간입니다`:''}.`);
    } else if(q.verdict==='yellow'){
      P.push(`애매한 구간입니다. 강하게 베팅할 때는 아니고 <b>넣는 돈을 줄이거나 확실한 종목만</b> 고르세요.`);
    }
    if(f.level==='danger')P.push(`그리고 <b>빚내서 산 돈이 너무 많습니다.</b> 마진부채가 1년 전보다 ${n(f.yoyPct,1)}% 늘었어요(경고선 +40%). 이런 상태에서 하락이 시작되면 강제청산이 연쇄로 터져 낙폭이 평소보다 훨씬 커집니다. 손절선을 평소보다 타이트하게 잡으세요.`);
    else if(f.level==='warn')P.push(`마진부채가 ${n(f.yoyPct,1)}%로 주의 구간(+30% 초과)입니다. 레버리지 사용은 줄이는 게 좋습니다.`);
    const oh=L.market_overheat||{};
    if(oh.over150===0)P.push(`한편 200일선 대비 +150%를 넘긴 과열 종목은 <b>0개</b>입니다. 아직 시장을 끌고 갈 확실한 주도주가 안 나왔다는 뜻이라, 서둘러 진입할 이유가 없습니다.`);
    else if(oh.over150>=2)P.push(`주도주 ${oh.over150}종목이 200일선 +150%를 넘겼습니다. 과열 신호이니 보유분 <b>분할 차익실현</b>을 검토하세요(전량 매도는 금물).`);
    return P.join(' ');
  }
  if(id==='t2'){
    const t=D.t2; if(!t)return '';
    const L=t.lists;
    if(!L)return `오늘 ${(t.picks||[]).length}종목을 골랐습니다. 5개 목록 데이터는 다음 아침 실행부터 나옵니다.`;
    const ind=(k)=>{const cl=(L[k].industries&&L[k].industries.clusters)||[];
      return cl.length?cl.slice(0,2).map(c=>`<b>${esc((INDUSTRY_KO||{})[c.name]||c.name)}</b> ${c.count}종목`).join(', '):'공통 업종 없음';};
    P.push(L.dollar.note?`거래대금 목록은 오늘 만들지 못했습니다(${esc(L.dollar.note)}).`
      :`전영업일에 5% 넘게 오르면서 돈이 가장 많이 들어온 20종목은 ${ind('dollar')}에 몰렸습니다.`);
    P.push(`상대강도 상위 2%는 1개월 ${L.m1.count} · 3개월 ${L.m3.count} · 6개월 ${L.m6.count}종목이고, 세 기간 모두 상위 2%인 종목은 <b>${L.all.count}개</b>(${ind('all')})입니다.`);
    P.push(`아래 버튼으로 목록을 바꿔 보고, 티커를 누르면 그 종목의 차트와 분석이 열립니다.`);
    const rc=t.research_coverage;
    if(rc&&rc.pending)P.push(`상승 이유는 ${rc.done}/${rc.total}종목 조사했고, 나머지는 며칠에 걸쳐 거래대금 상위·세 기간 공통부터 채웁니다.`);
    return P.join(' ');
  }
  if(id==='t3'){
    const t=D.t3; if(!t)return '';
    const s=t.summary||{},dr=t.dropped_today||[],bk=t.breakouts||[];
    P.push(`현재 <b>${s.active}종목</b>을 매일 지켜보고 있습니다(누적 ${s.total}종목 중).`);
    if(dr.length){
      const worst=[...dr].map(d=>({t:d.ticker,n:parseInt((String(d.reason).match(/아래\s*(\d+)일/)||[])[1]||0,10)})).sort((a,b)=>b.n-a.n)[0];
      /* 배제 사유는 셋(50일선 3일·편입 후 고점 -40%·150일선 아래) — 예전엔 전부 "50일선" 문장으로 나갔다 (2026-09-17) */
      const rc={ma50:0,dd:0,ma150:0};
      for(const d of dr){const r=String(d.reason);if(/50일선/.test(r))rc.ma50++;if(/고점.*대비/.test(r))rc.dd++;if(/150일선/.test(r))rc.ma150++;}
      const why=[rc.ma50?`50일선 아래 3일 이상 ${rc.ma50}개`:'',rc.dd?`편입 후 고점 대비 -40% ${rc.dd}개`:'',rc.ma150?`150일선 아래 ${rc.ma150}개`:''].filter(Boolean).join(' · ');
      P.push(`오늘 <b>${dr.length}종목을 뺐습니다.</b> 사유: ${why||'기록 없음'}${worst&&worst.n?` — ${worst.t}는 50일선 아래 ${worst.n}일 연속`:''}. 나중에 2팀이 다시 뽑으면 자동으로 돌아옵니다.`);
    } else P.push(`오늘 배제된 종목은 없습니다.`);
    if(bk.length){
      const ok=bk.filter(b=>b.volumeConfirmed).length;
      P.push(`최근 7주 최고가를 종가로 넘어선 종목이 <b>${bk.length}개</b>이고, 그중 그날 거래량이 평소(20일 평균)의 2배 이상이었던 건 <b>${ok}개</b>입니다.`);
      if(bk.length-ok>0)P.push(`나머지 ${bk.length-ok}개는 거래량 확인이 안 된 종목입니다.`);
      const names=bk.filter(b=>b.volumeConfirmed).slice(0,4).map(b=>b.ticker);
      if(names.length)P.push(`거래량까지 확인된 <b>${names.join(', ')}</b> 를 먼저 보세요.`);
    } else P.push(`오늘 7주 고점을 넘은 종목은 없습니다.`);
    return P.join(' ');
  }
  if(id==='t4'){
    const t=D.t4; if(!t)return '';
    P.push(`거래량이 갑자기 터진 종목 <b>${t.universeHits}개</b> 중 150일선 위 <b>${t.analyzed}개</b>를 뜯어봤습니다.`);
    const exB=(t.excludedBelowMa150||[]).length, exU=(t.excludedMa150Unknown||[]).length;
    if(exB||exU)P.push(`150일선 아래 ${exB}개${exU?`, 판정불가 ${exU}개`:''}는 뺐습니다.`);
    const hl=(t.llm&&t.llm.highlights)||[];
    if(hl.length)P.push(`촉매 분석에서 <b>${hl.map(x=>x.ticker).join(', ')}</b> 가 어닝 서프라이즈·산업 돌파에 해당합니다 — 쿨라매기가 가장 선호하는 호재입니다.`);
    else P.push(`뉴스를 못 찾은 종목은 억지로 이유를 만들지 않고 '암묵적(뉴스 없는 이상거래량)'으로 분류합니다.`);
    return P.join(' ');
  }
  if(id==='t6'){
    const t=D.t6; if(!t)return '';
    const c=t.counts||{},w=(t.plans||[]).filter(p=>p.watch);
    if(t.regime==='red')P.push(`시장이 빨간불이라 <b>오늘 밤은 새로 사지 않습니다.</b> 아래 목록은 참고용이고, 들고 있는 종목만 규칙대로 관리합니다.`);
    else if(t.regime==='yellow')P.push(`시장이 노란불이라 <b>종목당 위험을 평소의 절반</b>으로 줄였습니다.`);
    P.push(`후보 ${c.evaluated}종목을 살펴봤습니다. 최근 고점(넘으면 사는 선) 바로 아래에서 쉬고 있는 건 ${c.near}종목이고, 그중 <b>오늘 밤 지켜볼 종목은 ${c.watch}개</b>(A ${c.A} · B ${c.B})입니다.`);
    if(w.length){
      const p=w[0];
      P.push(`맨 위는 <b>${esc(p.ticker)}</b> 입니다. 지금 ${n(p.price)}달러이고 <b>${n(p.pivot)}달러를 넘으면</b> 삽니다(현재 ${n(p.distToPivotPct,1)}%). 미리 잡아둔 손절은 ${n(p.stop)}달러, 넣는 돈은 계좌의 ${n(p.weightPct,1)}%입니다. 실제로 살 때는 그 시각까지의 당일 저가를 손절로 씁니다.`);
    } else P.push(`고점 바로 아래에서 쉬고 있는 종목이 없습니다. 조건이 안 맞으면 사지 않습니다.`);
    if(c.post)P.push(`이미 고점을 넘은 종목이 ${c.post}개 있는데, 이건 밤에 따라 사지 않습니다 — 넘은 뒤에 사는 건 추격입니다.`);
    if(c.blocked)P.push(`${c.blocked}종목은 등급 미달·실적 발표 임박·거래대금 부족으로 뺐습니다.`);
    if(!t.earningsOk)P.push(`<b>실적 달력을 받지 못해</b> 발표 직전 종목을 걸러내지 못했습니다. 사기 전에 실적일을 직접 확인하세요.`);
    const s=t.stats;
    if(s&&s.n)P.push(`지금까지 모의로 ${s.n}번 거래했고 ${n(s.winPct,0)}%를 이겼습니다. 한 번에 평균 ${n(s.avgR)}R 을 벌었습니다(1R = 손절하면 잃는 금액. 2R 이면 그 두 배를 벌었다는 뜻).${s.n<30?` 아직 ${s.n}건이라 <b>성적을 믿을 단계가 아닙니다</b> — 30건이 모일 때까지 규칙을 바꾸지 않습니다.`:''}`);
    else P.push(`모의 거래는 아직 없습니다.`);
    return P.join(' ');
  }
  /* 실장 — 사장께 올리는 보고 */
  const c=D.chief; if(!c)return '';
  const k=c.counts||{},m=c.market||{},cc=(D.cc&&D.cc.items)||[];
  const q=(D.t1&&D.t1.qqq)||{},f=(D.t1&&D.t1.finra)||{},oh=(D.t1&&D.t1.leaders&&D.t1.leaders.market_overheat)||{};
  const t3=D.t3||{},t4=D.t4||{},t2=D.t2||{};
  const H=[];

  // ① 결론
  H.push(`<b>[결론]</b> `+(
    m.verdict==='red'
      ? `오늘은 <b>신규 매수를 하지 않는 날</b>입니다. 관심종목만 정리하고 기다리시는 걸 권합니다.`
      : m.verdict==='green'
      ? `오늘은 <b>준비한 종목을 사도 되는 날</b>입니다.`
      : `오늘은 <b>확실한 것만 골라야 하는 날</b>입니다. 평소보다 넣는 돈을 줄이세요.`));

  // ② 왜 그런지 — 근거 2개
  const why=[];
  if(q.verdict==='red')why.push(`QQQ의 10일 평균선(${n(q.ma10)})이 20일 평균선(${n(q.ma20)}) 아래로 내려간 지 <b>${q.daysSinceDeathCross??'?'}일째</b>입니다. 짧은 흐름이 긴 흐름보다 약하다는 뜻이라, 쿨라매기 규칙상 새로 사는 자리가 아닙니다`);
  else if(q.verdict==='green')why.push(`QQQ의 10일선이 20일선 위에 있고 둘 다 올라가고 있습니다${q.daysSinceGoldenCross!=null?` (골든크로스 D+${q.daysSinceGoldenCross})`:''}`);
  if(f.level==='danger')why.push(`빚내서 주식 산 돈(마진부채)이 1년 전보다 <b>${n(f.yoyPct,1)}%</b> 늘었습니다. 경고선이 +40%인데 이를 넘겼어요. 이런 상태에서 하락이 오면 강제청산이 연쇄로 터져 평소보다 훨씬 깊게 빠집니다`);
  else if(f.level==='warn')why.push(`마진부채가 ${n(f.yoyPct,1)}%로 주의 구간입니다`);
  if(oh.over150===0)why.push(`200일선 대비 +150%를 넘긴 종목이 <b>0개</b>입니다. 시장을 끌고 갈 주도주가 아직 없다는 뜻이라 서두를 이유가 없습니다`);
  if(why.length)H.push(`<b>[근거]</b> ${why.join('. 그리고 ')}.`);

  // ③ 오늘 한 일
  const did=[];
  if(t2.stats)did.push(`${t2.stats.universe}종목을 훑어 <b>${t2.stats.afterMa150}종목</b>을 선정`);
  if(t3.summary)did.push(`추적 ${t3.summary.active}종목 관리 (오늘 ${(t3.dropped_today||[]).length}종목 탈락)`);
  if(t4.universeHits)did.push(`거래량 급증 ${t4.universeHits}종목 점검`);
  if(did.length)H.push(`<b>[오늘 한 일]</b> ${did.join(' · ')}.`);

  // ③-b 오늘 강한 종목이 몰린 곳 — 도윤 5개 목록의 공통 업종 (2026-10-06, 업종 자금흐름 대신)
  const LS=t2.lists;
  if(LS){
    const f=(k)=>{const l=LS[k],cl=(l.industries&&l.industries.clusters)||[];
      return cl.length?`${esc(l.label)} — ${cl.slice(0,2).map(x=>`<b>${esc((INDUSTRY_KO||{})[x.name]||x.name)}</b> ${x.count}종목(${x.tickers.slice(0,4).map(t=>`<span class="tk" data-tk="${esc(t)}">${esc(t)}</span>`).join(' ')})`).join(', ')}`
        :`${esc(l.label)} — 공통 업종 없음`;};
    H.push(`<b>[강한 종목이 몰린 곳]</b> ${f('dollar')}. ${f('all')}. 목록 전체는 도윤 카드에서 봅니다.`);
  }

  // ④ 눈여겨볼 것
  const bk=(t3.breakouts||[]).filter(b=>b.volumeConfirmed);
  const note=[];
  if(bk.length)note.push(`7주 고점을 <b>돌파봉 거래량 2배 이상</b>으로 넘은 종목이 ${bk.length}개 있습니다 — ${bk.slice(0,5).map(b=>b.ticker).join(', ')}. 거래량 확인이 안 된 ${(t3.breakouts||[]).length-bk.length}개는 제외했습니다`);
  const hl=(t4.llm&&t4.llm.highlights)||[];
  if(hl.length)note.push(`촉매가 확인된 종목: <b>${hl.map(x=>x.ticker).join(', ')}</b> (어닝 서프라이즈·산업 돌파)`);
  const th=t2.themes&&t2.themes.llm&&t2.themes.llm.leadingTheme;
  if(th&&th.strength!=='none')note.push(`오늘의 주도 테마는 <b>${esc(th.name)}</b> 입니다`);
  if(note.length)H.push(`<b>[눈여겨볼 것]</b> ${note.join('. ')}.`);

  // ⑤ 사장님이 하실 일
  if(cc.length){
    H.push(`<b>[사장님이 하실 일]</b> 오늘 <b>직접 차트를 봐야 할 종목이 ${cc.length}개</b>입니다 — ${cc.map(x=>x.ticker).join(', ')}. `+
      `시스템이 "변동성이 줄고 거래량이 마르면서 저항선에 붙었다"고 판단한 종목들입니다. `+
      `차트에서 <b>①횡보 폭이 점점 좁아지는지 ②거래량 막대가 줄고 있는지 ③저항선을 거래량 터뜨리며 뚫는지</b> 이 세 가지를 확인해 주세요. `+
      `차트 모양은 제가 판정하지 않습니다 — 숫자만 골랐습니다.`);
  } else {
    H.push(`<b>[사장님이 하실 일]</b> 오늘은 수렴 조건을 만족하는 종목이 없어 따로 확인하실 차트가 없습니다. 쉬셔도 됩니다.`);
  }

  // ⑥-0 재사용 고지 — 오늘 새로 조사한 것처럼 보이면 안 된다
  const ru=(c.llm&&c.llm.reuseAll)||null;
  if(ru){
    const src=[...new Set(Object.values(ru))].join(', ');
    const who={team1:'뉴스',team2:'종목 리서치',team4:'촉매 분류',team6:'심층 분석',chief:'종합'};
    H.push(`<b>[먼저 밝힙니다]</b> 오늘은 시장이 열리지 않아 ${Object.keys(ru).map(k=>who[k]||k).join('·')} 은 <b>${esc(src)}</b> 조사분을 그대로 재사용했습니다.`);
  }

  // ⑥ 신뢰도
  const v=(c.llm&&c.llm.verified)||null;
  H.push(`<b>[이 보고의 신뢰도]</b> 숫자는 전부 코드가 계산했습니다. 뉴스·상승 이유만 AI가 조사했고`+
    (v?`, 출처 ${v.checked}개를 실제 접속해 죽은 링크 ${v.dead}개를 지웠습니다. 근거가 사라진 주장 ${v.stripped}건은 '근거 없음'으로 내렸습니다.`
      :` 죽은 링크가 붙은 주장은 '근거 없음'으로 내립니다.`));

  if(t2.research_coverage&&t2.research_coverage.pending)
    H.push(`<b>[한계]</b> 선정 ${t2.research_coverage.total}종목 중 ${t2.research_coverage.done}종목만 상승 이유를 조사했습니다. 나머지 ${t2.research_coverage.pending}종목은 며칠 안에 채웁니다.`);

  return H.map(x=>`<p class="pi">${x}</p>`).join('');
}

/* [라벨, 값] 배열 → 표 행. 값에 이미 만들어 둔 HTML 이 들어오므로 여기서 esc 하지 않는다
   (호출부가 esc() 를 씌워서 넘긴다). */
/* ── 근거 렌더 (2·4·5팀 공용) ──
   ⚠️ 예전엔 발행처 이름만 찍고 date·quote·title 을 통째로 버렸다.
      원문 인용문(quote)은 수집·검증까지 해놓고 화면에 한 번도 표시하지 않았다.
      "근거를 봤다"는 말을 사용자가 확인할 방법이 없으면 그 말은 의미가 없다. */
const CONF_KO={high:'충분',medium:'보통',low:'약함'};

function srcLinks(sources,max){
  return (sources||[]).slice(0,max||4).map(s=>{
    const d=s.date?` ${esc(String(s.date).slice(0,10))}`:'';
    return `<a class="ref" href="${esc(s.url)}" target="_blank" title="${esc(s.title||'')}">[${esc(s.publisher||'출처')}${d}]</a>`;
  }).join(' ');
}
// 인용문은 출처에 실제로 담겨 있을 때만. 없으면 아무것도 그리지 않는다(빈 칸 금지).
function quoteOf(c){
  const q=(c.sources||[]).map(s=>s&&s.quote).find(x=>x&&String(x).trim().length>8);
  return q?`<div class="quote">${esc(String(q).trim())}</div>`:'';
}
function claimList(claims,opt){
  const o=opt||{};
  const list=(claims||[]).filter(c=>c.evidence_level==='sourced'&&(c.sources||[]).length);
  if(!list.length)return '';
  return '<ul class="plist">'+list.slice(0,o.max||99).map(c=>
    `<li>${esc(c.statement)} ${srcLinks(c.sources)}${o.quote===false?'':quoteOf(c)}</li>`).join('')+'</ul>';
}

function rows(list){
  if(!list||!list.length)return '<div class="note">표시할 항목 없음</div>';
  return list.map(([k,v])=>`<div class="row"><span>${k==null?'':k}</span><b>${v==null?'—':v}</b></div>`).join('');
}

const NI_SHORT={'흑자전환':'흑전','적자전환':'적전','적자확대':'적확','적자축소':'적축','흑자지속':'흑지','적자지속':'적지'};
const tri=(a)=>Array.isArray(a)?a.map(x=>x==null?'—':(typeof x==='number'?Math.round(x):esc(NI_SHORT[x]||x))).join('/'):'—';
const LCOLS=[

function rsCols(key){

function loadOhlc(t,cb){
  window.OHLC=window.OHLC||{};
  if(window.OHLC[t])return cb(window.OHLC[t]);
  const sc=document.createElement('script');
  sc.src=`dashboard/data/ohlc/${String(t).replace(/[^A-Za-z0-9.\-]/g,'_')}.js`;
  sc.onload=()=>cb(window.OHLC[t]||null);sc.onerror=()=>cb(null);

}
/* 캔들차트 — scripts/lib/chart/model.js 의 색·배치를 그대로 옮겼다(서준 심층 분석 PNG 와 같은 모양).
   rows = [[날짜,시,고,저,종,거래량], …]. 이평선은 앞쪽 봉까지 써서 계산하고 화면엔 최근 show 개만 그린다. */
function candleSvg(rows,{ma=[10,20,50],show=84,W=780,H=430}={}){
  const C={bg:'#0d1117',grid:'#30363d',text:'#c9d1d9',dim:'#7d8590',up:'#2ea043',down:'#f85149'};
  const MC={10:'#f5a524',20:'#3b82f6',50:'#a1a1aa'};
  const sma=(p)=>{const out=[];let s=0;rows.forEach((r,i)=>{s+=r[4];if(i>=p)s-=rows[i-p][4];out.push(i+1<p?null:s/p);});return out;};
  const M=ma.map(p=>({p,v:sma(p)}));
  const st=Math.max(0,rows.length-show),R=rows.slice(st);
  const pl=8,pr=58,pt=26,vh=70,gap=8,ph=H-pt-vh-gap-22;
  const cw=(W-pl-pr)/R.length,bw=Math.max(1.5,cw*.62);
  let lo=Infinity,hi=-Infinity;
  R.forEach((r,i)=>{lo=Math.min(lo,r[3]);hi=Math.max(hi,r[2]);M.forEach(m=>{const v=m.v[st+i];if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}});});
  const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const y=v=>pt+(hi-v)/(hi-lo)*ph,x=i=>pl+cw*i+cw/2;
  const vmax=Math.max(...R.map(r=>r[5]||0))||1,base=pt+ph+gap+vh,vy=v=>base-(v/vmax)*vh;
  const step=(()=>{const raw=(hi-lo)/5,p=10**Math.floor(Math.log10(raw));return [1,2,2.5,5,10].map(k=>k*p).find(k=>k>=raw);})();
  let g=`<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${C.grid}" stroke-width=".6"/><text x="${W-pr+6}" y="${(y(v)+4).toFixed(1)}" fill="${C.dim}" font-size="11">${v>=100?v.toFixed(0):v.toFixed(2)}</text>`;
  let pm='';R.forEach((r,i)=>{const m=String(r[0]).slice(0,7);if(m!==pm){pm=m;g+=`<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${pt}" y2="${base}" stroke="${C.grid}" stroke-width=".5" stroke-dasharray="2 3"/><text x="${(x(i)+3).toFixed(1)}" y="${H-6}" fill="${C.dim}" font-size="11">${Number(m.slice(5))}월</text>`;}});
  R.forEach((r,i)=>{const [,o,h,l,c,v]=r,col=c>=o?C.up:C.down,top=y(Math.max(o,c)),bh=Math.max(1,Math.abs(y(o)-y(c)));
    g+=`<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(h).toFixed(1)}" y2="${y(l).toFixed(1)}" stroke="${col}" stroke-width="1"/><rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`
      +`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${vy(v||0).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-vy(v||0)).toFixed(1)}" fill="${col}" opacity=".45"/>`;});
  M.forEach(m=>{const pts=R.map((_,i)=>m.v[st+i]==null?null:`${x(i).toFixed(1)},${y(m.v[st+i]).toFixed(1)}`).filter(Boolean).join(' ');
    if(pts)g+=`<polyline points="${pts}" fill="none" stroke="${MC[m.p]}" stroke-width="1.6"/>`;});
  const last=R[R.length-1];
  g+=`<text x="${pl}" y="17" fill="${C.text}" font-size="12" font-weight="700">${esc(last[0])} 종가 ${last[4]}</text>`
    +M.map((m,k)=>`<text x="${170+k*100}" y="17" fill="${MC[m.p]}" font-size="12">${m.p}일선 ${m.v[rows.length-1]==null?'—':m.v[rows.length-1].toFixed(2)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${R.length}거래일 일봉과 10·20·50일 이동평균">${g}</svg>`;
}
function researchBlock(R){
  if(!R||!['done','no_source'].includes(R.status))return '';

  const revKo={raised:'📈 상향',lowered:'📉 하향',mixed:'혼조',none:'조정 없음',unknown:'확인 안 됨'}[rev.direction]||'';
  let b=`<div class="sec"><h4>왜 올랐나 — 도윤 리서치 <span class="dim">(조사 ${esc(R.researchedOn||'')}${R.confidence?` · 근거 ${esc(CONF_KO[R.confidence]||R.confidence)}`:''}${revKo?` · 전망치 ${revKo}`:''})</span></h4>`;
  if(R.company)b+=`<div class="pi">${esc(R.company)}</div>`;

  if(cp)b+=`<div class="note" style="color:var(--yel)"><b>반대 근거·한계</b></div>`+cp;

  const uc=R.upcomingCatalyst;

   근거 목록은 claimList 가 출처 검증 통과분만 그린다. 숫자는 전부 AI 가 입력 JSON 에서 인용한 것 — 지어내지 않는다. */
// 체크표 — 서준 심층(AI)·도윤 체크표(코드)가 같은 모양 [{item,status,evidence}] 을 쓴다
function ck(list){
  if(!(list||[]).length)return '';
  const cnt={ok:0,no:0,na:0};
  const body=list.map(x=>{const st=String(x.status||'');const cls=st==='충족'?'ok':st==='미충족'?'no':'na';cnt[cls]++;const mark=st==='충족'?'✅':st==='미충족'?'❌':'—';
    return `<span class="${cls}">${mark} ${esc(x.item||'')}</span><span>${esc(x.evidence||'')}</span>`;}).join('');
  return `<div class="note" style="margin:0 0 6px">충족 ${cnt.ok} · 미충족 ${cnt.no} · 확인 불가 ${cnt.na}</div><div class="ck">${body}</div>`;
}
function deepBlock(D){
  if(!D)return '';
  if(D.status!=='done')return `<div class="nosrc" style="margin-top:6px">🔎 ${esc(D.note||'심층 분석 실패')}</div>`;
  const F=D.financials||{},rev=F.estimateRevisions||{};
  const revKo={raised:'📈 상향',lowered:'📉 하향',mixed:'혼조',none:'조정 없음',unknown:'확인 안 됨'}[rev.direction]||'';
  const C=D.chartObservation||{};
  let b=`<details class="deep"><summary>🔎 심층 분석 — 조사 ${esc(D.researchedOn||'')}${D.carried?' (이월)':''}${D.failedToday?' · 오늘 재조사 실패':''} · 근거 ${esc(CONF_KO[D.confidence]||D.confidence||'')}${D.factcheck&&D.factcheck.removed&&D.factcheck.removed.length?` · 검증에서 ${D.factcheck.removed.length}건 제거`:''}</summary>`;
  if(D.company)b+=`<div class="pi" style="margin-top:8px">${esc(D.company)}</div>`;
  if(D.lead)b+=`<div class="pi lead">${esc(D.lead)}</div>`;
  b+=`<h5>최근 뉴스</h5>`+(D.newsNarrative?`<div class="pi">${esc(D.newsNarrative)}</div>`:'')+(claimList(D.recentNews)||`<div class="nosrc">검증을 통과한 뉴스 근거가 없습니다</div>`);
  b+=`<h5>재무${revKo?` <span class="chip">전망치 ${revKo}</span>`:''}</h5>`+(D.financialsNarrative?`<div class="pi">${esc(D.financialsNarrative)}</div>`:'');
  const fin=claimList([...(F.revenueTrend||[]),...(F.profitTrend||[]),...(F.guidance||[]),...((rev.claims)||[])],{quote:false});
  if(fin)b+=fin;
  if((D.canslim||[]).length)b+=`<h5>CAN SLIM 체크 <span class="note" style="display:inline">(오닐 기준 · 기관 보유 자료 없음)</span></h5>`+ck(D.canslim);
  b+=`<h5>리스크</h5>`+(claimList(D.risks)||`<div class="note">보도된 리스크 근거 없음 (지어내지 않습니다)</div>`);
  if((D.structuralRisks||[]).length)b+=`<ul class="plist">${D.structuralRisks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if((D.chartCheck||[]).length)b+=`<h5>쿨라매기 돌파 셋업 체크 <span class="chip">판정 아님 · 관찰</span></h5>`+ck(D.chartCheck);
  if(C.base||C.volume||C.position)b+=`<h5>차트 관찰 <span class="chip">판정 아님</span></h5>`+rows([['횡보',esc(C.base||'—')],['거래량',esc(C.volume||'—')],['위치',esc(C.position||'—')],['이평선',esc(C.maStack||'—')]])+(C.note?`<div class="note" style="margin-top:5px">${esc(C.note)}</div>`:'');
  if((D.entryChecklist||[]).length)b+=`<h5>사기 전에 직접 확인할 것</h5><ul class="plist">${D.entryChecklist.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(D.earningsRisk)b+=`<div class="note" style="margin-top:6px">📅 ${esc(D.earningsRisk)}</div>`;
  return b+`</details>`;
}

      ${p.deep?deepBlock(p.deep):''}</div>`;
    const w=(t.plans||[]).filter(p=>p.watch),b=(t.plans||[]).filter(p=>!p.watch);
    let h=`<div class="sec"><h4>오늘 밤 관심 종목 ${w.length}개</h4>`+(w.length?w.map(card).join(''):`<div class="empty">피벗 근처에서 쉬는 종목 없음</div>`)+`</div>`;
    if(b.length)h+=`<div class="sec"><h4>피벗 근처지만 뺀 종목 ${b.length}개</h4>`+b.map(card).join('')+`</div>`;
    if((t.post||[]).length)h+=`<div class="sec"><h4>이미 피벗을 넘은 종목 ${t.postTotal}개</h4>
      ${rows(t.post.map(p=>[`${esc(p.ticker)} <span class="chip">${esc(p.grade)}</span>`,`${esc(p.breakDate)} 돌파 · ${p.barsSinceBreak}봉 전 · 피벗 대비 ${sg(p.distToPivotPct)}% · 이격 ${sg(p.extensionAdr)} ADR`]))}
      <div class="note">넘은 뒤에 사는 건 추격이라 밤 관심 목록에 넣지 않습니다.</div></div>`;
    if((t.triggers||[]).length)h+=`<div class="sec"><h4>지난밤 트리거</h4>${rows(t.triggers.slice(0,12).map(x=>[`${esc(x.ticker)} ${esc(x.at||'')}`,esc(x.ko||'')]))}</div>`;
    if((t.positions||[]).length)h+=`<div class="sec"><h4>모의 보유 ${t.positions.length}종목</h4>${rows(t.positions.map(x=>[`${esc(x.ticker)}`,`진입 ${n(x.entry)} (${esc(x.entryDate)}) · 손절 ${n(x.stop)} · 현재 ${sg(x.R)}R`]))}</div>`;
    const s=t.stats;
    if(s&&s.n)h+=`<div class="sec"><h4>모의투자 성적</h4>${rows([['거래',s.n+'건'],['승률',n(s.winPct,1)+'%'],['평균',n(s.avgR)+'R'],
      ['손익비',s.profitFactor==null?'—':n(s.profitFactor)],['누적',sg(s.equityPct)+'%'],['최대 낙폭',n(s.mdd,1)+'%']])}
      <div class="note">체결은 실제 주문이 아니라 자체 장부의 계산입니다(슬리피지 ${n(t.slipPct,1)}% 가정).</div></div>`;
    h+=`<div class="sec"><h4>규칙</h4>${rows([['규칙 버전','v'+esc(t.rulesVersion)],['시장',esc(t.regime)],['종목당 위험',n(t.riskPct,2)+'%'],
      ['예비 손절',`피벗 − ${n(t.stopAdr,1)} ADR`],['실적 달력',t.earningsOk?'확인':'⚠️ 못 받음'],
      ['루프 상태',t.health?`${esc(t.health.at||'')} · ${esc(t.health.status||'')}`:'아직 돌지 않음']])}</div>`;
    return h;
  }
  /* 실장 */
  const c=D.chief; if(!c)return '<div class="empty">데이터 없음</div>';
  let h='';
  if(c.llm&&c.llm.status==='done'){
    h+=`<div class="sec"><h4>오늘 한마디</h4><div class="ko">${esc(c.llm.headline||'')}</div>
      <div style="margin-top:8px">${prose(c.llm.marketVerdictKo||'')}</div></div>`;
    if((c.llm.todayFocus||[]).length)h+=`<div class="sec"><h4>오늘의 포커스</h4>`+
      c.llm.todayFocus.map(f=>`<div style="margin-bottom:9px"><b>${esc(f.ticker)}</b>
        <div class="note">${esc(f.reason)}<br>→ ${esc(f.action)}</div></div>`).join('')+`</div>`;
    if(c.llm.chartCheckNote)h+=`<div class="sec"><h4>차트에서 확인할 것</h4>${prose(c.llm.chartCheckNote)}</div>`;
    // tomorrowWatch 는 리포트에만 있고 대시보드·리서치룸 어디에도 없었다 (감사 3-2)
    if(c.llm.tomorrowWatch)h+=`<div class="sec"><h4>내일 볼 것</h4>${prose(c.llm.tomorrowWatch)}</div>`;
    if(c.llm.caution)h+=`<div class="sec"><h4>주의 · 이 보고의 한계</h4><div class="nosrc">${esc(c.llm.caution)}</div></div>`;
  }
  const cc=(D.cc&&D.cc.items)||[];
  if(cc.length)h+=`<div class="sec"><h4>👁️ 오늘 차트를 봐야 할 종목</h4>`+
    cc.map(x=>`<div style="margin-bottom:9px"><span class="tk" data-tk="${esc(x.ticker)}">${esc(x.ticker)}</span> <span class="chip">score ${x.score}</span>
      <a href="https://finviz.com/quote.ashx?t=${esc(x.ticker)}" target="_blank" style="font-size:12px">차트 ↗</a>
      <div class="note">${(x.reasons||[]).map(esc).join(' · ')}</div></div>`).join('')+`</div>`;
  const k=c.counts||{};
  h+=`<div class="sec"><h4>오늘의 숫자</h4>${rows([['유니버스',k.universe],['2팀 선정',k.picks],
    ['추적 활성',k.tracking?k.tracking.active:'—'],['7주 고점 상향',k.breakouts],['거래량 급증',k.epCandidates]])}</div>`;
  if(c.llm&&c.llm.verified)h+=`<div class="sec"><h4>출처 검증</h4>
    ${rows([['검사한 URL',c.llm.verified.checked],['생존',c.llm.verified.ok],
      ['미검증(봇차단)',c.llm.verified.unverified],['죽은 링크 제거',c.llm.verified.dead],['근거없음 강등',c.llm.verified.stripped]])}
    <div class="note">모든 출처는 실제 HTTP 요청으로 생존을 확인합니다. 403/429 는 WSJ 같은 정상 매체의 봇 차단이라 제거하지 않고 '미검증'으로 남깁니다.</div></div>`;
  return h;
}

function openAgent(id){
  const a=AGENTS.find(x=>x.id===id);
  const br=briefing(id);
  const llmSum=(D.chief&&D.chief.llm&&D.chief.llm.teamSummaries&&D.chief.llm.teamSummaries[id])||'';
  $('mbox').innerHTML=`<div class="mhead"><div class="avatar">${avatar(a,'')}</div>
    <div><h3>${a.name}</h3><div class="role">${a.role}</div></div>
    <button class="x" onclick="closeM()">닫기 ✕</button></div>`
    +(a.duty?`<div class="sec duty"><h4>🪧 ${esc(a.job||'')} — 이 사람이 하는 일</h4>
       <p class="pi">${a.duty}</p></div>`:'')
    +(br?`<div class="sec brief"><h4>💬 ${a.name}의 브리핑</h4><div class="pi">${br}</div>
       ${llmSum?`<div class="pi" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">${esc(llmSum)}</div>`:''}</div>`:'')
    +bodyFor(id)
    +`<div style="text-align:center;margin-top:14px">
       <a class="btn btn2" href="dashboard/breakout-room.html#${a.tab}">이 팀 전체 자료 보기 →</a></div>`;
  $('mbox').classList.toggle('wide',id==='t2');
  $('modal').classList.add('on');
  if(id==='t2')listView(_listKey);
}
function closeM(){$('modal').classList.remove('on');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM();};
$('modal2').onclick=e=>{if(e.target.id==='modal2')closeM2();};
document.onkeydown=e=>{if(e.key==='Escape'){if($('modal2').classList.contains('on'))closeM2();else closeM();}};

board();paperStrip();cards();
// 주소 바로가기 — #t2 (담당자 창) · #tk=MRNA (종목 팝업) · #t2&tk=MRNA (둘 다). 텔레그램 링크에서 바로 열 수 있게.
(function(){const h=new URLSearchParams(location.hash.slice(1).replace(/^([a-z0-9]+)(&|$)/,'a=$1$2'));
  const a=h.get('a');if(a&&AGENTS.some(x=>x.id===a))openAgent(a);
  const tk=h.get('tk');if(tk)openTicker(tk.toUpperCase());})();
</script>

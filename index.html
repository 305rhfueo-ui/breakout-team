<style>
:root{--bg:#0b0f16;--room:#131925;--desk:#1b2332;--bd:#2b3547;--tx:#dbe3ee;--dim:#8b96a8;
--grn:#3fb950;--red:#f85149;--yel:#e3b341;--blu:#58a6ff;--pur:#c084fc;--org:#f5a524}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#18202e,var(--bg));
color:var(--tx);font:15px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;min-height:100vh}
a{color:var(--blu)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}

header{text-align:center;margin-bottom:18px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px}

.board{background:var(--room);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:18px 0}
.board .ko{font-size:15px;line-height:1.7}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-right:8px}
.b-green{background:#0f2a17;color:var(--grn);border:1px solid #1f5c2e}
.b-red{background:#2b1414;color:var(--red);border:1px solid #5c2626}
.b-yellow{background:#2a2410;color:var(--yel);border:1px solid #5c4a1a}
.b-gray{background:#1b2332;color:var(--dim);border:1px solid var(--bd)}

/* ── 사무실 ── */
.room{position:relative;background:linear-gradient(180deg,#151d2c 0%,#151d2c 58%,#101622 58%,#0d1320 100%);
border:1px solid var(--bd);border-radius:18px;padding:26px 16px 22px;margin-top:20px;overflow:hidden}
.room::before{content:"";position:absolute;left:0;right:0;top:58%;height:1px;background:#26314a}
.wall{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#0f1725;border:1px solid #2b3547;
border-radius:8px;padding:6px 16px;font-size:11.5px;color:var(--dim);white-space:nowrap}

.desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:38px;position:relative;z-index:2}
/* padding-top 은 말풍선이 올라앉을 자리다. 얼굴을 가리지 않으려면
   말풍선 '바닥'을 이 선에 붙이고 위로 자라게 해야 한다 (.bub 참조). */
.seat{text-align:center;cursor:pointer;position:relative;padding-top:118px}
.seat:hover .body{transform:translateY(-4px)}

/* 말풍선 */
/* ⚠️ top 기준으로 아래로 자라면 말이 길어질수록 얼굴을 덮는다.
   bottom 을 캐릭터 머리 위 선(112px)에 고정하고 위로 자라게 한다. */
.bub{position:absolute;top:112px;left:50%;transform:translate(-50%,-100%) scale(.88);
transform-origin:bottom center;width:190px;
background:#eef3fb;color:#16202f;border-radius:14px;padding:9px 12px;font-size:11.5px;line-height:1.5;
box-shadow:0 8px 20px rgba(0,0,0,.5);opacity:0;transition:.35s;pointer-events:none;text-align:left;z-index:5}
.bub::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
border:7px solid transparent;border-top-color:#eef3fb;border-bottom:0}
.bub.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bub b{color:#0b57d0}

/* 캐릭터 + 책상 */
.body{transition:.2s}
/* 미니미는 책상 뒤에 앉는다 — 하반신이 책상에 가리도록 아래로 겹친다 */
.mini{display:block;margin:0 auto -20px;position:relative;z-index:1;
  animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.seat:nth-child(2) .mini{animation-delay:.4s}
.seat:nth-child(3) .mini{animation-delay:.8s}
.seat:nth-child(4) .mini{animation-delay:1.2s}
.seat:nth-child(5) .mini{animation-delay:1.6s}
.seat:nth-child(6) .mini{animation-delay:2s}
.mhead .avatar .mini{animation:none;margin:0;filter:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.deskTop{margin:4px auto 0;width:96%;max-width:150px;height:44px;border-radius:8px 8px 4px 4px;
background:linear-gradient(180deg,#2a3448,#1d2534);border:1px solid #36425c;position:relative;z-index:2;
display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 -3px 8px rgba(0,0,0,.35)}
.mon{width:38px;height:26px;border-radius:3px;background:#0a1220;border:1px solid #3b4a66;position:relative;overflow:hidden}
.mon::after{content:"";position:absolute;inset:2px;border-radius:2px;
background:linear-gradient(120deg,#123 0%,#1b4d7a 40%,#123 80%);animation:scan 2.6s linear infinite}
@keyframes scan{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.mon.red::after{background:linear-gradient(120deg,#2a1116,#7a1b28 40%,#2a1116 80%)}
.mon.green::after{background:linear-gradient(120deg,#0f2a17,#1b7a3c 40%,#0f2a17 80%)}

.nameTag{margin-top:8px;font-size:14px;font-weight:700}
.roleTag{font-size:10.5px;color:var(--dim)}
.kpi{margin-top:6px;font-size:19px;font-weight:800;color:#fff;line-height:1.2}
.kpil{font-size:10px;color:var(--dim)}
.kline{margin-top:5px;font-size:10.5px;line-height:1.5;color:#9dabc0;min-height:2em}
.busy{position:absolute;top:122px;right:12px;width:7px;height:7px;border-radius:50%;
background:var(--grn);animation:pulse 1.6s infinite;z-index:3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.busy.idle{background:var(--dim);animation:none}

.chiefSeat{grid-column:1/-1}
.chiefSeat .deskTop{max-width:280px;height:50px}
.chiefSeat .mini{margin-bottom:-18px}

.talkbar{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px;
font-size:12px;color:var(--dim);position:relative;z-index:2}
.tbtn{background:var(--desk);border:1px solid var(--bd);color:var(--tx);border-radius:8px;
padding:6px 14px;cursor:pointer;font-size:12px}
.tbtn:hover{border-color:var(--blu)}
.hint{text-align:center;color:var(--dim);font-size:11.5px;margin-top:10px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{background:#238636;color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-weight:700;font-size:15px}
.btn:hover{background:#2ea043}
.btn2{background:var(--desk);color:var(--tx);border:1px solid var(--bd)}
.btn2:hover{border-color:var(--blu)}

/* ── 모달 ── */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;padding:18px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:820px;margin:24px auto;background:var(--room);border:1px solid var(--bd);border-radius:16px;padding:20px}
.mhead{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:14px}
.mhead .avatar{width:46px;flex:0 0 46px;animation:none}
.mhead h3{margin:0;font-size:19px}
.x{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--dim);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
.x:hover{color:var(--tx);border-color:var(--blu)}
.sec{background:#101724;border:1px solid var(--bd);border-radius:10px;padding:13px;margin-bottom:11px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.sec.brief{background:linear-gradient(180deg,#141d2e,#101724);border-color:#33405a}
.sec.brief h4{color:var(--blu);font-size:13px}
.sec.brief .pi{margin-bottom:12px}
.sec.brief .pi:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1c2433;font-size:13.5px}
.row:last-child{border:0}
.row b{color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#1b2332;border:1px solid var(--bd);border-radius:99px;padding:3px 11px;font-size:12px}
.note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
/* 긴 서술 정리 */
.pi{margin:0 0 10px;font-size:13.5px;line-height:1.75;color:var(--tx)}
.plist{margin:0;padding-left:20px;font-size:13.5px;line-height:1.8}
.plist li{margin-bottom:9px}
.plist li b{color:#fff}
.ref{font-size:10.5px;color:var(--blu);text-decoration:none;vertical-align:super}
.ref:hover{text-decoration:underline}
.quote{display:block;margin:6px 0;padding:7px 11px;border-left:3px solid var(--bd);
background:#0c121d;color:var(--dim);font-size:12px;line-height:1.6;font-style:italic}
.srcs{margin-top:11px;padding-top:9px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--dim)}
.srcs a{color:var(--dim);text-decoration:none}
.srcs a:hover{color:var(--blu)}
.more{background:none;border:0;color:var(--blu);cursor:pointer;font-size:12px;padding:2px 0}
.more:hover{text-decoration:underline}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clip.open{-webkit-line-clamp:unset}
.nosrc{color:var(--yel);font-size:12.5px}
.empty{color:var(--dim);text-align:center;padding:16px;font-size:13px}
.mhead .role{font-size:12px;color:var(--dim);margin-top:2px}
.disc{text-align:center;color:var(--dim);font-size:11.5px;margin-top:30px;line-height:1.8}
@media(max-width:560px){h1{font-size:21px}.stat{font-size:19px}.mini{width:52px}}
</style>

<div class="wrap">
<header>
  <h1>📈 브레이크아웃 리서치룸</h1>

</header>

<div class="board" id="board"></div>
<div class="room">

  <div class="desks" id="desks"></div>

</div>

<div class="disc">
  ⚠️ 교육용 스크리닝 자료이며 투자 조언이 아닙니다. 최종 판단은 본인의 차트 확인으로 하세요.<br>
  숫자는 코드가 계산하고, 서술은 AI 가 담당하며, 모든 출처 URL 은 실제 접속 확인을 거칩니다.
</div>
</div>

<script>
const D={chief:window.CHIEF_DATA,t1:window.TEAM1_DATA,t2:window.TEAM2_DATA,t3:window.TEAM3_DATA,
         t4:window.TEAM4_DATA,t5:window.TEAM5_DATA,cc:window.CHARTCHECK_DATA};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>v==null||Number.isNaN(Number(v))?'—':Number(v).toFixed(d);
const tp=v=>v==null?'—':(100-Number(v)).toFixed(1);

/* 팀별 담당자 — 이름·머리모양·옷색은 취향껏 바꾸셔도 됩니다.
   look = {skin, hair, style, shirt, glasses, tie} 로 미니미 SVG 가 생성됩니다.
   style: short | long | bun | spiky | bob | part */
const AGENTS=[
  {id:'t1',emoji:'🔭',name:'한별',role:'1팀 · 시장환경',tab:'t1',
   look:{skin:'#f3d0b4',hair:'#3b2a24',style:'long', shirt:'#5b8def',glasses:true}},
  {id:'t2',emoji:'🎯',name:'도윤',role:'2팀 · 종목선정',tab:'t2',
   look:{skin:'#eec59f',hair:'#1f1a17',style:'short',shirt:'#3fb27f'}},
  {id:'t3',emoji:'📋',name:'수아',role:'3팀 · 추적관리',tab:'t3',
   look:{skin:'#f7dcc4',hair:'#4a2f2a',style:'bun',  shirt:'#a86ee0'}},
  {id:'t4',emoji:'⚡',name:'재민',role:'4팀 · EP·촉매',tab:'t4',
   look:{skin:'#e0b087',hair:'#241d1a',style:'spiky',shirt:'#f08a3c'}},
  {id:'t5',emoji:'🗺️',name:'미르',role:'5팀 · 주도섹터',tab:'t5',
   look:{skin:'#f0cdae',hair:'#5a3a2e',style:'bob',  shirt:'#2fb3ba'}},
  {id:'chief',emoji:'🧑‍💼',name:'실장',role:'종합 · 오늘의 지시',tab:'chief',wide:true,
   look:{skin:'#eec7a4',hair:'#2b2320',style:'part', shirt:'#3a4560',tie:'#c0392b',glasses:true}},
];

/* ── 미니미 SVG ──
   외부 이미지·폰트 없이 그린다 (file:// 과 GitHub Pages 양쪽에서 동일하게 보이려면
   이미지 파일을 쓰면 안 된다). viewBox 64×78 상반신, 책상 위로 올라앉는 구도. */
function mini(a,w){
  const L=a.look||{},skin=L.skin||'#f0cdae',hair=L.hair||'#2b2320',shirt=L.shirt||'#5b8def';
  const dark=(c,f)=>{ // 목 그림자·옷 접힘용 어두운 톤
    const m=/^#(..)(..)(..)$/.exec(c); if(!m)return c;
    return '#'+[1,2,3].map(i=>Math.round(parseInt(m[i],16)*(f||0.82)).toString(16).padStart(2,'0')).join('');
  };
  const H={
    short:`<path d="M17 30q0-15 15-15t15 15q-2-8-15-7T17 30z" fill="${hair}"/>`,
    long :`<path d="M15 28q0-16 17-16t17 16v20q0 4-4 4t-3-5V30q-10 3-20 0v17q1 5-3 5t-4-4z" fill="${hair}"/>`,
    bun  :`<circle cx="32" cy="8" r="6.5" fill="${hair}"/>
           <path d="M17 30q0-15 15-15t15 15q-3-9-15-8t-15 8z" fill="${hair}"/>`,
    spiky:`<path d="M17 30q0-15 15-15t15 15q-3-9-15-8t-15 8z" fill="${hair}"/>
           <path d="M21 18l2.5-7 3 5.5 4-8 4 8 3-5.5 2.5 7z" fill="${hair}"/>`,
    bob  :`<path d="M15 28q0-16 17-16t17 16v10q0 4-4 4V29q-10 3-26 0v13q-4 0-4-4z" fill="${hair}"/>`,
    part :`<path d="M17 30q0-15 15-15t15 15q-1-7-9-8-8 4-15 1-5 2-6 7z" fill="${hair}"/>`,
  };
  // 안경은 얇고 밝게 — 굵으면 선글라스처럼 보여 눈이 사라진다
  const g=L.glasses?`<g fill="rgba(255,255,255,.18)" stroke="#6b7c96" stroke-width="1.1">
      <circle cx="26" cy="29.5" r="4.6"/><circle cx="38" cy="29.5" r="4.6"/></g>
      <path d="M30.6 29.5h2.8M21.4 28.6l-3.4-.8M42.6 28.6l3.4-.8" stroke="#6b7c96" stroke-width="1.1" fill="none"/>`:'';
  const tie=L.tie?`<path d="M32 52l-3 4 3 12 3-12z" fill="${L.tie}"/><path d="M32 48l-3.5 4h7z" fill="${dark(L.tie,0.8)}"/>`:'';
  return `<svg class="mini" viewBox="0 0 64 78" width="${w||58}" role="img" aria-label="${esc(a.name)}">
    <!-- 몸통 -->
    <path d="M32 46c-12 0-20 8-20 18v14h40V64c0-10-8-18-20-18z" fill="${shirt}"/>
    <path d="M32 46c-4 0-7 .6-10 1.8L32 60l10-12.2C39 46.6 36 46 32 46z" fill="${dark(shirt,0.86)}"/>
    ${tie}
    <!-- 목 -->
    <path d="M27 40h10v8q0 4-5 4t-5-4z" fill="${dark(skin,0.88)}"/>
    <!-- 귀 · 머리 -->
    <circle cx="17.5" cy="30" r="3.2" fill="${skin}"/><circle cx="46.5" cy="30" r="3.2" fill="${skin}"/>
    <ellipse cx="32" cy="28" rx="15" ry="16" fill="${skin}"/>
    ${H[L.style]||H.short}
    <!-- 눈 · 입 -->
    <circle cx="26" cy="29.5" r="1.9" fill="#22303f"/><circle cx="38" cy="29.5" r="1.9" fill="#22303f"/>
    <path d="M28.5 36q3.5 3 7 0" stroke="#22303f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    ${g}
  </svg>`;
}

/* ── 상단 보드 ── */
function board(){
  const c=D.chief;
  if(!c){$('board').innerHTML='<div class="empty">아직 데이터가 없습니다. <code>node scripts/run-breakout.js</code> 를 실행하세요.</div>';return;}
  const m=c.market||{};
  const cls={green:'b-green',yellow:'b-yellow',red:'b-red'}[m.verdict]||'b-gray';
  const face={green:'🟢',yellow:'🟡',red:'🔴'}[m.verdict]||'⚪';
  $('board').innerHTML=
    `<div><span class="badge ${cls}">${face} 시장 ${esc(m.verdict||'?')}</span>
      <span class="badge ${m.finra==='danger'?'b-red':m.finra==='warn'?'b-yellow':'b-gray'}">마진부채 ${esc(m.finra||'?')}</span>
      <span class="badge b-gray">${esc(c.generated||'')}</span></div>
     <div class="ko" style="margin-top:10px">${esc(m.ko||'')}</div>
     ${m.finraKo?`<div class="ko" style="color:var(--dim);font-size:13.5px">${esc(m.finraKo)}</div>`:''}`;
}

/* ── 각 자리에 표시할 핵심 수치 ── */
function _dd(id){
  if(id==='t1'){
    const q=(D.t1&&D.t1.qqq)||{};
    return {stat:q.verdict?({green:'🟢',yellow:'🟡',red:'🔴'}[q.verdict]||'⚪'):'—',
      statl:'QQQ 쿨라매기 판정',
      line:D.t1?`MA10 ${n(q.ma10)} / MA20 ${n(q.ma20)}<br>주도주 ${(D.t1.leaders&&D.t1.leaders.stocks||[]).length}종목 감시 중`:'대기 중',
      busy:!!D.t1};
  }
  if(id==='t2'){
    const t=D.t2,rc=(t&&t.research_coverage)||{},th=(t&&t.themes)||{};
    return {stat:t?(t.picks||[]).length:'—',statl:'오늘 선정 종목',
      line:t?`${esc(String(th.headline||'테마 정리 전'))}<br>리서치 ${rc.done??0}/${rc.total??(t.picks||[]).length}`:'대기 중',
      busy:!!t};
  }
  if(id==='t3'){
    const s=(D.t3&&D.t3.summary)||{};
    return {stat:s.active??'—',statl:'추적 활성 종목',
      line:D.t3?`배제 ${s.excluded} · 오늘 탈락 ${(D.t3.dropped_today||[]).length}<br>전고점 돌파 ${(D.t3.breakouts||[]).length}종목`:'대기 중',
      busy:!!D.t3};
  }
  if(id==='t4'){
    const t=D.t4;
    const hl=t&&t.llm&&t.llm.highlights?t.llm.highlights.length:0;
    return {stat:t?t.universeHits:'—',statl:'거래량 급증 포착',
      line:t?`분석 ${t.analyzed}종목${hl?` · ★촉매 ${hl}건`:''}<br>${Object.entries(t.byPhase||{}).filter(([k])=>k!=='none').map(([k,v])=>k+' '+v).join(' · ')||'셋업 없음'}`:'대기 중',
      busy:!!t};
  }
  if(id==='t5'){
    const t=D.t5;
    const m6=(t&&t.strictTop2&&t.strictTop2.m6)||[];
    const top=m6[0];
    return {stat:t?m6.length:'—',statl:'상위 2% 업종 (6개월)',
      line:t?(top?`1위 ${esc(top.industry)}<br>WRS ${n(top.wrs&&top.wrs.m6,3)} · 상위 ${n(top.rankPct&&top.rankPct.m6,2)}%`:'해당 업종 없음'):'대기 중',
      busy:!!t};
  }
  const cc=(D.cc&&D.cc.items)||[];
  return {stat:cc.length,statl:'👁️ 오늘 차트를 봐야 할 종목',
    line:cc.length?cc.map(x=>esc(x.ticker)).join(' · '):'오늘은 수렴 조건 만족 종목 없음',
    busy:!!D.chief};
}

let _timer=null;
function runDialog(){
  const L=dialog();
  if(_timer)clearTimeout(_timer);
  document.querySelectorAll('.bub').forEach(b=>{b.classList.remove('on');b.innerHTML='';});
  let i=0;
  const step=()=>{
    document.querySelectorAll('.bub').forEach(b=>b.classList.remove('on'));
    if(i>=L.length){
      $('turn').textContent='회의 종료 — 담당자를 클릭해 보세요';
      return;
    }
    const cur=L[i];
    const el=$('bub-'+cur.who);
    const a=AGENTS.find(x=>x.id===cur.who);
    if(el){el.innerHTML=`<b>${a?a.name:''}</b><br>${cur.t}`;el.classList.add('on');}
    $('turn').textContent=`${i+1} / ${L.length}`;
    i++;
    // 글자 수에 비례한 시간 (읽을 시간을 준다)
    const ms=Math.min(6500,Math.max(2600,String(cur.t).replace(/<[^>]+>/g,'').length*95));
    _timer=setTimeout(step,ms);
  };
  step();
}

/* ── 긴 서술 정리 ──
   LLM 이 돌려주는 why/summary 는 URL 이 문장 한가운데 박혀 있고 (1)(2)(3) 이 한 줄에 붙어 있어
   그대로 뿌리면 글 덩어리가 된다. 여기서 세 가지만 한다.
     ① 인라인 URL 을 빼내 각주 링크로 내린다 (본문에는 [1] 위첨자만 남는다)
     ② (1)(2)(3) / ①②③ 로 나뉜 항목을 <ol> 로 쪼갠다
     ③ 40자 넘는 따옴표 인용은 인용 블록으로 뺀다
   ⚠️ 내용을 자르지 않는다. 재배치만 한다. */
function prose(text){
  if(text==null||text==='')return '<div class="note">내용 없음</div>';
  if(Array.isArray(text))return text.map(x=>prose(x)).join('');
  if(typeof text==='object')return prose(text.statement||text.text||text.why||JSON.stringify(text));

  let s=String(text).trim();
  if(!s)return '<div class="note">내용 없음</div>';

  // ① URL 추출 — 문장 끝의 구두점은 URL 에 포함시키지 않는다
  const refs=[];
  const MK=String.fromCharCode(1);   // 각주 자리표시 센티널 (본문 숫자와 절대 안 겹친다)
  s=s.replace(/https?:\/\/[^\s<>"')\]]+/g,(u)=>{
    const url=u.replace(/[.,;:]+$/,'');
    let i=refs.indexOf(url);
    if(i<0){refs.push(url);i=refs.length-1;}
    return MK+(i+1)+MK;
  });

  // ② 항목 분리 — (1) 또는 ① 로 시작하는 조각이 2개 이상일 때만
  const marks=s.match(/(?:\(\d\)|[①②③④⑤⑥⑦⑧⑨])/g)||[];
  let items=null;
  if(marks.length>=2){
    items=s.split(/(?=\(\d\)|[①②③④⑤⑥⑦⑧⑨])/).map(x=>x.trim()).filter(Boolean);
    if(items.length<2)items=null;
  }

  // 이스케이프 후 각주 마커·인용을 HTML 로 되돌린다
  const render=(str)=>{
    let h=esc(str);
    h=h.replace(new RegExp(MK+'(\\d+)'+MK,'g'),(m,i)=>
      `<a class="ref" href="${esc(refs[i-1])}" target="_blank" rel="noopener">[${i}]</a>`);
    // ③ 긴 인용문 분리
    h=h.replace(/&quot;([^&]{40,}?)&quot;/g,'<span class="quote">$1</span>');
    return h;
  };

  let out;
  if(items){
    out='<ol class="plist">'+items.map(x=>
      `<li>${render(x.replace(/^(?:\(\d\)|[①②③④⑤⑥⑦⑧⑨])\s*/,''))}</li>`).join('')+'</ol>';
  }else{
    // 문장 3개 이상이면 문단으로 나눠 읽기 쉽게
    const paras=s.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
    out=paras.map(p=>`<p class="pi">${render(p)}</p>`).join('');
  }

  if(refs.length)
    out+='<div class="note">출처 '+refs.map((u,i)=>
      `<a class="ref" href="${esc(u)}" target="_blank" rel="noopener">[${i+1}]</a> ${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,46))}${u.length>60?'…':''}`
    ).join(' · ')+'</div>';
  return out;
}

/* ⚠️ 글자 수로 자르면 문장 중간이 끊긴다. 줄 단위로 접고 '더보기'로 펼친다.
   본문은 항상 전부 들어있으므로 잘려서 사라지는 내용이 없다. */
let _clipId=0;
function clip(html,lines=3){
  const id='c'+(++_clipId);
  return `<div class="clip" id="${id}" style="-webkit-line-clamp:${lines}">${html}</div>
    <button class="more" onclick="(function(){var e=document.getElementById('${id}');
      e.classList.toggle('open');this.textContent=e.classList.contains('open')?'접기 ▲':'더보기 ▼';}).call(this)">더보기 ▼</button>`;
}

/* ── 담당자 브리핑 ──

   LLM 없이 데이터만으로 생성하므로 오프라인에서도 읽힌다. */

      if(q.priceAboveAll)P.push(`다만 주가(${n(q.price)})는 세 이동평균선 위에 있습니다. 최근 반등이 강했다는 뜻인데, <b>평균선 배열이 아직 안 돌아왔으니</b> 추세 전환으로 보긴 이릅니다. 10일선이 20일선을 다시 위로 뚫는 걸 눈으로 확인한 뒤 들어가세요.`);
    } else if(q.verdict==='green'){
      P.push(`진입 가능한 구간입니다. 10일선이 20일선 위에 있고 둘 다 우상향이에요${q.sweetSpot?` — 특히 골든크로스 D+${q.daysSinceGoldenCross}로 통계적 최적 구간입니다`:''}.`);
    } else if(q.verdict==='yellow'){
      P.push(`애매한 구간입니다. 강하게 베팅할 자리는 아니고 <b>포지션을 줄이거나 확실한 셋업만</b> 고르세요.`);
    }
    if(f.level==='danger')P.push(`그리고 <b>빚내서 산 돈이 너무 많습니다.</b> 마진부채가 1년 전보다 ${n(f.yoyPct,1)}% 늘었어요(경고선 +40%). 이런 상태에서 하락이 시작되면 강제청산이 연쇄로 터져 낙폭이 평소보다 훨씬 커집니다. 손절선을 평소보다 타이트하게 잡으세요.`);
    else if(f.level==='warn')P.push(`마진부채가 ${n(f.yoyPct,1)}%로 주의 구간(+30% 초과)입니다. 레버리지 사용은 줄이는 게 좋습니다.`);
    const oh=L.market_overheat||{};
    if(oh.over150===0)P.push(`한편 200일선 대비 +150%를 넘긴 과열 종목은 <b>0개</b>입니다. 아직 시장을 끌고 갈 확실한 주도주가 안 나왔다는 뜻이라, 서둘러 진입할 이유가 없습니다.`);
    else if(oh.over150>=2)P.push(`주도주 ${oh.over150}종목이 200일선 +150%를 넘겼습니다. 과열 신호이니 보유분 <b>분할 차익실현</b>을 검토하세요(전량 매도는 금물).`);
    return P.join(' ');
  }
  if(id==='t2'){
    const t=D.t2; if(!t)return '';
    const s=t.stats||{};

    else P.push(`특정 테마 쏠림은 뚜렷하지 않습니다. 주도 테마가 없는 장이라는 뜻이라 종목 선별이 더 중요합니다.`);
    if(t.research_coverage&&t.research_coverage.pending)P.push(`상승 이유는 ${t.research_coverage.done}종목만 조사했습니다. 나머지 ${t.research_coverage.pending}종목은 비용 상한 때문에 대기 중이고 며칠이면 채워집니다 — <b>빠진 걸 숨기지 않고 그대로 표시</b>합니다.`);

    } else P.push(`오늘 배제된 종목은 없습니다.`);
    if(bk.length){
      const ok=bk.filter(b=>b.volumeConfirmed).length;
      P.push(`전고점을 뚫은 종목이 <b>${bk.length}개</b>인데, 그중 거래량까지 실린 건 <b>${ok}개</b>뿐입니다.`);
      if(bk.length-ok>0)P.push(`나머지 ${bk.length-ok}개는 거래량 없이 올라간 거라 <b>가짜 돌파일 수 있습니다.</b> 쿨라매기는 거래량 없는 돌파를 신뢰하지 않아요.`);
      const names=bk.filter(b=>b.volumeConfirmed).slice(0,4).map(b=>b.ticker);
      if(names.length)P.push(`거래량까지 확인된 <b>${names.join(', ')}</b> 를 먼저 보세요.`);
    } else P.push(`오늘 전고점을 뚫은 종목은 없습니다.`);
    return P.join(' ');
  }
  if(id==='t4'){
    const t=D.t4; if(!t)return '';
    P.push(`거래량이 갑자기 터진 종목 <b>${t.universeHits}개</b>를 찾아 상위 ${t.analyzed}개를 뜯어봤습니다.`);
    const ph=t.byPhase||{};
    const setups=Object.entries(ph).filter(([k])=>k!=='none').map(([k,v])=>`${k} ${v}`);
    if(ph.bounce_trigger)P.push(`이 중 <b>${ph.bounce_trigger}종목이 매수 트리거</b> 상태입니다 — 6개월 횡보 → 거래량 동반 돌파 → 저항선 되돌림 → 반등, 우리가 노리는 바로 그 자리예요.`);
    if(ph.retest)P.push(`${ph.retest}종목은 돌파 후 저항선까지 되돌아온 리테스트 구간입니다. 여기서 거래량이 마르면서 버티면 다음 반등이 진입 자리입니다.`);
    if(ph.extended)P.push(`${ph.extended}종목은 이미 너무 올라 <b>추격 금지</b>입니다. 되돌림을 기다리세요.`);
    if(!setups.length)P.push(`다만 6개월 횡보 패턴에 해당하는 셋업은 오늘 없습니다. 거래량이 터졌다고 다 살 자리는 아니에요.`);
    const hl=(t.llm&&t.llm.highlights)||[];
    if(hl.length)P.push(`촉매 분석에서 <b>${hl.map(x=>x.ticker).join(', ')}</b> 가 어닝 서프라이즈·산업 돌파에 해당합니다 — 쿨라매기가 가장 선호하는 호재입니다.`);
    else P.push(`뉴스를 못 찾은 종목은 억지로 이유를 만들지 않고 '암묵적(뉴스 없는 이상거래량)'으로 분류합니다.`);
    return P.join(' ');
  }
  if(id==='t5'){
    const t=D.t5; if(!t)return '';
    const top=(t.strictTop2&&t.strictTop2.m6)||[];
    P.push(`업종 ${t.totalIndustries}개의 상대강도(WRS)를 계산했습니다. WRS는 그 업종 종목들의 시가총액 가중 평균 초과수익률이에요 — 0이면 QQQ와 같고, 높을수록 시장을 이기고 있다는 뜻입니다.`);
    if(top.length){
      const f=top[0];
      P.push(`6개월 기준 <b>${f.industry}</b> 가 1위입니다(WRS ${n(f.wrs.m6,3)}, 상위 ${n(f.rankPct.m6,2)}%). ${f.count}종목짜리 업종이에요.`);
      // 기간 비교로 로테이션 읽기
      const rising=top.filter(x=>x.rankPct.m1!=null&&x.rankPct.m6!=null&&x.rankPct.m1<x.rankPct.m6);
      const fading=top.filter(x=>x.rankPct.m1!=null&&x.rankPct.m6!=null&&x.rankPct.m1>x.rankPct.m6+10);
      if(rising.length)P.push(`<b>${rising.map(x=>x.industry).join(', ')}</b> 는 1개월 순위가 6개월보다 높습니다 — 지금 새로 돈이 들어오고 있다는 신호예요.`);
      if(fading.length)P.push(`반대로 <b>${fading.map(x=>x.industry).join(', ')}</b> 는 6개월은 상위인데 1개월이 밀렸습니다. 돈이 빠져나가는 중일 수 있으니 주의하세요.`);
    } else P.push(`엄격한 상위 2%에 드는 업종이 오늘은 없습니다.`);
    if(t.validation&&t.validation.recovered)P.push(`참고로 원본 사이트의 WRS는 ${t.validation.recovered}개 업종이 계산 오류로 비어 있어서, <b>같은 공식으로 직접 계산해 복구</b>했습니다.`);
    return P.join(' ');
  }
  /* 실장 — 사장께 올리는 보고 */
  const c=D.chief; if(!c)return '';
  const k=c.counts||{},m=c.market||{},cc=(D.cc&&D.cc.items)||[];
  const q=(D.t1&&D.t1.qqq)||{},f=(D.t1&&D.t1.finra)||{},oh=(D.t1&&D.t1.leaders&&D.t1.leaders.market_overheat)||{};
  const t3=D.t3||{},t4=D.t4||{},t2=D.t2||{};
  const H=[];

  // ① 결론
  H.push(`<b>[결론]</b> `+(
    m.verdict==='red'
      ? `오늘은 <b>신규 매수를 하지 않는 날</b>입니다. 관심종목만 정리하고 기다리시는 걸 권합니다.`
      : m.verdict==='green'
      ? `오늘은 <b>준비된 셋업을 실행해도 되는 날</b>입니다.`
      : `오늘은 <b>확실한 것만 골라야 하는 날</b>입니다. 평소보다 포지션을 줄이세요.`));

  // ② 왜 그런지 — 근거 2개
  const why=[];
  if(q.verdict==='red')why.push(`QQQ의 10일 평균선(${n(q.ma10)})이 20일 평균선(${n(q.ma20)}) 아래로 내려간 지 <b>${q.daysSinceDeathCross??'?'}일째</b>입니다. 짧은 흐름이 긴 흐름보다 약하다는 뜻이라, 쿨라매기 규칙상 새로 사는 자리가 아닙니다`);
  else if(q.verdict==='green')why.push(`QQQ의 10일선이 20일선 위에 있고 둘 다 올라가고 있습니다${q.daysSinceGoldenCross!=null?` (골든크로스 D+${q.daysSinceGoldenCross})`:''}`);
  if(f.level==='danger')why.push(`빚내서 주식 산 돈(마진부채)이 1년 전보다 <b>${n(f.yoyPct,1)}%</b> 늘었습니다. 경고선이 +40%인데 이를 넘겼어요. 이런 상태에서 하락이 오면 강제청산이 연쇄로 터져 평소보다 훨씬 깊게 빠집니다`);
  else if(f.level==='warn')why.push(`마진부채가 ${n(f.yoyPct,1)}%로 주의 구간입니다`);
  if(oh.over150===0)why.push(`200일선 대비 +150%를 넘긴 종목이 <b>0개</b>입니다. 시장을 끌고 갈 주도주가 아직 없다는 뜻이라 서두를 이유가 없습니다`);
  if(why.length)H.push(`<b>[근거]</b> ${why.join('. 그리고 ')}.`);

  // ③ 오늘 한 일
  const did=[];
  if(t2.stats)did.push(`${t2.stats.universe}종목을 훑어 <b>${t2.stats.afterMa150}종목</b>을 선정`);
  if(t3.summary)did.push(`추적 ${t3.summary.active}종목 관리 (오늘 ${(t3.dropped_today||[]).length}종목 탈락)`);
  if(t4.universeHits)did.push(`거래량 급증 ${t4.universeHits}종목 점검`);
  if(did.length)H.push(`<b>[오늘 한 일]</b> ${did.join(' · ')}.`);

  // ④ 눈여겨볼 것
  const bk=(t3.breakouts||[]).filter(b=>b.volumeConfirmed);
  const note=[];
  if(bk.length)note.push(`전고점을 <b>거래량까지 실어서</b> 뚫은 종목이 ${bk.length}개 있습니다 — ${bk.slice(0,5).map(b=>b.ticker).join(', ')}. 거래량 없는 돌파 ${(t3.breakouts||[]).length-bk.length}개는 가짜일 수 있어 제외했습니다`);
  const trig=(t4.items||[]).filter(i=>i.congestion&&i.congestion.phase==='bounce_trigger');
  if(trig.length)note.push(`4팀에서 <b>${trig.map(i=>i.ticker).join(', ')}</b> 가 매수 트리거 상태입니다 (6개월 횡보 → 돌파 → 되돌림 → 반등)`);
  const hl=(t4.llm&&t4.llm.highlights)||[];
  if(hl.length)note.push(`촉매가 확인된 종목: <b>${hl.map(x=>x.ticker).join(', ')}</b> (어닝 서프라이즈·산업 돌파)`);
  const th=t2.themes&&t2.themes.llm&&t2.themes.llm.leadingTheme;
  if(th&&th.strength!=='none')note.push(`오늘의 주도 테마는 <b>${esc(th.name)}</b> 입니다`);
  if(note.length)H.push(`<b>[눈여겨볼 것]</b> ${note.join('. ')}.`);

  // ⑤ 사장님이 하실 일
  if(cc.length){
    H.push(`<b>[사장님이 하실 일]</b> 오늘 <b>직접 차트를 봐야 할 종목이 ${cc.length}개</b>입니다 — ${cc.map(x=>x.ticker).join(', ')}. `+
      `시스템이 "변동성이 줄고 거래량이 마르면서 저항선에 붙었다"고 판단한 종목들입니다. `+
      `차트에서 <b>①횡보 폭이 점점 좁아지는지 ②거래량 막대가 줄고 있는지 ③저항선을 거래량 터뜨리며 뚫는지</b> 이 세 가지를 확인해 주세요. `+
      `돌파를 확인하시면 저에게 알려주시면 기록해 두겠습니다.`);
  } else {
    H.push(`<b>[사장님이 하실 일]</b> 오늘은 수렴 조건을 만족하는 종목이 없어 따로 확인하실 차트가 없습니다. 쉬셔도 됩니다.`);
  }

  // ⑥ 신뢰도
  const v=(c.llm&&c.llm.verified)||null;
  H.push(`<b>[이 보고의 신뢰도]</b> 숫자는 전부 코드가 계산했고 제가 임의로 바꾸지 않았습니다. 뉴스·상승 이유 같은 서술만 AI가 조사했으며, `+
    (v?`오늘 인용한 출처 <b>${v.checked}개 URL을 실제로 접속</b>해 확인했습니다. 살아있는 링크 ${v.ok}개, 유료 페이월 등으로 확인 못 한 것 ${v.unverified}개, 죽은 링크 ${v.dead}개는 삭제했고 근거가 사라진 주장 ${v.stripped}건은 '근거 없음'으로 내렸습니다.`
      :`모든 출처 URL은 실제 접속으로 생존을 확인하며 죽은 링크가 붙은 주장은 '근거 없음'으로 내립니다.`)+
    ` <b>근거를 못 찾으면 지어내지 않고 없다고 말합니다.</b>`);

  if(t2.research_coverage&&t2.research_coverage.pending)
    H.push(`<b>[한계]</b> 선정 ${t2.research_coverage.total}종목 중 ${t2.research_coverage.done}종목만 상승 이유를 조사했습니다. 나머지 ${t2.research_coverage.pending}종목은 비용 상한 때문에 대기 중이며 며칠이면 채워집니다. 빠진 걸 숨기지 않고 그대로 보고드립니다.`);

  return H.map(x=>`<p class="pi">${x}</p>`).join('');
}

/* [라벨, 값] 배열 → 표 행. 값에 이미 만들어 둔 HTML 이 들어오므로 여기서 esc 하지 않는다
   (호출부가 esc() 를 씌워서 넘긴다). */
function rows(list){
  if(!list||!list.length)return '<div class="note">표시할 항목 없음</div>';
  return list.map(([k,v])=>`<div class="row"><span>${k==null?'':k}</span><b>${v==null?'—':v}</b></div>`).join('');
}

function bodyFor(id){
  if(id==='t1'){
    const t=D.t1; if(!t)return '<div class="empty">데이터 없음</div>';
    const q=t.qqq||{},f=t.finra||{},L=t.leaders||{};
    let h=`<div class="sec"><h4>쿨라매기 판정</h4><div class="ko">${esc(q.ko||'')}</div>
      ${rows([['QQQ 종가',n(q.price)],['MA10 / MA20 / MA50',`${n(q.ma10)} / ${n(q.ma20)} / ${n(q.ma50)}`],
        ['10MA 기울기',n(q.slope10Pct)+'%'],['골든크로스',esc(q.goldenCrossDate||'—')+(q.daysSinceGoldenCross!=null?` (D+${q.daysSinceGoldenCross})`:'')],
        ['데드크로스',esc(q.deathCrossDate||'—')+(q.daysSinceDeathCross!=null?` (D+${q.daysSinceDeathCross})`:'')]])}</div>`;
    h+=`<div class="sec"><h4>FINRA 고객 마진부채</h4><div class="ko">${esc(f.ko||'')}</div>
      ${f.latest?rows([['최신',`${esc(f.latest.month)} · ${f.latest.debit.toLocaleString()}M$`],
        ['전년동월',f.prior?`${esc(f.prior.month)} · ${f.prior.debit.toLocaleString()}M$`:'—'],['증가율',n(f.yoyPct,1)+'%']]):''}</div>`;
    const st=(L.stocks||[]).slice(0,6);
    if(st.length)h+=`<div class="sec"><h4>주도주 200일선 이격도</h4>
      ${rows(st.map(s=>[`${esc(s.ticker)} · ${esc(s.sector)}`,`${n(s.div200,1)}% ${esc(s.overheat.label)}`]))}</div>`;
    const nw=t.news||{};
    if(nw.llm&&nw.digest&&nw.digest.length){
      h+=`<div class="sec"><h4>오늘의 시장 뉴스</h4>`+
        nw.digest.slice(0,4).map(x=>`<div style="margin-bottom:10px">
          <b>${esc(x.headline)}</b>${clip(`<div class="pi">${esc(x.easy||'')}</div>`+(x.whyMatters?`<div class="note" style="margin-top:6px"><b>내 종목엔?</b> ${esc(x.whyMatters)}</div>`:''),3)}
          ${(x.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" style="font-size:12px">${esc(s.publisher)} ↗</a>`).join(' · ')}</div>`).join('')+`</div>`;
    }
    return h;
  }
  if(id==='t2'){
    const t=D.t2; if(!t)return '<div class="empty">데이터 없음</div>';
    const s=t.stats||{};
    let h=`<div class="sec"><h4>스크리닝 퍼널</h4>
      ${rows([['유니버스',s.universe],['RS 상위 2% 합집합',s.unionTop],['ADR ≥ 4 통과',s.afterAdr],['150일선 위 (최종)',`<span style="color:var(--grn)">${s.afterMa150}</span>`]])}
      <div class="note">기간별 상위 2%: 1개월 ${s.byPeriod.m1} · 3개월 ${s.byPeriod.m3} · 6개월 ${s.byPeriod.m6}</div></div>`;
    h+=`<div class="sec"><h4>테마</h4><div class="ko">${esc(t.themes.headline||'')}</div>`;
    if(t.themes.llm){const L=t.themes.llm;
      h+=`<div style="margin-top:12px"><b style="color:var(--pur);font-size:15px">${esc(L.leadingTheme.name)}</b>
        <span class="chip">${esc(L.leadingTheme.strength)}</span></div>
        <div style="margin-top:9px">${prose(L.leadingTheme.why)}</div>`;
      if(L.crossCuttingDriver)h+=`<div style="margin-top:12px"><h4>공통 동인</h4>${prose(L.crossCuttingDriver)}</div>`;
      if(L.caution)h+=`<div class="note" style="margin-top:10px">⚠️ ${esc(L.caution)}</div>`;
    }
    h+=`</div>`;

    const done=(t.picks||[]).filter(p=>p.research&&p.research.status==='done').slice(0,6);
    if(done.length)h+=`<div class="sec"><h4>리서치 완료 종목 — 왜 올랐나</h4>`+
      done.map(p=>{
        const R=p.research||{};
        // ⚠️ whyRose[0] 만 보면 그 항목이 출처검증에서 걸러졌을 때 종목 전체가 근거 없어 보인다.
        //    출처가 살아있는 항목을 우선 고른다.
        const claims=(R.whyRose||[]).filter(c=>c.evidence_level==='sourced'&&(c.sources||[]).length);
        const rev=R.estimateRevisions||{};
        const revKo={raised:'📈 상향',lowered:'📉 하향',mixed:'혼조',none:'조정 없음',unknown:'확인 안 됨'}[rev.direction]||'';
        let b=`<div style="margin-bottom:16px"><b style="font-size:15px">${esc(p.ticker)}</b>
          <span class="chip">${esc(p.sector)}</span>${revKo?`<span class="chip">전망치 ${revKo}</span>`:''}`;
        if(!claims.length){
          b+=`<div class="nosrc" style="margin-top:6px">검증을 통과한 상승 이유 근거가 없습니다 (지어내지 않습니다)</div>`;
        }else{
          b+='<ul class="plist" style="margin-top:7px">'+claims.slice(0,3).map(c=>{
            const src=(c.sources||[]).slice(0,2).map(s=>
              `<a class="ref" href="${esc(s.url)}" target="_blank" title="${esc(s.title||'')}">[${esc(s.publisher||'출처')}]</a>`).join(' ');
            return `<li>${esc(c.statement)} ${src}</li>`;
          }).join('')+'</ul>';
        }
        if(rev.claims&&rev.claims.length){
          const rc=rev.claims.filter(c=>c.evidence_level==='sourced');
          if(rc.length)b+=`<div class="note" style="margin-top:4px"><b>증권사 전망치:</b> ${esc(rc[0].statement)}
            ${(rc[0].sources||[]).slice(0,1).map(s=>`<a class="ref" href="${esc(s.url)}" target="_blank">[${esc(s.publisher||'출처')}]</a>`).join('')}</div>`;
        }
        return b+'</div>';
      }).join('')+
      `<div class="note">리서치 ${t.research_coverage.done}/${t.research_coverage.total}${t.research_coverage.pending?` · 대기 ${t.research_coverage.pending}종목 (상한 때문. 며칠이면 전량 커버)`:''}</div></div>`;
    h+=`<div class="sec"><h4>선정 종목 (상위 12)</h4>
      ${rows((t.picks||[]).slice(0,12).map(p=>[`${esc(p.ticker)} · ${esc(p.industry)}`,`상위 ${tp(p.bestPct)}% · ADR ${n(p.adr,1)}`]))}</div>`;
    return h;
  }
  if(id==='t3'){
    const t=D.t3; if(!t)return '<div class="empty">데이터 없음</div>';
    const s=t.summary||{};
    let h=`<div class="sec"><h4>추적 현황</h4>${rows([['활성',s.active],['휴면',s.dormant],['배제',s.excluded],['누적 총계',s.total]])}
      <div class="note">배제 조건 ① 50일선 아래 3일 연속 ② 편입 후 고점 대비 −40% ③ 종가가 150일선 아래</div></div>`;
    if((t.dropped_today||[]).length)h+=`<div class="sec"><h4>오늘 배제</h4>
      ${rows(t.dropped_today.slice(0,8).map(d=>[esc(d.ticker),`<span class="note">${esc(d.reason)}</span>`]))}</div>`;
    const b=(t.breakouts||[]).slice(0,10);
    if(b.length)h+=`<div class="sec"><h4>전고점 돌파 ${t.breakouts.length}종목</h4>
      ${rows(b.map(x=>[`${esc(x.ticker)}${x.volumeConfirmed?' ✅':''}`,`${n(x.closeAbovePct,1)}% · VOL_X ${n(x.volx,1)}`]))}
      <div class="note">✅ = 거래량 확인 (VOL_X ≥ 2.0 또는 주간 배수 ≥ 2.0)</div></div>`;
    return h;
  }
  if(id==='t4'){
    const t=D.t4; if(!t)return '<div class="empty">데이터 없음</div>';
    let h=`<div class="sec"><h4>Episodic Pivot 후보</h4>
      ${rows([['거래량 급증 종목',t.universeHits],['분석',t.analyzed]])}
      <div class="note">필터: VOL_X ≥ 2.0 (거래대금/20일평균) 또는 주간 거래량배수 ≥ 2.0 (당일제외 5일평균)</div></div>`;
    if(t.llm&&t.llm.highlights&&t.llm.highlights.length)
      h+=`<div class="sec"><h4>★ 어닝 서프라이즈 · 산업 돌파</h4>`+
        t.llm.highlights.map(x=>`<div style="margin-bottom:8px"><b>${esc(x.ticker)}</b> <span class="chip">분류 ${x.category}</span>
          <div class="note">${esc(x.oneLine||'')}</div></div>`).join('')+`</div>`;
    const nt=(t.items||[]).filter(i=>i.congestion&&i.congestion.phase!=='none').slice(0,8);
    if(nt.length)h+=`<div class="sec"><h4>Congestion 셋업</h4>
      ${rows(nt.map(i=>[`${esc(i.ticker)} · ${esc(i.congestion.phaseKo)}`,
        `횡보 ${n(i.congestion.baseMonths,1)}개월 · VOL_X ${n(i.volx,1)}`]))}</div>`;
    const cat=(t.items||[]).filter(i=>i.catalyst&&i.catalyst.status==='done').slice(0,4);
    if(cat.length)h+=`<div class="sec"><h4>촉매 분류</h4>`+
      cat.map(i=>`<div style="margin-bottom:9px"><b>${esc(i.ticker)}</b> <span class="chip">${esc(i.catalyst.categoryName||'')}</span>
        ${clip(`<div class="pi">${esc(i.catalyst.volumeExplanation||'')}</div>`,3)}</div>`).join('')+`</div>`;
    return h;
  }
  if(id==='t5'){
    const t=D.t5; if(!t)return '<div class="empty">데이터 없음</div>';
    let h=`<div class="sec"><h4>WRS 검증</h4><div class="note">${esc(t.note||'')}<br>
      사이트 정상 ${t.validation.comparable}그룹 중 ${t.validation.matched} 일치 · NaN ${t.validation.recovered}그룹 자체 복구</div></div>`;
    for(const [k,lab] of [['m6','6개월'],['m1','1개월'],['m3','3개월']]){
      const L=(t.strictTop2&&t.strictTop2[k])||[];
      if(!L.length)continue;
      h+=`<div class="sec"><h4>WRS(${lab}) 상위 2% 업종</h4>
        ${rows(L.map(x=>[`${esc(x.industry)} (${x.count}종목)`,`${n(x.wrs[k],4)} · 상위 ${n(x.rankPct[k],2)}%`]))}</div>`;
    }
    if(t.llm&&t.llm.industries&&t.llm.industries.length)
      h+=`<div class="sec"><h4>강세 사유</h4>`+
        t.llm.industries.slice(0,3).map(x=>`<div style="margin-bottom:11px"><b>${esc(x.industry)}</b>
          <span class="chip">${esc(x.driver)}</span><span class="chip">${esc(x.durability)}</span>
          ${clip((x.whyStrong||[]).filter(c=>c.evidence_level==='sourced').slice(0,3).map(c=>
              `<div class="pi" style="margin-bottom:7px">• ${esc(c.statement)} ${(c.sources||[]).slice(0,1).map(sr=>
                `<a class="ref" href="${esc(sr.url)}" target="_blank">[${esc(sr.publisher||'출처')}]</a>`).join('')}</div>`).join('')
              ||'<div class="nosrc">검증 통과한 근거 없음</div>',4)}</div>`).join('')+`</div>`;
    return h;
  }
  /* 실장 */
  const c=D.chief; if(!c)return '<div class="empty">데이터 없음</div>';
  let h='';
  if(c.llm&&c.llm.status==='done'){
    h+=`<div class="sec"><h4>오늘 한마디</h4><div class="ko">${esc(c.llm.headline||'')}</div>
      <div class="note" style="margin-top:8px">${esc(c.llm.marketVerdictKo||'')}</div></div>`;
    if((c.llm.todayFocus||[]).length)h+=`<div class="sec"><h4>오늘의 포커스</h4>`+
      c.llm.todayFocus.map(f=>`<div style="margin-bottom:9px"><b>${esc(f.ticker)}</b>
        <div class="note">${esc(f.reason)}<br>→ ${esc(f.action)}</div></div>`).join('')+`</div>`;
    if(c.llm.chartCheckNote)h+=`<div class="sec"><h4>차트에서 확인할 것</h4><div class="note">${esc(c.llm.chartCheckNote)}</div></div>`;
  }
  const cc=(D.cc&&D.cc.items)||[];
  if(cc.length)h+=`<div class="sec"><h4>👁️ 오늘 차트를 봐야 할 종목</h4>`+
    cc.map(x=>`<div style="margin-bottom:9px"><b>${esc(x.ticker)}</b> <span class="chip">score ${x.score}</span>
      <a href="https://finviz.com/quote.ashx?t=${esc(x.ticker)}" target="_blank" style="font-size:12px">차트 ↗</a>
      <div class="note">${(x.reasons||[]).map(esc).join(' · ')}</div></div>`).join('')+`</div>`;
  const k=c.counts||{};
  h+=`<div class="sec"><h4>오늘의 숫자</h4>${rows([['유니버스',k.universe],['2팀 선정',k.picks],
    ['추적 활성',k.tracking?k.tracking.active:'—'],['전고점 돌파',k.breakouts],['거래량 급증',k.epCandidates]])}</div>`;
  if(c.llm&&c.llm.verified)h+=`<div class="sec"><h4>출처 검증</h4>
    ${rows([['검사한 URL',c.llm.verified.checked],['생존',c.llm.verified.ok],
      ['미검증(봇차단)',c.llm.verified.unverified],['죽은 링크 제거',c.llm.verified.dead],['근거없음 강등',c.llm.verified.stripped]])}
    <div class="note">모든 출처는 실제 HTTP 요청으로 생존을 확인합니다. 403/429 는 WSJ 같은 정상 매체의 봇 차단이라 제거하지 않고 '미검증'으로 남깁니다.</div></div>`;
  return h;
}

function openAgent(id){
  const a=AGENTS.find(x=>x.id===id);
  const br=briefing(id);
  const llmSum=(D.chief&&D.chief.llm&&D.chief.llm.teamSummaries&&D.chief.llm.teamSummaries[id])||'';
  $('mbox').innerHTML=`<div class="mhead"><div class="avatar">${mini(a,46)}</div>
    <div><h3>${a.name}</h3><div class="role">${a.role}</div></div>
    <button class="x" onclick="closeM()">닫기 ✕</button></div>`
    +(br?`<div class="sec brief"><h4>💬 ${a.name}의 브리핑</h4><div class="pi">${br}</div>
       ${llmSum?`<div class="pi" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">${esc(llmSum)}</div>`:''}</div>`:'')
    +bodyFor(id)
    +`<div style="text-align:center;margin-top:14px">
       <a class="btn btn2" href="dashboard/breakout-room.html#${a.tab}">이 팀 전체 자료 보기 →</a></div>`;
  $('modal').classList.add('on');
}
function closeM(){$('modal').classList.remove('on');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM();};
document.onkeydown=e=>{if(e.key==='Escape')closeM();};

board();office();
$('replay').onclick=runDialog;
</script>

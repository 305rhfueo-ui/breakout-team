<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브레이크아웃 팀 — 쿨라매기 전략</title>

<!-- ⚠️ file:// 로 열리므로 fetch() 는 CORS 에 막힌다. 데이터는 반드시 window 전역 .js 로 로드한다. -->
<script src="data/chief.js"      onerror="window.__NO_CHIEF=1"></script>
<script src="data/team1.js"      onerror="window.__NO_T1=1"></script>
<script src="data/team2.js"      onerror="window.__NO_T2=1"></script>
<script src="data/team3.js"      onerror="window.__NO_T3=1"></script>
<script src="data/team4.js"      onerror="window.__NO_T4=1"></script>
<script src="data/team5.js"      onerror="window.__NO_T5=1"></script>
<script src="data/chartcheck.js" onerror="window.__NO_CC=1"></script>
<script src="data/industry-ko.js"></script>
<script src="data/history.js"    onerror="window.__NO_HIST=1"></script>
<script src="data/series/_index.js" onerror="window.__NO_SERIES=1"></script>

<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--bd:#30363d;--tx:#c9d1d9;--dim:#8b949e;
--grn:#2ea043;--red:#f85149;--yel:#e3b341;--blu:#58a6ff;--pur:#c084fc;--org:#f5a524}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
a{color:var(--blu)}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;margin:0}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--panel);border:1px solid var(--bd);border-radius:99px;padding:4px 11px;font-size:12px;white-space:nowrap}
.chip b{color:#fff}
/* ── 티커 검색 ── */
.search{position:relative;max-width:460px;margin:12px auto 0}
.search input{width:100%;background:#0f1725;border:1px solid var(--bd);border-radius:10px;
padding:10px 14px;color:var(--tx);font-size:14px;font-family:inherit}
.search input:focus{outline:none;border-color:var(--blu)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 5px);background:#111a27;border:1px solid var(--bd);
border-radius:10px;overflow:hidden;display:none;z-index:40;box-shadow:0 10px 28px rgba(0,0,0,.55);max-height:340px;overflow-y:auto}
.sug.on{display:block}
.sug .it{padding:9px 13px;cursor:pointer;display:flex;gap:9px;align-items:baseline;border-bottom:1px solid #1b2431}
.sug .it:last-child{border:0}
.sug .it:hover,.sug .it.sel{background:#1a2434}
.sug .it b{color:#fff;min-width:62px}
.sug .it span{color:var(--dim);font-size:12px}
.sug .it i{margin-left:auto;color:var(--dim);font-size:11px;font-style:normal}
.sug .msg{padding:11px 13px;color:var(--dim);font-size:12.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:16px}
.tab{background:var(--panel);border:1px solid var(--bd);color:var(--dim);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--blu);border-color:var(--blu);color:#04101f;font-weight:700}
.pane{display:none}.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.verdict{font-size:15px;padding:12px;border-radius:8px;border-left:4px solid var(--dim);background:var(--panel2);margin-bottom:10px}
.v-green{border-left-color:var(--grn)}.v-yellow{border-left-color:var(--yel)}.v-red{border-left-color:var(--red)}
.v-danger{border-left-color:var(--red)}.v-warn{border-left-color:var(--yel)}.v-normal{border-left-color:var(--grn)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th:hover{color:var(--tx)}
tbody tr:hover{background:#1d2430}
.tk{color:var(--blu);font-weight:700;cursor:pointer}
.tk:hover{text-decoration:underline}
.b{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid}
.b-grn{color:var(--grn);border-color:#1f4d2b;background:#0f2417}
.b-red{color:var(--red);border-color:#5c2626;background:#2a1414}
.b-yel{color:var(--yel);border-color:#5c4a1a;background:#241f0e}
.b-dim{color:var(--dim);border-color:var(--bd);background:var(--panel2)}
.b-pur{color:var(--pur);border-color:#4a2d63;background:#1e1329}
.banner{background:#241f0e;border:1px solid #5c4a1a;color:var(--yel);border-radius:8px;padding:11px 14px;margin-bottom:14px}
.banner.red{background:#2a1414;border-color:#5c2626;color:var(--red);font-weight:600}
.para{font-size:13.5px;line-height:1.75;margin:0 0 9px}
.para:last-child{margin-bottom:0}
.headline{font-size:17px;font-weight:700;color:#fff;line-height:1.6;padding:12px 14px;border-radius:8px;background:var(--panel2);border-left:4px solid var(--blu);margin-bottom:12px}
details.rm summary{cursor:pointer;color:var(--dim);font-size:12px}
details.rm summary:hover{color:var(--tx)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:12.5px;margin-top:6px}
.kv span{color:var(--dim)}
.stat{background:var(--panel2);border-radius:8px;padding:11px}
.stat .n{font-size:22px;font-weight:700;color:#fff}
.stat .l{font-size:11px;color:var(--dim)}
.funnel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.funnel span{background:var(--panel2);border-radius:6px;padding:5px 10px}
.arrow{color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12px;color:var(--dim);margin-top:6px}
.reason{font-size:11.5px;color:var(--dim)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;padding:20px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:1000px;margin:0 auto;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:18px}
.mhead{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:12px}
.mhead h3{margin:0;font-size:18px}
.x{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--dim);border-radius:8px;padding:5px 12px;cursor:pointer}
.pending{background:var(--panel2);border:1px dashed var(--bd);border-radius:8px;padding:14px;color:var(--dim);font-size:12.5px}
/* 리서치 카드 — 회사 설명(리드) · 근거 목록 · 출처 원문 인용 */
.lead{font-size:13.5px;line-height:1.75;margin-bottom:10px}
.rlist{margin:0;padding-left:19px;font-size:13px;line-height:1.75}
.rlist li{margin-bottom:9px}
.rq{display:block;margin:6px 0;padding:7px 11px;border-left:3px solid var(--bd);
background:var(--panel2);border-radius:0 6px 6px 0;font-size:11.5px;line-height:1.6;color:var(--dim)}
.rsrc{font-size:10.5px;color:var(--blu);text-decoration:none;vertical-align:super;margin-left:3px}
.rsrc:hover{text-decoration:underline}
.empty{color:var(--dim);padding:18px;text-align:center}
svg{display:block}
@media(max-width:640px){.wrap{padding:10px}h1{font-size:16px}}
</style>

<div class="wrap">
<header>
  <h1>📈 브레이크아웃 팀</h1>
  <div class="hud" id="hud"></div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" placeholder="티커나 회사명으로 검색 (예: NVDA, 엔비디아)">
    <div class="sug" id="sug"></div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="pane on" id="p-chief"></div>
<div class="pane" id="p-t1"></div>
<div class="pane" id="p-t2"></div>
<div class="pane" id="p-t3"></div>
<div class="pane" id="p-t4"></div>
<div class="pane" id="p-t5"></div>
<div class="pane" id="p-cc"></div>
<div class="pane" id="p-hist"></div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
const D={chief:window.CHIEF_DATA,t1:window.TEAM1_DATA,t2:window.TEAM2_DATA,t3:window.TEAM3_DATA,
         t4:window.TEAM4_DATA,t5:window.TEAM5_DATA,cc:window.CHARTCHECK_DATA,hist:window.HISTORY_DATA};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>v==null||v===''||Number.isNaN(Number(v))?'—':Number(v).toFixed(d);
const tp=v=>v==null?'—':(100-Number(v)).toFixed(1);   // 백분위 → "상위 N%"
const money=v=>v==null?'—':'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
const vcls=v=>({green:'v-green',yellow:'v-yellow',red:'v-red',danger:'v-danger',warn:'v-warn',normal:'v-normal'}[v]||'');

/* ── 신규 필드 헬퍼 ──
   ⚠️ 아래 필드들은 옛 데이터(2026-09-03 이전 산출물)에 없다. 없으면 아무것도 그리지 않고, 절대 throw 하지 않는다. */
const dayDiff=(a,b)=>{const x=Date.parse(a),y=Date.parse(b);return Number.isFinite(x)&&Number.isFinite(y)?Math.round((y-x)/864e5):null;};
const paras=s=>String(s==null?'':s).split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>`<p class="para">${esc(x)}</p>`).join('');
const runDate=()=>(D.chief&&D.chief.generated)||(D.t2&&D.t2.generated)||(D.t1&&D.t1.generated)||'';
/* 조사·수집 기준일이 실행일과 다를 때만 "조사 YYYY-MM-DD (N일 전)" 배지. 같으면 빈 문자열. */
function asOfBadge(d,base,label){
  if(!d)return '';
  const ds=String(d).slice(0,10),bs=String(base||runDate()).slice(0,10);
  if(bs&&ds===bs)return '';
  const k=bs?dayDiff(ds,bs):null;
  return `<span class="b b-dim" title="실행일(${esc(bs||'?')})과 다른 날짜의 자료">${esc(label||'조사')} ${esc(ds)}${k!=null&&k>0?` (${k}일 전)`:''}</span>`;
}
/* 공지 객체는 {ko,...} 또는 문자열일 수 있다 */
const noticeKo=x=>x==null?'':(typeof x==='string'?x:(x.ko||x.message||x.note||''));
function warnBanner(x,icon){const ko=noticeKo(x);return ko?`<div class="banner red">${icon||'⚠️'} ${esc(ko)}</div>`:'';}
/* 1팀 봉 누락·세션 불일치 배너 — 1팀 탭과 실장 탭 양쪽에 붙인다 (감사 1-1 · 1-5) */
function barsBanner(){
  const ds=(D.t1&&D.t1.data_source)||{};
  let h=warnBanner(ds.barsNotice,'🚫');
  const sm=ds.sessionMismatch;
  if(sm)h+=`<div class="banner">⚠️ RS 세션일${ds.sessionDate?`(${esc(ds.sessionDate)})`:''}과 야후 봉 마지막 날짜${D.t1&&D.t1.qqq&&D.t1.qqq.lastDate?`(${esc(D.t1.qqq.lastDate)})`:''}가 다릅니다 — VOL_X·Above_150 과 50일선·돌파 판정의 기준일이 섞였을 수 있습니다.${typeof sm==='object'?' '+esc(noticeKo(sm)):typeof sm==='string'?' '+esc(sm):''}</div>`;
  return h;
}
const yn=(v,ok,no)=>v==null?'—':(v?`<span class="b b-grn">${ok||'예'}</span>`:`<span class="b b-dim">${no||'아니오'}</span>`);
const sgn=(v,d)=>v==null||!isFinite(v)?'—':`<span class="b ${v>0?'b-grn':v<0?'b-red':'b-dim'}">${v>0?'+':''}${n(v,d==null?1:d)}%</span>`;
const rsv=(p,k,f)=>p&&p.rs&&p.rs[k]?p.rs[k][f]:null;   // rs.m1.pct / rs.m1.v — rs 가 없어도 안전

const TABS=[['chief','📊 종합'],['t1','1️⃣ 시장환경'],['t2','2️⃣ 종목선정'],['t3','3️⃣ 추적'],
            ['t4','4️⃣ EP·촉매'],['t5','5️⃣ 주도섹터'],['cc','👁️ 차트확인'],['hist','📅 히스토리']];

/* ── 헤더 HUD ── */
function hud(){
  const c=D.chief; if(!c){$('hud').innerHTML='<span class="chip">데이터 없음 — run-breakout 실행 필요</span>';return;}
  const m=c.market||{},k=c.counts||{};
  const v={green:'🟢',yellow:'🟡',red:'🔴'}[m.verdict]||'⚪';
  $('hud').innerHTML=[
    `<span class="chip">QQQ <b>${v} ${esc(m.verdict||'?')}</b></span>`,
    `<span class="chip">마진부채 <b>${esc(m.finra||'?')}</b></span>`,
    `<span class="chip">선정 <b>${k.picks??'—'}</b></span>`,
    `<span class="chip">추적 <b>${k.tracking?k.tracking.active:'—'}</b> (배제 ${k.tracking?k.tracking.excluded:'—'})</span>`,
    `<span class="chip">돌파 <b>${k.breakouts??'—'}</b></span>`,
    `<span class="chip">차트확인 <b>${k.chartCheck??'—'}</b></span>`,
    `<span class="chip">${esc(c.generated||'')}${c.stale?' ⚠️오래된데이터':''}</span>`].join('');
}

/* ── 정렬 가능한 표 ── */
function table(cols,rows,opts={}){
  const id='t'+Math.random().toString(36).slice(2,8);
  const head=cols.map((c,i)=>`<th class="${c.l?'l':''}" data-i="${i}">${esc(c.h)}</th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.l?'l':''}">${c.f(r)}</td>`).join('')+'</tr>').join('');
  setTimeout(()=>{
    const t=$(id); if(!t)return;
    t.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i,c=cols[i];if(!c.s)return;
      const dir=th.dataset.d==='1'?-1:1;
      t.querySelectorAll('th').forEach(x=>x.dataset.d='');
      th.dataset.d=dir===1?'1':'0';
      rows.sort((a,b)=>{const x=c.s(a),y=c.s(b);
        if(x==null)return 1;if(y==null)return -1;
        return typeof x==='string'?dir*x.localeCompare(y):dir*(y-x);});
      t.querySelector('tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.l?'l':''}">${c.f(r)}</td>`).join('')+'</tr>').join('');
      bindTk();
    });
  },0);
  return `<div class="scroll"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bindTk(){
  document.querySelectorAll('.tk[data-t]').forEach(e=>e.onclick=()=>openModal(e.dataset.t));
  document.querySelectorAll('.tk[data-i]').forEach(e=>e.onclick=()=>openIndustry(e.dataset.i));
}

/* ── 종합 ── */
function renderChief(){
  const c=D.chief;
  if(!c){$('p-chief').innerHTML='<div class="empty">데이터가 없습니다. <code>node scripts/run-breakout.js</code> 를 실행하세요.</div>';return;}
  const m=c.market||{},k=c.counts||{};
  let h='';
  const wq=D.t1&&D.t1.weekly_question;
  if(wq&&!wq.answered) h+=`<div class="banner">❓ <b>${esc(wq.question)}</b> (${esc(wq.week)}) — 답하시면 반영합니다:
    <code>node scripts/answer-weekly.js --tickers=NVDA,AVGO</code></div>`;
  if(c.stale) h+=`<div class="banner">⚠️ RS 데이터가 4일 이상 경과했습니다 — 추적 상태 변경을 건너뛰었습니다.</div>`;
  h+=barsBanner();
  h+=`<div class="card"><h2>시장 판정</h2>
      <div class="verdict ${vcls(m.verdict)}">${esc(m.ko||'—')}</div>
      <div class="verdict ${vcls(m.finra)}">${esc(m.finraKo||'—')}</div></div>`;
  h+=`<div class="card"><h2>오늘의 숫자</h2><div class="grid g3">
      <div class="stat"><div class="n">${k.picks??'—'}</div><div class="l">2팀 선정 종목</div></div>
      <div class="stat"><div class="n">${k.tracking?k.tracking.active:'—'}</div><div class="l">추적 활성 (배제 ${k.tracking?k.tracking.excluded:'—'})</div></div>
      <div class="stat"><div class="n">${k.breakouts??'—'}</div><div class="l">전고점 돌파</div></div>
      <div class="stat"><div class="n">${k.epCandidates??'—'}</div><div class="l">거래량 급증(EP 후보)</div></div>
      <div class="stat"><div class="n">${k.chartCheck??'—'}</div><div class="l">👁️ 차트 볼 종목</div></div>
      <div class="stat"><div class="n">${k.universe??'—'}</div><div class="l">유니버스</div></div></div></div>`;
  h+=`<div class="card"><h2>테마</h2><div style="font-size:15px">${esc(c.theme||'—')}</div></div>`;
  if(c.chartCheck&&c.chartCheck.length){
    h+=`<div class="card"><h2>👁️ 오늘 차트를 봐야 할 종목</h2>`+
      c.chartCheck.map(x=>`<div style="margin-bottom:9px"><span class="tk" data-t="${esc(x.ticker)}">${esc(x.ticker)}</span>
        <span class="b b-pur">score ${x.score}</span> <span class="b b-dim">${esc(x.source)}</span>
        <div class="reason">${x.reasons.map(esc).join(' · ')}</div></div>`).join('')+`</div>`;
  }
  h+=chiefLlm(c);
  $('p-chief').innerHTML=h;bindTk();
}

/* ── 실장 LLM 종합 ──
   ⚠️ 예전엔 c.llm.note 한 줄만 그려서 build-chief-report 가 병합을 끝내도 종합 탭이 "대기"였다 (감사 1-9).
      headline → 시장 판단 → 오늘 포커스 → 팀별 요약 → 차트 메모 → 내일 볼 것 → 주의 → 출처 검증 순. */
function chiefLlm(c){
  const L=c.llm||null;
  if(!L||L.status!=='done')
    return `<div class="card"><h2>실장 종합 (LLM)</h2><div class="pending">${esc((L&&L.note)||'대기 — start breakout 실행 후 build-chief-report 가 병합합니다')}</div></div>`;
  let h=reuseBadge(L.reusedFrom);
  h+=`<div class="card"><h2>실장 종합${L.date?` · ${esc(L.date)}`:''}</h2>`;
  if(L.headline)h+=`<div class="headline">${esc(L.headline)}</div>`;
  if(L.marketVerdictKo)h+=`<div style="margin-bottom:4px"><b style="font-size:12px;color:var(--dim)">시장 국면 · 자금 흐름 · 포지션 지침</b></div>`+paras(L.marketVerdictKo);
  h+=`</div>`;
  const tf=Array.isArray(L.todayFocus)?L.todayFocus.filter(Boolean):[];
  if(tf.length){
    h+=`<div class="card"><h2>오늘의 포커스 ${tf.length}종목</h2><div class="scroll"><table style="white-space:normal"><thead><tr>
      <th class="l">종목</th><th class="l">이유</th><th class="l">대응</th></tr></thead><tbody>`+
      tf.map(f=>`<tr><td class="l" style="vertical-align:top"><span class="tk" data-t="${esc(f.ticker)}">${esc(f.ticker)}</span></td>
        <td class="l" style="vertical-align:top;min-width:260px">${esc(f.reason||'')}</td>
        <td class="l" style="vertical-align:top;min-width:220px">${esc(f.action||'')}</td></tr>`).join('')+`</tbody></table></div></div>`;
  } else if(Array.isArray(L.todayFocus)) h+=`<div class="card"><h2>오늘의 포커스</h2><div class="pending">오늘은 포커스 종목이 없습니다</div></div>`;
  const ts=L.teamSummaries;
  if(ts&&typeof ts==='object'){
    const NM={team1:'1팀 시장환경',team2:'2팀 종목선정',team3:'3팀 추적',team4:'4팀 EP·촉매',team5:'5팀 주도섹터'};
    const keys=[...Object.keys(NM).filter(k=>ts[k]),...Object.keys(ts).filter(k=>!NM[k]&&ts[k])];
    if(keys.length)h+=`<div class="card"><h2>팀별 요약</h2>`+keys.map(k=>
      `<div style="margin-bottom:10px"><div style="margin-bottom:3px"><span class="b b-pur">${esc(NM[k]||k)}</span></div>${paras(ts[k])}</div>`).join('')+`</div>`;
  }
  if(L.chartCheckNote)h+=`<div class="card"><h2>👁️ 차트 확인 메모</h2>${paras(L.chartCheckNote)}</div>`;
  if(L.tomorrowWatch)h+=`<div class="card"><h2>내일 볼 것</h2>${paras(L.tomorrowWatch)}</div>`;
  if(L.caution)h+=`<div class="card"><h2>주의 · 이 보고의 한계</h2><div class="verdict v-warn">${paras(L.caution)}</div></div>`;
  const v=L.verified;
  if(v&&typeof v==='object'){
    const rm=Array.isArray(v.removed)?v.removed.filter(Boolean):[];
    h+=`<div class="card"><h2>출처 검증</h2><div class="funnel">
      <span>검사 URL <b>${v.checked??'—'}</b></span><span>생존 <b>${v.ok??'—'}</b></span>
      <span>미검증(봇차단) <b>${v.unverified??'—'}</b></span><span>죽은 링크 제거 <b>${v.dead??'—'}</b></span>
      <span>근거없음 강등 <b>${v.stripped??'—'}</b></span>${v.noQuote!=null?`<span>인용문 없음 <b>${v.noQuote}</b></span>`:''}</div>`;
    if(rm.length)h+=`<details class="rm" style="margin-top:9px"><summary>제거된 출처 ${rm.length}건 — 어떤 근거가 왜 빠졌나</summary>
      <div class="scroll"><table style="margin-top:6px"><thead><tr><th class="l">사유</th><th class="l">URL</th></tr></thead><tbody>`+
      rm.map(r=>`<tr><td class="l">${esc(typeof r==='string'?'':(r.reason||''))}</td>
        <td class="l" style="white-space:normal;word-break:break-all">${(typeof r==='string'?r:r.url)?`<a href="${esc(typeof r==='string'?r:r.url)}" target="_blank">${esc(typeof r==='string'?r:r.url)}</a>`:'—'}</td></tr>`).join('')+
      `</tbody></table></div></details>`;
    h+=`<div class="note">모든 출처는 실제 HTTP 요청으로 생존을 확인합니다. 403/429 는 정상 매체의 봇 차단이라 제거하지 않고 '미검증'으로 남깁니다.</div></div>`;
  }
  return h;
}

/* ── 1팀 ── */
function renderT1(){

  const q=t.qqq||{},f=t.finra||{};

  // 데이터 기준일 한 줄 — RS 갱신 시각 · 세션일 · 봉 마지막 날짜가 서로 다르면 여기서 드러난다 (감사 1-5)
  const ds=t.data_source||{};
  h+=`<div class="note" style="margin-bottom:10px">데이터 출처: RS <b>${esc(ds.source||'?')}</b>${ds.rs_last_updated?` · RS 갱신 ${esc(ds.rs_last_updated)}`:''}${ds.sessionDate?` · RS 세션일 <b>${esc(ds.sessionDate)}</b>`:''}${q.lastDate?` · QQQ 마지막 봉 <b>${esc(q.lastDate)}</b>`:''}${ds.columns!=null?` · 컬럼 ${ds.columns}`:''}${ds.stale?' · <span class="b b-yel">4일 초과</span>':''}${ds.sessionMismatch?' · <span class="b b-red">세션 불일치</span>':''}${ds.barsNotice?' · <span class="b b-red">봉 누락</span>':''}${ds.apiCalled?` · 사이트 신규 조회 ${ds.apiCalled.fresh}/${ds.apiCalled.total}`:''}${ds.degraded?' · <span class="b b-red">사이트 발행 보류</span>':''}</div>`;
  // 사용자 시트의 시장국면 — QQQ 판정을 덮어쓰지 않고 나란히 (2026-09-07)
  if(ds.siteCondition)h+=`<div class="note" style="margin-bottom:10px">사이트 시장국면(사용자 시트 A1): <span class="b ${/GOOD|BULL|UP/i.test(ds.siteCondition)?'b-grn':/BAD|BEAR|DOWN/i.test(ds.siteCondition)?'b-red':'b-yel'}">${esc(ds.siteCondition)}</span> <span class="reason">— 아래 QQQ 쿨라매기 판정과 별개 기준입니다</span></div>`;
  // ① 차트 → ② 바로 밑 FINRA → ③ 판정 → ④ 주도주 → ⑤ 뉴스  (배치 순서 고정)
  h+=`<div class="card"><h2>QQQ 일봉 · 10/20/50일선 · 최근 3개월</h2>
      ${q.chart_svg||'<div class="empty">차트 없음</div>'}
      ${q.chart_png?`<div class="note">PNG: <a href="${esc(q.chart_png)}" target="_blank">${esc(q.chart_png)}</a></div>`:''}</div>`;
  h+=`<div class="card"><h2>FINRA 고객 마진부채 (Debit Balances) — 전년동기 대비</h2>
      <div class="verdict ${vcls(f.level)}">${esc(f.ko||'—')}</div>`;
  // 절대금액 + free credit — "YoY +38.6%" 한 줄만 있고 원자료가 어디에도 없었다 (감사 3-1 ⑥)
  const fmtM=v=>v==null||!isFinite(Number(v))?'—':Number(v).toLocaleString();
  const fl=f.latest&&typeof f.latest==='object'?f.latest:null,fp=f.prior&&typeof f.prior==='object'?f.prior:null;
  const netOf=s=>s&&s.debit!=null&&s.freeCreditCash!=null&&s.freeCreditMargin!=null?s.debit-s.freeCreditCash-s.freeCreditMargin:null;
  if(fl||fp){
    h+=`<div class="grid g3" style="margin-top:10px">
      <div class="stat"><div class="n">${fmtM(fl&&fl.debit)}</div><div class="l">최신 ${esc((fl&&fl.month)||'')} 마진부채 (M$)</div></div>
      <div class="stat"><div class="n">${fmtM(fp&&fp.debit)}</div><div class="l">전년동월 ${esc((fp&&fp.month)||'')} 마진부채 (M$)</div></div>
      <div class="stat"><div class="n">${f.yoyPct==null?'—':(f.yoyPct>0?'+':'')+n(f.yoyPct,1)+'%'}</div><div class="l">YoY${fl&&fp&&fl.debit!=null&&fp.debit!=null?` · 증감 ${fl.debit-fp.debit>0?'+':''}${fmtM(fl.debit-fp.debit)} M$`:''}</div></div>
      ${fl&&fl.freeCreditCash!=null?`<div class="stat"><div class="n">${fmtM(fl.freeCreditCash)}</div><div class="l">Free Credit 현금계좌 (M$)${fp&&fp.freeCreditCash!=null?` · 전년 ${fmtM(fp.freeCreditCash)}`:''}</div></div>`:''}
      ${fl&&fl.freeCreditMargin!=null?`<div class="stat"><div class="n">${fmtM(fl.freeCreditMargin)}</div><div class="l">Free Credit 마진계좌 (M$)${fp&&fp.freeCreditMargin!=null?` · 전년 ${fmtM(fp.freeCreditMargin)}`:''}</div></div>`:''}
      ${netOf(fl)!=null?`<div class="stat"><div class="n">${fmtM(netOf(fl))}</div><div class="l">순차입 = 마진부채 − Free Credit 합 (M$)${netOf(fp)!=null?` · 전년 ${fmtM(netOf(fp))}`:''}</div></div>`:''}
    </div>`;
  }
  const S13=Array.isArray(f.series13)?f.series13.filter(s=>s&&s.month):[];
  if(S13.length){
    const mx=Math.max(...S13.map(s=>Number(s.debit)||0))||1;
    h+=`<div style="display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px">`+
      S13.map(s=>`<div style="flex:1;text-align:center" title="${esc(s.month)}: ${fmtM(s.debit)}">
        <div style="background:${s===S13[S13.length-1]?'var(--red)':'var(--blu)'};height:${((Number(s.debit)||0)/mx*70).toFixed(0)}px;border-radius:3px 3px 0 0"></div>
        <div style="font-size:9px;color:var(--dim);margin-top:3px">${esc(String(s.month).slice(2))}</div></div>`).join('')+`</div>`;
    const hasFC=S13.some(s=>s.freeCreditCash!=null||s.freeCreditMargin!=null);
    h+=`<div class="scroll" style="margin-top:8px"><table><thead><tr><th class="l">월</th><th>마진부채</th><th>전월비</th>${hasFC?'<th>Free Credit 현금</th><th>Free Credit 마진</th><th>순차입</th>':''}</tr></thead><tbody>`+
      S13.map((s,i)=>{const pv=i>0?S13[i-1].debit:null;const mom=pv&&s.debit!=null?(s.debit/pv-1)*100:null;
        return `<tr><td class="l">${esc(s.month)}</td><td>${fmtM(s.debit)}</td><td>${sgn(mom,1)}</td>${hasFC?`<td>${fmtM(s.freeCreditCash)}</td><td>${fmtM(s.freeCreditMargin)}</td><td>${fmtM(netOf(s))}</td>`:''}</tr>`;}).join('')+
      `</tbody></table></div>`;
    h+=`<div class="note">단위: ${esc(f.unit||'백만 달러 (USD millions)')} · 데이터 ${esc(f.range?f.range.from:'')} ~ ${esc(f.range?f.range.to:'')}${f.months?` (${f.months}개월)`:''} · 출처 <a href="${esc(f.source_url||'#')}" target="_blank">FINRA</a>${f.file_url?` · <a href="${esc(f.file_url)}" target="_blank">원본 xlsx</a>`:''}${f.stale?' · ⚠️캐시':''}${f.fetched_at?` · 수집 ${esc(f.fetched_at)}`:''}</div>`;
  }
  h+=`</div>`;
  h+=`<div class="card"><h2>쿨라매기 판정</h2>
      <div class="verdict ${vcls(q.verdict)}">${esc(q.ko||'—')}</div>
      <div class="grid g3">
        <div class="stat"><div class="n">${n(q.price)}</div><div class="l">QQQ 종가 (${esc(q.lastDate||'')})</div></div>
        <div class="stat"><div class="n">${n(q.ma10)}</div><div class="l">MA10 · 기울기 ${n(q.slope10Pct)}%</div></div>
        <div class="stat"><div class="n">${n(q.ma20)}</div><div class="l">MA20 · 기울기 ${n(q.slope20Pct)}%</div></div>
        <div class="stat"><div class="n">${n(q.ma50)}</div><div class="l">MA50</div></div>
        <div class="stat"><div class="n">${q.daysSinceGoldenCross??'—'}</div><div class="l">골든크로스 경과일 (${esc(q.goldenCrossDate||'—')})</div></div>
        <div class="stat"><div class="n">${q.daysSinceDeathCross??'—'}</div><div class="l">데드크로스 경과일 (${esc(q.deathCrossDate||'—')})</div></div>
      </div>
      ${q.index_dip&&(q.index_dip.ko||q.index_dip.status)?`<div class="verdict ${q.index_dip.status==='normal'?'v-normal':q.index_dip.status==='dip'||q.index_dip.status==='warn'?'v-warn':q.index_dip.status==='extended'||q.index_dip.status==='danger'?'v-danger':''}" style="margin-top:10px">지수 눌림목 판정: ${esc(q.index_dip.ko||q.index_dip.status)}${q.index_dip.div200!=null?` · QQQ 200DIV ${n(q.index_dip.div200,2)}%`:''}${q.index_dip.status&&q.index_dip.ko?` <span class="b b-dim">${esc(q.index_dip.status)}</span>`:''}</div>`:''}
      ${q.actions?`<div class="note">대응: ${q.actions.map(esc).join(' · ')}</div>`:''}</div>`;
  const ls=(t.leaders&&t.leaders.stocks)||[];
  const oh=(t.leaders&&t.leaders.market_overheat)||{};
  h+=`<div class="card"><h2>주도주 TOP ${ls.length} · 200일선 이격도</h2>`+
    table([
      {h:'종목',l:1,f:r=>`<span class="tk" data-t="${esc(r.ticker)}">${esc(r.ticker)}</span>`,s:r=>r.ticker},
      {h:'섹터',l:1,f:r=>esc(r.sector),s:r=>r.sector},
      {h:'업종',l:1,f:r=>esc(r.industry),s:r=>r.industry},
      {h:'상위%',f:r=>tp(r.bestPct),s:r=>r.bestPct},
      {h:'현재가',f:r=>money(r.price),s:r=>r.price},
      {h:'200DIV',f:r=>n(r.div200,1),s:r=>r.div200},
      {h:'50DIV',f:r=>n(r.div50,1),s:r=>r.div50},
      {h:'임계',f:r=>(r.overheat||{}).threshold??'—',s:r=>(r.overheat||{}).threshold},
      {h:'상태',l:1,f:r=>{const o=r.overheat||{};return `<span class="b ${o.status==='overheat'?'b-red':o.status==='reentry'||o.status==='extreme'?'b-grn':'b-dim'}">${esc(o.label||'—')}</span>`;},s:r=>(r.overheat||{}).status},
      {h:'ADR',f:r=>n(r.adr,1),s:r=>r.adr},
      {h:'52주',f:r=>n(r.high52,1),s:r=>r.high52},
    ],ls)+
    `<div class="note">${esc(oh.ko||'')}${oh.count!=null?` · 집계 ${oh.count}종목`:''}${oh.median!=null?` · 200DIV 중앙값 ${n(oh.median,2)}%`:''}${oh.max!=null?` · 최대 ${n(oh.max,2)}%`:''}${oh.reentry!=null?` · 재진입권(200DIV −20% 이하) ${oh.reentry}종목`:''}</div></div>`;
  const secs=(t.leaders&&t.leaders.sectors)||[];
  h+=`<div class="card"><h2>주도 섹터 (상위 50종목 쏠림)</h2><div class="chips">`+
    secs.map(s=>`<span class="chip"><b>${esc(s.name)}</b> ${s.count}종목 (${s.sharePct}%)</span>`).join('')+
    `</div><div class="note">${secs.map(s=>esc(s.name)+': '+s.tickers.slice(0,6).map(esc).join(', ')).join(' | ')}</div></div>`;
  const nw=t.news||{};
  h+=`<div class="card"><h2>시장 뉴스</h2>`;
  // marketNarrative · keyRisks · easySummary — 매일 생성·검증되는데 어디에도 표시되지 않던 필드 (감사 3-2)
  if(nw.marketNarrative)h+=`<div class="lead" style="border-left:3px solid var(--blu);padding-left:10px">${esc(nw.marketNarrative)}</div>`;
  h+=(nw.llm&&nw.digest&&nw.digest.length
      // ⚠️ 예전엔 스키마에 없는 필드(oneLine)를 그려서 제목만 나오고 설명이 통째로 비어 있었다.
      //    한별이 쓰는 easy(쉬운 설명)·whyMatters(내 종목엔?)가 매일 생성되는데 화면에 없었다.
      ? nw.digest.map(d=>`<div style="margin-bottom:14px"><b>${esc(d.headline)}</b>${d.impact?` <span class="b ${d.impact==='up'?'b-grn':d.impact==='down'?'b-red':'b-dim'}">${esc(d.impact)}</span>`:''}
          ${d.easy?`<div class="note" style="margin-top:5px">${esc(d.easy)}</div>`:''}
          ${d.whyMatters?`<div class="note" style="margin-top:5px"><b>내 종목엔?</b> ${esc(d.whyMatters)}</div>`:''}
          <div style="margin-top:5px">${(d.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" title="${esc(s.title||'')}">${esc(s.publisher||s.title)}${s.date?` ${esc(String(s.date).slice(0,10))}`:''} ↗</a>`).join(' · ')}</div></div>`).join('')
      : `<div class="pending">${esc(nw.note||'LLM 뉴스 미실행')}</div>`);
  const kr=Array.isArray(nw.keyRisks)?nw.keyRisks.filter(Boolean):[];
  if(kr.length)h+=`<div style="margin-top:10px"><b style="color:var(--yel);font-size:12.5px">핵심 리스크 ${kr.length}건</b><ul class="rlist">${kr.map(x=>`<li>${esc(typeof x==='string'?x:(x.ko||x.text||JSON.stringify(x)))}</li>`).join('')}</ul></div>`;
  const ez=Array.isArray(nw.easySummary)?nw.easySummary.filter(Boolean):[];
  if(ez.length)h+=`<div style="margin-top:8px"><b style="color:var(--dim);font-size:12.5px">요약</b><ul class="rlist">${ez.map(x=>`<li>${esc(typeof x==='string'?x:(x.ko||x.text||JSON.stringify(x)))}</li>`).join('')}</ul></div>`;
  const nv=nw.verified;
  if(nv&&typeof nv==='object')h+=`<div class="note">출처 검증: 검사 ${nv.checked??'—'} · 생존 ${nv.ok??'—'} · 미검증 ${nv.unverified??'—'} · 죽은 링크 ${nv.dead??'—'} · 근거없음 강등 ${nv.stripped??'—'}${nw.candidateCount!=null?` · 후보 기사 ${nw.candidateCount}건`:''}</div>`;
  h+=`</div>`;
  $('p-t1').innerHTML=h;bindTk();
}

/* 시총 문자열("55.09B", "812M") → 정렬용 숫자. 파싱 실패는 null */
function mcNum(s){
  if(s==null)return null;
  if(typeof s==='number')return s;
  const m=/^\s*\$?([\d.,]+)\s*([KMBT])?/i.exec(String(s)); if(!m)return null;
  const v=parseFloat(m[1].replace(/,/g,'')); if(!isFinite(v))return null;
  return v*({K:1e3,M:1e6,B:1e9,T:1e12}[(m[2]||'').toUpperCase()]||1);
}

/* 2팀 리서치 상태 옆 메타 — 이월(carried) · 조사일이 실행일과 다를 때 (감사 2 · TTL 이월) */
function researchMeta(r,base){
  if(!r||typeof r!=='object')return '';
  let s='';
  if(r.carried===true)s+=' <span class="b b-yel" title="TTL 안이라 직전 조사 결과를 그대로 이월">이월</span>';
  const a=asOfBadge(r.researchedOn,base);
  if(a)s+=' '+a;
  return s;
}

/* 기간별(1M·3M·6M) 상위 2% 테마 3세트 + 교차 — Node 확정 (2026-09-07) */
const CROSS_KO={persistent:['지속','b-pur','1M·3M·6M 모두 상위 2%'],newEntrants:['신규','b-grn','1M 만 상위 2% (이번 달 진입)'],midTerm:['중기','b-yel','3M 기준 (1M 은 아님)'],fading:['퇴조','b-dim','6M 만 상위 2%']};
function crossIndex(cr){
  const m=new Map();
  if(cr&&typeof cr==='object')for(const k of Object.keys(CROSS_KO))for(const t of (cr[k]||[]))m.set(t,k);
  return t=>m.get(t)||null;
}
function crossBadge(k,r){
  if(!k)return '';
  const [lab,cls,tip]=CROSS_KO[k];
  const key={persistent:'m6',newEntrants:'m1',midTerm:'m3',fading:'m6'}[k];
  const st=r&&r.top2Streak&&r.top2Streak[key],since=r&&r.top2Since&&r.top2Since[key];
  return ` <span class="b ${cls}" title="${esc(tip)}${since?` · 진입 ${esc(since)}`:''}">${lab}${st?` D+${st}`:''}</span>`;
}
function periodThemeCard(th){
  const BP=th&&th.byPeriod,CR=th&&th.cross,CD=(th&&th.crossDetail)||{};
  if(!BP||!CR)return '';
  const lab={m1:'1개월',m3:'3개월',m6:'6개월'};
  let h=`<div class="card"><h2>기간별 상위 2% 테마 — 어느 기간의 강세인가</h2>
    <div class="note" style="margin-bottom:8px">한 종목이 여러 기간에 동시에 들어갈 수 있어 기간별 합은 전체보다 큽니다. 비중의 분모는 그 기간의 종목 수입니다.</div>`;
  for(const k of ['m1','m3','m6']){
    const b=BP[k]||{};
    h+=`<div style="margin-bottom:8px"><span class="b b-pur">${lab[k]}</span> <b>${b.count??0}종목</b> — ${esc(b.headline||'')}
      <div class="chips" style="margin-top:4px">${(b.clusters||[]).slice(0,8).map(c=>`<span class="chip" title="${esc((c.tickers||[]).join(', '))}"><b>${esc(c.name)}</b> ${c.count} (${c.sharePct}%)</span>`).join('')}</div>
      ${(b.topSectors||[]).length?`<div class="note">섹터 ${b.topSectors.map(s=>`${esc(s.name)} ${s.count}(${s.sharePct}%)`).join(' · ')} · 업종 ${(b.topIndustries||[]).map(s=>`${esc(s.name)} ${s.count}(${s.sharePct}%)`).join(' · ')}</div>`:''}</div>`;
  }
  const C=CR.counts||{};
  const dN=(list,key)=>(list||[]).map(x=>{const st=x.streak&&x.streak[key];return `<span class="tk" data-t="${esc(x.ticker)}">${esc(x.ticker)}</span>${st?`<span class="reason">(D+${st})</span>`:''}`;}).join(' · ');
  const plain=(list)=>(list||[]).map(t=>`<span class="tk" data-t="${esc(t)}">${esc(t)}</span>`).join(' · ');
  h+=`<div style="border-top:1px solid var(--bd);padding-top:8px"><b>교차</b> <span class="reason">전체 ${C.total??'—'} = 지속 ${C.persistent??0} + 신규 ${C.newEntrants??0} + 중기 ${C.midTerm??0} + 퇴조 ${C.fading??0} + 기타 ${C.other??0}</span>`;
  for(const k of Object.keys(CROSS_KO)){
    const [lab2,cls,tip]=CROSS_KO[k];const key={persistent:'m6',newEntrants:'m1',midTerm:'m3',fading:'m6'}[k];
    h+=`<div style="margin-top:5px"><span class="b ${cls}" title="${esc(tip)}">${lab2}</span> ${CD[k]?dN(CD[k],key):plain(CR[k])||'—'}</div>`;
  }
  for(const [key,list] of Object.entries(CR.other||{}))h+=`<div style="margin-top:5px"><span class="b b-dim">${esc(key)}</span> ${plain(list)}</div>`;
  h+=`<div class="note" style="margin-top:6px">D+N = 그 기간 상위 2%에 연속 포함된 거래일 수(스냅샷 존재 평일 기준)${CD.asOf?` · 기준일 ${esc(CD.asOf)}`:''}</div></div></div>`;
  return h;
}

/* 2팀 테마 해석(LLM) — leadingTheme/subThemes/crossCuttingDriver/caution 은 index.html 에만 있었다 (감사 3-2) */
function themeLlmCard(L){
  if(!L||typeof L!=='object')return '';
  const STR={strong:['강함','b-grn'],mid:['보통','b-yel'],weak:['약함','b-dim'],none:['없음','b-dim']};
  const one=(x,lead)=>{
    if(!x||!x.name)return '';
    const st=STR[x.strength]||(x.strength?[x.strength,'b-dim']:null);
    return `<div style="margin-bottom:12px;padding:10px 12px;border-radius:8px;background:var(--panel2);border-left:3px solid ${lead?'var(--pur)':'var(--bd)'}">
      <div><span class="b ${lead?'b-pur':'b-dim'}">${lead?'주도 테마':'보조 테마'}</span> <b style="font-size:14px">${esc(x.name)}</b>${st?` <span class="b ${st[1]}">${esc(st[0])}</span>`:''}</div>
      ${(x.tickers||[]).length?`<div style="margin:6px 0">${x.tickers.map(k=>`<span class="tk" data-t="${esc(k)}">${esc(k)}</span>`).join(' · ')} <span class="reason">(${x.tickers.length}종목)</span></div>`:''}
      ${x.why?paras(x.why):''}${x.plainKo?`<div class="note">${esc(x.plainKo)}</div>`:''}</div>`;
  };
  let h=`<div class="card"><h2>테마 해석 (LLM)</h2>`;
  if(!L.leadingTheme||L.leadingTheme.strength==='none')h+=`<div class="pending">오늘은 공통 테마가 없습니다 — 억지로 묶지 않습니다.</div>`;
  else h+=one(L.leadingTheme,true);
  for(const s of (Array.isArray(L.subThemes)?L.subThemes:[]))h+=one(s,false);
  if(L.crossCuttingDriver)h+=`<div style="margin-top:4px"><b style="font-size:12px;color:var(--dim)">테마를 가로지르는 공통 동인</b>${paras(L.crossCuttingDriver)}</div>`;
  // 기간별 주도 테마 + 로테이션 (2026-09-07)
  if(L.byPeriod&&typeof L.byPeriod==='object'){
    const lab={m1:'1개월',m3:'3개월',m6:'6개월'};
    h+=`<div style="margin-top:8px"><b style="font-size:12px;color:var(--dim)">기간별 주도 테마 (해당 기간 상위 2% 안에서)</b>`;
    for(const k of ['m1','m3','m6']){const b=L.byPeriod[k];if(!b)continue;
      const st=STR[b.strength]||(b.strength?[b.strength,'b-dim']:null);
      h+=`<div style="margin-top:4px"><span class="b b-pur">${lab[k]}</span> <b>${esc(b.name||'')}</b>${st?` <span class="b ${st[1]}">${esc(st[0])}</span>`:''}${(b.tickers||[]).length?` — ${b.tickers.map(k2=>`<span class="tk" data-t="${esc(k2)}">${esc(k2)}</span>`).join(' · ')}`:''}${b.plainKo?`<div class="note">${esc(b.plainKo)}</div>`:''}</div>`;}
    h+=`</div>`;
  }
  if(L.rotation&&typeof L.rotation==='object'){
    const r=L.rotation;
    h+=`<div style="margin-top:8px"><b style="font-size:12px;color:var(--dim)">로테이션 — 지속 · 신규 · 퇴조</b>
      <div class="note">지속 ${(r.persistent||[]).map(esc).join(', ')||'—'} · 신규(1M) ${(r.newEntrants||[]).map(esc).join(', ')||'—'} · 퇴조(6M만) ${(r.fading||[]).map(esc).join(', ')||'—'}</div>
      ${r.narrative?paras(r.narrative):''}</div>`;
  }
  if(L.sanitized&&Array.isArray(L.sanitized.removed)&&L.sanitized.removed.length)h+=`<div class="note">정제: Node 목록에 없어 제거한 티커 ${L.sanitized.removed.length}개 (${L.sanitized.removed.slice(0,8).map(esc).join(', ')})</div>`;
  if(L.caution)h+=`<div class="verdict v-warn" style="margin-top:8px">${paras(L.caution)}</div>`;
  return h+`</div>`;
}

    ],B):'<div class="empty">오늘 전고점 돌파 종목 없음</div>')+
    `<div class="note">거래량 확인 기준: VOL_X ≥ 2.0 (거래대금 20일평균 대비) <b>또는</b> 주간배수 ≥ 2.0 (거래량, 당일제외 5일평균 대비). 서로 다른 지표입니다.
    · <b>돌파봉 VOL</b> = 돌파 당일 봉 거래량 ÷ 직전 20일 평균 (VOL_X·주간배수는 마지막 봉 기준이라 돌파일이 오늘이 아니면 돌파봉과 다릅니다 — 감사 1-4). 5일평균비 = 마지막 봉 거래량 ÷ 직전 5일 평균.</div></div>`;
  const items=(t.items||[]).slice().sort((a,b)=>{const o={active:0,dormant:1,excluded:2};return (o[a.status]-o[b.status])||String(a.ticker).localeCompare(b.ticker);});
  h+=`<div class="card"><h2>추적 종목 전체 ${items.length}개</h2>`+
    table([
      {h:'종목',l:1,f:r=>`<span class="tk" data-t="${esc(r.ticker)}">${esc(r.ticker)}</span>`,s:r=>r.ticker},
      {h:'상태',l:1,f:r=>`<span class="b ${r.status==='active'?'b-grn':r.status==='dormant'?'b-yel':'b-red'}">${r.status==='active'?'활성':r.status==='dormant'?'휴면':'배제'}</span>${r.manualHold?' <span class="b b-pur">수동</span>':''}${r.reentryBlocked?` <span class="b b-yel" title="${esc(reentryKo(r.reentryBlocked))}">재편입 차단</span>`:''}`,s:r=>r.status},
      {h:'편입일',l:1,f:r=>esc(r.added),s:r=>r.added},
      {h:'최근선정',l:1,f:r=>esc(r.lastPicked||'—'),s:r=>r.lastPicked},
      {h:'선정횟수',f:r=>r.pickCount??'—',s:r=>r.pickCount},
      {h:'현재가',f:r=>r.live?money(r.live.price):'—',s:r=>r.live&&r.live.price},
      {h:'고점',f:r=>money(r.peak),s:r=>r.peak},
      {h:'고점일',l:1,f:r=>esc(r.peakDate||'—'),s:r=>r.peakDate},
      {h:'고점대비%',f:r=>r.drawdownPct==null?'—':`<span class="b ${r.drawdownPct<-20?'b-red':'b-dim'}">${n(r.drawdownPct,1)}</span>`,s:r=>r.drawdownPct},
      {h:'50MA이탈일',f:r=>r.live?r.live.belowMa50Days:'—',s:r=>r.live&&r.live.belowMa50Days},
      {h:'eye',f:r=>r.live?r.live.eyeScore:'—',s:r=>r.live&&r.live.eyeScore},
      {h:'배제일',l:1,f:r=>esc(r.excludedAt||'—'),s:r=>r.excludedAt},
      {h:'사유/근거',l:1,f:r=>`<span class="reason">${esc(r.excludedReason||r.addedReason||'')}</span>${r.reentryBlocked?` <span class="reason" style="color:var(--yel)">· 재편입 차단 ${esc(reentryKo(r.reentryBlocked))}</span>`:''}`,s:r=>r.excludedReason||''},
    ],items)+`<div class="note">"재편입 차단" = 2팀이 다시 선정했지만 배제 사유(50일선 이탈·고점 −40%·150일선 아래)가 그대로라 복귀시키지 않은 종목. 툴팁에 차단일과 사유.</div></div>`;
  $('p-t3').innerHTML=h;bindTk();
}
/* reentryBlocked 는 {date,reason} 객체가 정상이지만 true/문자열로 올 수도 있다 */
function reentryKo(x){
  if(!x)return '';
  if(typeof x==='string')return x;
  if(typeof x!=='object')return '';
  return [x.date,x.reason].filter(Boolean).map(String).join(' · ');
}

/* ── 4팀 ── */
/* 호재성 뉴스 6분류 */
const CAT6=[[1,'어닝 서프라이즈 · 가이던스 상향','★'],[2,'바이오 · FDA · 임상',''],
  [3,'대형 파트너십 · 공급계약',''],[4,'기업 턴어라운드',''],
  [5,'매크로 · 정책 · 산업 돌파(AI/양자/로봇)','★'],[6,'암묵적 — 뉴스 없는 이상거래량','']];

/* 근거 목록 — 출처(발행처·날짜) + 원문 인용문.
   ⚠️ quote 는 수집·검증까지 하고 화면엔 한 번도 안 나오던 항목이다.
      "근거를 봤다"는 말을 사용자가 확인할 방법이 있어야 한다. */
function rClaims(claims,noQuote){
  const L=(claims||[]).filter(c=>c.evidence_level==='sourced'&&(c.sources||[]).length);
  if(!L.length)return '';
  return '<ul class="rlist">'+L.map(c=>{
    const src=(c.sources||[]).slice(0,4).map(s=>{
      const d=s.date?' '+esc(String(s.date).slice(0,10)):'';
      return `<a class="rsrc" href="${esc(s.url)}" target="_blank" title="${esc(s.title||'')}">[${esc(s.publisher||'출처')}${d}]</a>`;
    }).join('');
    const q=noQuote?null:(c.sources||[]).map(s=>s&&s.quote).find(x=>x&&String(x).trim().length>8);
    return `<li>${esc(c.statement)}${src}${q?`<span class="rq">${esc(String(q).trim())}</span>`:''}</li>`;
  }).join('')+'</ul>';
}

/* 5팀 업종 강세 사유 카드.
   ⚠️ 예전엔 5팀 탭과 업종 팝업 둘 다 "LLM 대기" 하드코딩이라, 조사한 6개 업종이
      대시보드 어디에도 안 나왔다. risk(꺾이는 조건)는 특히 실행에 직결되는 항목이다. */
/* driver·durability enum → 한글. 매핑에 없는 값은 원문 그대로 (지어내지 않는다) */
const DRV_KO={earnings:'실적',policy:'정책',macro:'거시',technology:'기술 수요',
  commodity:'원자재 가격',rotation:'순환매',structural:'구조적',cyclical:'경기순환',event:'이벤트',unknown:'불명'};
const DUR_KO={structural:'구조적',cyclical:'경기순환',short_term:'단기',event:'이벤트',earnings:'실적',
  commodity:'원자재 가격',technology:'기술 수요',policy:'정책',unknown:'불명'};
const FC_KO={pass:['통과','b-grn'],partial:['일부 제거','b-yel'],fail:['탈락','b-red'],unchecked:['미대조','b-dim']};
/* 팩트체크 배지 — verdict 와 제거된 claim id 목록 */
function factcheckBadge(fc){
  if(!fc||typeof fc!=='object'||!fc.verdict)return '';
  const [ko,cls]=FC_KO[fc.verdict]||[fc.verdict,'b-dim'];
  const rm=Array.isArray(fc.removed)?fc.removed.filter(Boolean):[];
  return `<span class="b ${cls}" title="${esc(fc.reason||'')}">팩트체크 ${esc(ko)}${rm.length?` · 제거 ${rm.length}`:''}</span>`;
}
function factcheckNote(fc){
  if(!fc||typeof fc!=='object')return '';
  const rm=Array.isArray(fc.removed)?fc.removed.filter(Boolean):[];
  if(!rm.length&&!fc.reason)return '';
  return `<div class="note">팩트체크${fc.verdict?` ${esc((FC_KO[fc.verdict]||[fc.verdict])[0])}`:''}${rm.length?` · 제거된 주장: ${rm.map(x=>esc(typeof x==='string'?x:(x.id||x.statement||JSON.stringify(x)))).join(', ')}`:''}${fc.reason?`<br>${esc(fc.reason)}`:''}</div>`;
}
function indCards(list,one){
  if(!list||!list.length)
    return `<div class="card"><h2>강세 사유</h2><div class="pending">
      아직 조사하지 않았습니다 — <code>start breakout</code> 실행 시 공신력 있는 언론·증권사 리포트 근거로 채웁니다.
      근거가 없으면 '근거 없음'으로 표기하며 지어내지 않습니다.</div></div>`;
  const base=(D.t5&&D.t5.generated)||runDate();
  return list.map(x=>{
    let b=`<div class="card"><h2>${esc(window.indKo?window.indKo(x.industry):x.industry)}</h2>
      <div><span class="b b-dim" title="driver">${esc(DRV_KO[x.driver]||x.driver||'')}</span>
      <span class="b b-dim" title="durability">${esc(DUR_KO[x.durability]||x.durability||'')}</span>
      ${x.carried===true?' <span class="b b-yel" title="TTL 안이라 직전 조사 결과를 이월">이월</span>':''} ${asOfBadge(x.researchedOn,base)} ${factcheckBadge(x.factcheck)}</div>`;
    if(x.lead)b+=`<div class="lead">${esc(x.lead)}</div>`;
    b+=rClaims(x.whyStrong)||`<div class="pending">검증을 통과한 근거가 없습니다</div>`;
    if((x.keyStocks||[]).length)b+=`<div class="note"><b>대표 종목:</b> ${x.keyStocks.map(s=>`<span class="tk" data-t="${esc(s)}">${esc(s)}</span>`).join(' · ')}</div>`;
    if(x.risk)b+=`<div class="note" style="color:var(--yel)"><b>꺾이는 조건</b></div><div class="note">${esc(x.risk)}</div>`;
    b+=factcheckNote(x.factcheck);
    return b+'</div>';
  }).join('')+(one?'':'');
}

/* 5팀 섹터 종합(LLM) — rotationView/strongest/emerging/fading/caution 은 어디에도 표시되지 않았다 (감사 3-2) */
function t5SummaryCard(S){
  if(!S||typeof S!=='object')return '';
  const li=(arr)=>Array.isArray(arr)?arr.filter(Boolean).map(x=>`<li>${esc(typeof x==='string'?x:[x.industry,x.why].filter(Boolean).join(' — ')||JSON.stringify(x))}</li>`).join(''):'';
  let h=`<div class="card"><h2>섹터 순환 종합 (LLM)</h2>`;
  if(S.rotationView)h+=`<div style="margin-bottom:8px"><b style="font-size:12px;color:var(--dim)">순환 시각</b>${paras(S.rotationView)}</div>`;
  const st=S.strongest;
  if(st&&(typeof st==='string'||st.industry||st.why))
    h+=`<div style="margin-bottom:8px;padding:9px 12px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--grn)"><b style="font-size:12px;color:var(--grn)">가장 강한 업종</b>
      ${typeof st==='string'?paras(st):`<div><b>${esc(st.industry||'')}</b></div>${st.why?paras(st.why):''}`}</div>`;
  const em=li(S.emerging),fd=li(S.fading);
  if(em)h+=`<div style="margin-bottom:6px"><b style="font-size:12px;color:var(--blu)">부상 중</b><ul class="rlist">${em}</ul></div>`;
  if(fd)h+=`<div style="margin-bottom:6px"><b style="font-size:12px;color:var(--red)">퇴조 중</b><ul class="rlist">${fd}</ul></div>`;
  if(S.caution)h+=`<div class="verdict v-warn" style="margin-top:6px">${paras(S.caution)}</div>`;
  return h+`</div>`;
}

/* 2팀 리서치 상태 배지.
   ⚠️ 예전엔 이 열이 `⏳대기` 하드코딩이라 조사를 끝낸 종목도 대기로 보였다.
      4팀 촉매 열에서 같은 버그를 고쳐놓고 2팀은 남아 있었다.
      '실패'(에이전트 오류)와 '대기'(상한 밖)를 구분해서 보여준다. */
function researchBadge(r){
  if(!r)return '<span class="b b-dim">미조사</span>';
  if(r.status==='done')     return '<span class="b b-grn" title="근거 있는 상승 이유 확보">✅조사완료</span>';
  if(r.status==='no_source')return '<span class="b b-yel" title="조사했으나 검증 통과한 출처가 없음">❌근거없음</span>';
  if(r.status==='failed')   return `<span class="b b-red" title="${esc(r.note||'')}">⚠️실패</span>`;
  return `<span class="b b-dim" title="${esc(r.note||'')}">⏳대기</span>`;
}

function catBadge(c){
  if(!c||c.status!=='done') return '<span class="b b-dim">미조사</span>';
  const n2=Number(c.category)||6;
  const star=(n2===1||n2===5)?' ★':'';
  const nm=(CAT6.find(x=>x[0]===n2)||[0,'분류 '+n2])[1];
  return `<span class="b ${n2===6?'b-yel':'b-grn'}" title="${esc(nm)}">${'①②③④⑤⑥'[n2-1]||n2}${star}</span>`;
}

/* 재사용 배지 — 이 데이터가 오늘 새로 조사한 게 아니면 반드시 밝힌다 */
function reuseBadge(src){
  if(!src)return '';
  return `<div class="note" style="margin-bottom:10px"><span class="b b-yel">재사용</span>
    이 팀의 조사 내용은 <b>${esc(src)}</b> 실행분을 그대로 다시 쓴 것입니다 —
    시장이 열리지 않아 주가 데이터가 그날과 완전히 같기 때문입니다. 오늘 새로 조사한 것이 아닙니다.</div>`;
}

function cat6Card(t){
  const hl=(t.llm&&t.llm.highlights)||[];
  const bc=t.byCategory||null;
  const done=(t.items||[]).filter(i=>i.catalyst&&i.catalyst.status==='done');
  let h=`<div class="card"><h2>호재성 뉴스 6분류</h2>`;
  if(!done.length){
    h+=`<div class="pending">`+CAT6.map(([n2,nm,st])=>`${'①②③④⑤⑥'[n2-1]} ${nm}${st?' '+st:''}`).join(' · ')+
      `<br><br>LLM 촉매 분류 대기 — <code>start breakout</code> 실행 시 채워집니다.
      뉴스를 못 찾으면 ⑥으로 분류하고 '근거 없음'으로 표기합니다.</div></div>`;
    return h;
  }
  h+=`<div class="chips" style="margin-bottom:10px">`+CAT6.map(([n2,nm,st])=>{
    const cnt=bc?(bc[n2]||0):done.filter(i=>Number(i.catalyst.category)===n2).length;
    return `<span class="chip ${cnt?'':'dim'}"><b>${'①②③④⑤⑥'[n2-1]}</b> ${esc(nm)}${st?' ★':''} — <b>${cnt}</b>건</span>`;
  }).join('')+`</div>`;
  // ★ 강조 분류(①어닝 서프라이즈 · ⑤산업 돌파)를 먼저
  const star=done.filter(i=>[1,5].includes(Number(i.catalyst.category)));
  const rest=done.filter(i=>![1,5].includes(Number(i.catalyst.category)));
  const line=(i)=>{
    const c=i.catalyst, one=(hl.find(x=>x.ticker===i.ticker)||{}).oneLine||c.volumeExplanation||'';
    return `<div style="margin-bottom:9px">${catBadge(c)}
      <span class="tk" data-t="${esc(i.ticker)}"><b>${esc(i.ticker)}</b></span>
      <span class="b b-dim">거래대금 ${n(i.volx,1)}배 · 주간 ${n(i.volSurgeWk,1)}배</span>
      ${c.carried===true?'<span class="b b-yel" title="TTL 안이라 직전 조사 결과를 이월">이월</span>':''} ${asOfBadge(c.researchedOn,t.generated)} ${factcheckBadge(c.factcheck)}
      ${c.confidence?`<span class="b b-dim">근거 ${esc({high:'충분',medium:'보통',low:'약함'}[c.confidence]||c.confidence)}</span>`:''}
      <div class="note">${esc(String(one).slice(0,300))}</div></div>`;
  };
  if(star.length)h+=`<div style="margin-bottom:12px"><b style="color:var(--grn);font-size:13px">★ 쿨라매기가 가장 선호하는 촉매 (①어닝 서프라이즈 · ⑤산업 돌파) — ${star.length}건</b>
    <div style="margin-top:7px">`+star.map(line).join('')+`</div></div>`;
  if(rest.length)h+=`<div><b style="color:var(--dim);font-size:12.5px">그 외 ${rest.length}건</b>
    <div style="margin-top:7px">`+rest.map(line).join('')+`</div></div>`;
  h+=`<div class="note">뉴스를 못 찾은 종목은 지어내지 않고 ⑥(근거 없음)으로 둡니다.</div></div>`;
  return h;
}

/* 4팀 촉매 종합(LLM) — sectorSignal / watchList / caution 은 매일 생성되는데 어디에도 표시되지 않았다 (감사 3-2) */
function t4LlmCard(L){
  if(!L||typeof L!=='object')return '';
  const wl=Array.isArray(L.watchList)?L.watchList.filter(Boolean):[];
  if(!L.sectorSignal&&!wl.length&&!L.caution)return '';
  let h=`<div class="card"><h2>촉매 종합 (LLM)</h2>`;
  if(L.sectorSignal)h+=`<div style="margin-bottom:8px"><b style="font-size:12px;color:var(--dim)">섹터 신호</b>${paras(L.sectorSignal)}</div>`;
  if(wl.length)h+=`<div style="margin-bottom:8px"><b style="font-size:12px;color:var(--dim)">관찰 목록 ${wl.length}종목</b><div class="chips" style="margin-top:5px">${wl.map(x=>{
      const tk=typeof x==='string'?x:(x.ticker||''); const why=typeof x==='object'?(x.why||x.reason||''):'';
      return `<span class="chip"><span class="tk" data-t="${esc(tk)}">${esc(tk)}</span>${why?` <span class="reason">${esc(why)}</span>`:''}</span>`;}).join('')}</div></div>`;
  if(L.caution)h+=`<div class="verdict v-warn">${paras(L.caution)}</div>`;
  return h+`</div>`;
}

const PHASE_KO={none:'해당 없음',base:'베이스 형성',breakout:'돌파',retest:'리테스트',bounce_trigger:'매수 트리거',
  extended:'과확장',failed:'돌파 실패',unknown:'판정불가 (봉 부족)'};

function renderT4(){
  const t=D.t4; if(!t){$('p-t4').innerHTML='<div class="empty">4팀 데이터 없음</div>';return;}
  const rc=t.research_coverage||{},fl=t.filter||{};
  const inel=rc.ineligible;
  const inelN=Array.isArray(inel)?inel.length:(typeof inel==='number'?inel:(inel&&typeof inel==='object'&&inel.count!=null?inel.count:null));
  const exMC=Array.isArray(t.excludedNoMarketCap)?t.excludedNoMarketCap.filter(Boolean):[];
  let h=reuseBadge(t.reusedFrom)+`<div class="card"><h2>Episodic Pivot 후보</h2>
    <div class="funnel"><span>거래량 급증 <b>${t.universeHits??'—'}</b>종목</span><span class="arrow">→</span>
      <span>국면 분석 <b>${t.analyzed??'—'}</b>개${t.analyzed<t.universeHits?` <span class="b b-yel">${t.universeHits-t.analyzed}개 제외</span>`:''}</span>

/* 퍼센트 표기 — 값이 없으면 '—' 만. '—%' 로 나오면 데이터가 있는 것처럼 보인다 */
const pc=(v,d)=>v==null||!isFinite(v)?'—':n(v,d==null?1:d)+'%';

  neutral:['— 중립','뚜렷한 방향이 없습니다']};

function flowRow(r){
  const site=(r.siteF10!=null)?`${n(r.siteF10,1)}%`:'—';
  const mine=(r.f10!=null)?`${n(r.f10,1)}%`:'—';

function flowCards(t){
  const F=t.flow;
  if(!F)return `<div class="card"><h2>자금 흐름</h2><div class="pending">
    과거 스냅샷이 부족해 판정하지 못했습니다 — <code>node scripts/backfill-history.js</code> 를 먼저 실행하세요.</div></div>`;
  const rows=F.industries||[];
  const head=`<thead><tr><th class="l">업종</th><th>순위(25일 변동)</th><th>오른 종목</th>
    <th>1년 평균 대비(변화)</th><th>두 달 평균 대비</th><th>국면</th><th>업종 강도 10거래일</th></tr></thead>`;
  const sec=(k,title,why)=>{
    const list=rows.filter(r=>r.flow===k);
    if(!list.length)return '';
    const ord=k==='outflow'?(a,b)=>(a.d200Delta??0)-(b.d200Delta??0):(a,b)=>(b.frank25??-999)-(a.frank25??-999);
    return `<div class="card"><h2>${title} — ${list.length}개 업종</h2>
      <div class="note" style="margin-bottom:8px">${why}</div>
      <div class="scroll"><table>${head}<tbody>${list.sort(ord).slice(0,12).map(flowRow).join('')}</tbody></table></div>
      ${list.length>12?`<div class="note">상위 12개만 표시 (전체 ${list.length}개)</div>`:''}</div>`;
  };
  let h=`<div class="card"><h2>💰 돈이 어디로 가고 있나</h2>
    <div class="note">${esc(F.note)}</div>
    <div class="funnel" style="margin-top:9px">
      <span>기준일 오늘 <b>${esc(F.baseline.today)}</b></span>
      <span>10거래일 전 <b>${esc(F.baseline.d10)}</b></span>
      <span>25거래일 전 <b>${esc(F.baseline.d25)}</b></span>
      <span class="b b-yel">사이트와 부호 다른 업종 ${F.siteMismatch}개</span>
    </div>
    <div class="note" style="margin-top:8px">업종 강도 변화율(%)은 나누는 값이 0에 가까우면 숫자가 커집니다 —
    <b>크기보다 순위 변동으로</b> 읽으세요. 업종명을 누르면 소속 종목이 나옵니다.</div></div>`;
  h+=sec('leading','🟢 본격 주도 섹터','돈이 넓게 들어오고 실적 기대도 함께 오르는 곳입니다.');
  h+=sec('inflow','📈 자금 유입 중','돈이 들어오고 있습니다.');
  h+=sec('narrow','⚠️ 소수 종목만 오르는 곳','업종 전체가 아니라 일부만 오릅니다 — 업종이 아니라 종목으로 보세요.');
  h+=sec('pending','⭐ 아직 안 온 곳 (다음 후보)','가격은 아직인데 실적 전망이 오르는 곳입니다. 지금 사는 자리는 아니고 관찰 리스트입니다.');
  h+=sec('outflow','📉 돈이 빠지는 곳','1년 평균과의 격차가 좁혀지는 중입니다. 보유 중이면 손절선을 앞당기세요.');
  return h;
}

/* ── 시계열 동적 로드 (file:// 에서 fetch 가 막히므로 <script> 주입) ── */
const _loaded={};
function loadSeries(kind,key,cb){
  const store=kind==='t'?'SERIES':'ISERIES';
  if(window[store]&&window[store][key])return cb(window[store][key]);
  const idx=window.SERIES_INDEX;
  let file;
  if(kind==='t'){
    if(!idx||!idx.tickers.includes(key))return cb(null);
    file='data/series/'+key.replace(/[^A-Za-z0-9._-]/g,'_')+'.js';
  }else{
    const slug=idx&&idx.industries&&idx.industries[key];
    if(!slug)return cb(null);
    file='data/series/industry/'+slug+'.js';
  }
  if(_loaded[file])return cb(null);
  _loaded[file]=1;
  const s=document.createElement('script');
  s.src=file;
  s.onload=()=>cb((window[store]||{})[key]||null);
  s.onerror=()=>cb(null);   // 조용히 넘어가지 않고 '데이터 준비 중'을 표시한다
  document.head.appendChild(s);
}

function miniChart(dates,lines,opts={}){
  const W=opts.w||880,H=opts.h||190,PL=54,PR=14,PT=16,PB=26;
  const pts=lines.filter(l=>l.v&&l.v.some(x=>x!=null));
  if(!pts.length||dates.length<2)return '<div class="empty">데이터 없음</div>';
  let lo=Infinity,hi=-Infinity;
  for(const l of pts)for(const v of l.v){if(v==null)continue;if(v<lo)lo=v;if(v>hi)hi=v;}
  if(!(hi>lo)){hi=lo+1;lo=lo-1;}
  const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  const n=dates.length;
  const X=i=>PL+(i*(W-PL-PR))/(n-1);
  const Y=v=>PT+(H-PT-PB)-((v-lo)/(hi-lo))*(H-PT-PB);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto">`;
  // 0 기준선 (RS/WRS 는 0 이 QQQ 와 동일 성과)
  if(lo<0&&hi>0){s+=`<line x1="${PL}" y1="${Y(0).toFixed(1)}" x2="${W-PR}" y2="${Y(0).toFixed(1)}" stroke="#484f58" stroke-width="1" stroke-dasharray="4 4"/>`;
    s+=`<text x="${PL-6}" y="${(Y(0)+4).toFixed(1)}" fill="#6e7681" font-size="10" text-anchor="end">0</text>`;}
  // y 눈금 (상/하)
  for(const v of [hi-pad,lo+pad]){
    s+=`<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="#21262d" stroke-width="1"/>`;
    s+=`<text x="${PL-6}" y="${(Y(v)+4).toFixed(1)}" fill="#6e7681" font-size="10" text-anchor="end">${opts.fmt?opts.fmt(v):v.toFixed(opts.dec??2)}</text>`;
  }
  for(const l of pts){
    let d='',open=false;
    l.v.forEach((v,i)=>{if(v==null){open=false;return;}d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';open=true;});
    s+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="1.8" stroke-linejoin="round"/>`;
  }
  // x 라벨 (처음/중간/끝)
  for(const i of [0,Math.floor(n/2),n-1]){
    s+=`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#6e7681" font-size="10" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(dates[i])}</text>`;
  }
  s+='</svg>';
  const leg=pts.map(l=>`<span style="color:${l.c};font-size:11px;margin-right:12px">■ ${esc(l.n)} <b>${l.v.filter(x=>x!=null).slice(-1)[0]?.toFixed(opts.dec??4)??'—'}</b></span>`).join('');
  return `<div>${leg}</div>${s}`;
}

/* ── 종목 팝업 ── */
/* ── 티커 검색 ──
   유니버스(1,412종목, 약 650KB)는 초기 로딩에 넣지 않는다. 검색창을 처음 쓸 때만
   <script> 를 주입해 불러온다 (file:// 에서도 동작하는 loadSeries 와 같은 방식). */
let _uniLoading=false,_uniPending=[];
function loadUniverse(cb){
  if(window.UNIVERSE_DATA)return cb(window.UNIVERSE_DATA);
  _uniPending.push(cb);
  if(_uniLoading)return;
  _uniLoading=true;
  const s=document.createElement('script');
  s.src='data/universe.js';
  const done=(v)=>{_uniPending.splice(0).forEach(f=>f(v));};
  s.onload=()=>done(window.UNIVERSE_DATA||null);
  s.onerror=()=>done(null);   // 실패를 삼키지 않는다 — 호출부가 안내 문구를 띄운다
  document.head.appendChild(s);
}
function uniRow(t){
  const U=window.UNIVERSE_DATA;
  if(!U)return null;
  return U.rows.find(r=>r.t===t)||null;
}
/* 검색으로 들어온 종목에게 "그 업종에 지금 돈이 들어오는가"를 보여준다 */
function uniIndustryCard(U){

    pending:'⭐ 아직 안 왔지만 실적 기대가 쌓이는 중',outflow:'📉 돈이 빠지는 중',

    변화율은 나누는 값이 0에 가까우면 숫자가 커지므로 <b>크기보다 순위 변동으로</b> 읽어주세요.</div></div>`;

function searchUniverse(q){
  const U=window.UNIVERSE_DATA;
  if(!U)return [];
  const s=q.trim().toLowerCase();
  if(!s)return [];
  const hit=[];
  for(const r of U.rows){
    const t=r.t.toLowerCase();
    let score=-1;
    if(t===s)score=0;
    else if(t.startsWith(s))score=1;
    else if(r.ko&&r.ko.toLowerCase().includes(s))score=2;
    else if(r.en&&r.en.toLowerCase().includes(s))score=3;
    else if(t.includes(s))score=4;
    if(score>=0)hit.push({r,score});
  }
  return hit.sort((a,b)=>a.score-b.score||a.r.t.localeCompare(b.r.t)).slice(0,8).map(x=>x.r);
}

function renderSug(list,msg){
  const box=$('sug');
  if(msg){box.innerHTML=`<div class="msg">${esc(msg)}</div>`;box.classList.add('on');return;}
  if(!list.length){box.classList.remove('on');return;}
  box.innerHTML=list.map((r,i)=>{
    const known=(D.t2&&D.t2.picks||[]).some(p=>p.ticker===r.t);
    return `<div class="it${i===0?' sel':''}" data-t="${esc(r.t)}">
      <b>${esc(r.t)}</b><span>${esc(r.ko||r.en||'')}</span>
      <i>${esc(r.i||'')}${known?' · 오늘 선정':''}</i></div>`;
  }).join('');
  box.classList.add('on');
  box.querySelectorAll('.it').forEach(e=>e.onclick=()=>{pickSug(e.dataset.t);});
}
function pickSug(t){
  $('sug').classList.remove('on'); $('q').value='';
  openModal(t);
}
function initSearch(){
  const q=$('q'),box=$('sug');
  const run=()=>{
    const v=q.value.trim();
    if(!v){box.classList.remove('on');return;}
    if(!window.UNIVERSE_DATA){
      renderSug([],'종목 데이터를 불러오는 중…');
      loadUniverse(u=>{ if(!u){renderSug([],'종목 데이터를 불러오지 못했습니다 (data/universe.js)');return;} run(); });
      return;
    }
    const list=searchUniverse(v);
    if(!list.length){renderSug([],`"${v}" 는 RS 유니버스 ${window.UNIVERSE_DATA.count}종목에 없습니다 (미국 상장이 아니거나 데이터 미수집)`);return;}
    renderSug(list);
  };
  q.addEventListener('input',run);
  q.addEventListener('focus',()=>{ loadUniverse(()=>{}); if(q.value.trim())run(); });
  q.addEventListener('keydown',e=>{
    const items=[...box.querySelectorAll('.it')];
    if(!items.length)return;
    const cur=items.findIndex(x=>x.classList.contains('sel'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const nx=(cur+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items.forEach(x=>x.classList.remove('sel')); items[nx].classList.add('sel');
      items[nx].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){ e.preventDefault(); pickSug((items[cur<0?0:cur]).dataset.t); }
    else if(e.key==='Escape'){ box.classList.remove('on'); }
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search'))box.classList.remove('on'); });
}

      ${x.final&&typeof x.final==='object'?`
      <div class="stat"><div class="n">${n(x.final.m1,4)}</div><div class="l">Final_WRS 1개월</div></div>
      <div class="stat"><div class="n">${n(x.final.m3,4)}</div><div class="l">Final_WRS 3개월</div></div>
      <div class="stat"><div class="n">${n(x.final.m6,4)}</div><div class="l">Final_WRS 6개월</div></div>`:''}
      </div><div class="note">WRS = 업종 내 시총가중 평균 RS. 사이트는 6개월만 제공하므로 1M/3M 은 동일 공식으로 자체 계산했습니다.${x.final?' Final_WRS = WRS × 승률(업종 내 상승 종목 비율) — 사이트의 Final 컬럼과 같은 공식.':''}
      ${C.m1!==C.m6?`<br>⚠️ 기간별 종목수가 다릅니다 (1M ${C.m1} / 3M ${C.m3} / 6M ${C.m6}) — 해당 기간 RS 가 결측인 종목이 제외되기 때문입니다.`:''}</div></div>`;
  }
  // ── 자금 흐름 판정 + 종목 분해 ──
  const fl=((D.t5&&D.t5.flow&&D.t5.flow.industries)||[]).find(z=>z.key===key);
  if(fl){
    const [ko,why]=FLOW_KO[fl.flow]||['—',''];
    const dd=fl.d200Delta;
    h+=`<div class="card"><h2>지금 이 업종에 돈이 들어오나</h2>
      <div class="verdict ${['leading','inflow'].includes(fl.flow)?'v-green':fl.flow==='outflow'?'v-red':'v-yellow'}">${ko} — ${esc(why)}</div>
      <div class="funnel" style="margin-top:9px">
        <span>업종 순위 <b>${fl.FRANK}위</b></span>
        ${fl.frank25!=null?`<span>25거래일 전 대비 <b>${fl.frank25>0?'+':''}${fl.frank25}계단</b></span>`:''}
        <span>${fl.count}종목 중 <b>${Math.round((fl.winRate||0)*fl.count)}개</b> 상승</span>
        <span>${esc(fl.stageKo)}</span>
      </div>
      <div class="note" style="margin-top:8px">${esc(fl.stageNote)}.
        1년 평균 대비 ${n(fl.d200,1)}%${dd!=null?` (25거래일 전보다 ${dd>0?'+':''}${n(dd,1)}%p ${dd>0?'벌어지는':'좁혀지는'} 중)`:''} ·
        두 달 평균 대비 ${n(fl.d50,1)}% ·
        올해 실적 전망 ${n(fl.cy,1)}%${fl.coverage?` (애널리스트 ${fl.coverage}명 중 ${n(fl.upRatio,0)}% 상향)`:''}
        <br>업종 강도 10거래일 ${n(fl.f10,1)}% · 25거래일 ${n(fl.f25,1)}%
        ${fl.siteF10!=null?` · <span class="dim">RS 사이트 화면값은 ${n(fl.siteF10,1)}% — 사이트가 오늘 값과 과거 값에 서로 다른 공식을 써서 다릅니다</span>`:''}
      </div></div>`;
  }
  h+=`<div class="card"><h2>WRS(1M/3M/6M) 최근 3개월 추이</h2><div id="ix-wrs"><div class="pending">불러오는 중…</div></div></div>`;
  // 이 업종에 속한 2팀 선정 종목 — 흐름 교차가 있으면 초입/눌림/과열/이탈로 분해해 보여준다
  const cross=((D.chief&&D.chief.flowCross)||null);
  const crossHit=cross?[...(cross.inflow||[]),...(cross.outflow||[]),...(cross.pending||[])]
    .find(z=>`${z.sector}|${z.industry}`===key):null;
  const mem=(D.t2&&D.t2.picks||[]).filter(p=>`${p.sector}|${p.industry}`===key);
  if(crossHit&&crossHit.picks&&crossHit.picks.length){
    h+=`<div class="card"><h2>이 업종의 2팀 선정 종목 ${crossHit.picks.length}개 — 지금 어느 자리인가</h2>
      <div class="scroll"><table><thead><tr><th class="l">종목</th><th>두 달 평균 대비</th><th>1년 평균 대비</th>
        <th>올해 전망</th><th>판정</th><th>추적</th></tr></thead><tbody>`+
      crossHit.picks.map(p=>`<tr>
        <td class="l"><span class="tk" data-t="${esc(p.ticker)}">${esc(p.ticker)}</span>${p.name?` <span class="dim">${esc(p.name)}</span>`:''}</td>
        <td>${pc(p.d50)}</td><td>${pc(p.d200)}</td><td>${pc(p.cy)}</td>
        <td>${esc(p.stageKo)}${p.breakout?' 🚀':''}</td>
        <td><span class="b ${p.tracking==='active'?'b-grn':'b-red'}">${p.tracking==='active'?'추적 중':'배제'}</span></td>
      </tr>`).join('')+`</tbody></table></div>
      <div class="note">두 달 평균(50일선) 대비가 30%를 넘으면 단기 과열, 음수면 이탈입니다.
      1년 평균(200일선) 대비가 낮을수록 상승 사이클 초입이라 위로 갈 여지가 남습니다. 🚀 는 거래량까지 실린 전고점 돌파.</div></div>`;
  } else {
    h+=`<div class="card"><h2>이 업종의 2팀 선정 종목 ${mem.length}개</h2>`+
      (mem.length?mem.map(p=>`<span class="chip"><span class="tk" data-t="${esc(p.ticker)}">${esc(p.ticker)}</span>
        상위 ${tp(p.bestPct)}% · ADR ${n(p.adr,1)}</span> `).join('')
        :'<div class="empty">이 업종에서 오늘 기준을 통과한 종목이 없습니다</div>')+`</div>`;
  }
  // 이 업종 하나만 골라서 보여준다 (없으면 안내)
  h+=indCards(((D.t5&&D.t5.llm&&D.t5.llm.industries)||[]).filter(x=>
    x.key===key||String(x.industry||'').includes(String(key).split('|')[1]||'␀')),true);

  $('mbox').innerHTML=h;$('modal').classList.add('on');bindTk();
  loadSeries('i',key,s=>{
    const el=$('ix-wrs');if(!el)return;
    if(!s||!s.d||s.d.length<2){el.innerHTML='<div class="pending">시계열 없음 — <code>node scripts/backfill-history.js</code> 실행 필요</div>';return;}
    el.innerHTML=miniChart(s.d,[
      {n:'WRS 1M',v:s.m1,c:'#f5a524'},{n:'WRS 3M',v:s.m3,c:'#58a6ff'},{n:'WRS 6M',v:s.m6,c:'#c084fc'}],{dec:4})
      +`<div class="note">0 = QQQ 와 동일 성과 · ${s.d.length}거래일 (주말 스냅샷 제외) · 매 스냅샷의 data[] 에서 재계산</div>`;
  });
}

function closeModal(){$('modal').classList.remove('on');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
document.onkeydown=e=>{if(e.key==='Escape')closeModal();};

/* ── 탭 ── */
$('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab${i===0?' on':''}" data-k="${t[0]}">${t[1]}</button>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('p-'+b.dataset.k).classList.add('on');
});

hud();renderChief();renderT1();renderT2();renderT3();renderT4();renderT5();renderCC();renderHist();

/* 리서치룸에서 #t1 같은 해시로 들어오면 해당 탭을 연다 */
function openTabFromHash(){
  const k=(location.hash||'').replace('#','');
  if(!k)return;
  const b=document.querySelector(`.tab[data-k="${k}"]`);
  if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('p-'+k).classList.add('on');
  window.scrollTo(0,0);
}
openTabFromHash();
window.addEventListener('hashchange',openTabFromHash);
initSearch();
</script>
